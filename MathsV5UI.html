<style>
/* Final stability/polish layer: compact English-style strip, plain revision rows, fast quiz controls. */
.v5-scope-strip{margin:8px 0 12px}.v5-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.v5-pill{display:flex;align-items:center;justify-content:center;gap:4px;min-width:0;border:1px solid var(--line);border-radius:999px;padding:7px 5px;font-size:9px;font-weight:750;white-space:nowrap}.v5-pill b{font-size:12px}.v5-pill.coverage{background:var(--okbg);color:var(--ok);border-color:var(--ok)}.v5-pill.wrong{background:var(--badbg);color:var(--bad);border-color:var(--bad)}.v5-pill.difficult{background:var(--primary2);color:var(--primary);border-color:var(--primary)}.v5-pill.starred{background:var(--warnbg);color:var(--warn);border-color:var(--warn)}
.v5-top-installed [data-v4strip]{display:none!important}.v5-top-installed .v3-card:has([data-v4strip]){background:transparent;border:0;box-shadow:none;padding:0}.v5-day-list{border-top:1px solid var(--line)}.v5-day-row{border-bottom:1px solid var(--line);background:transparent}.v5-day-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 2px;cursor:pointer}.v5-day-body{padding:0 0 13px}.v5-day-head b{font-size:14px}.v5-day-head .muted{font-size:10px}.v5-revision-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.v5-revision-actions .btn{min-height:42px;padding:8px 5px;font-size:10px}
.v5-quiz-controls{display:flex;align-items:center;gap:6px;flex:0 0 auto}.v5-timer{min-height:34px!important;padding:6px 9px!important;border-radius:999px!important;font-size:10px!important;white-space:nowrap}.v5-timer.on{background:var(--primary2)!important;color:var(--primary)!important;border-color:var(--primary)!important}.quiz-head{align-items:flex-start}.dock-nav{gap:8px!important}.dock-nav .btn{min-height:48px!important;padding:10px 12px!important;font-size:16px!important;border-radius:13px!important}.dock-tools .btn{font-size:10px!important}.v4-pill.difficult b{font-size:0}.v4-pill.difficult b:after{content:'🚒';font-size:12px}.v4-scope-count{display:none!important}
@media(max-width:390px){.v5-pill{font-size:8px;padding:6px 3px}.v5-pill b{font-size:11px}.v5-revision-actions .btn{font-size:9px}.v5-timer{font-size:9px!important;padding:5px 7px!important}.dock-nav .btn{font-size:15px!important}}
</style>
<script>
(function(){
'use strict';
var base={home:window.home,newPage:window.openGlobalNewV3,starPage:window.openStarredRevisionV3,concepts:window.openConceptsV4,chapter:window.openChapterHub,topic:window.openTopicHub,group:window.openStudyGroup,demand:window.startDemandSet,calc:window.openCalculationHub,render:window.renderQuestion,openQuiz:window.openQuiz,saveHome:window.saveAndHome};
var timerHandle=null;
function api(fn,arg){return new Promise(function(ok,bad){var r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){bad(new Error(e&&e.message?e.message:String(e)))});if(fn==='metric')r.getMathsScopeMetricV5(arg||{});else if(fn==='starred')r.getStarredRevisionV4();else if(fn==='view')r.getMathsViewItemsV4(arg||{});else if(fn==='quiz')r.startMathsV5Quiz(arg||{});else bad(new Error('Unknown V5 call'))})}
function strip(m){m=m||{};return '<div class="v5-strip"><div class="v5-pill coverage">Coverage <b>'+Number(m.coverage||0)+'%</b></div><div class="v5-pill wrong">✕ Wrong <b>'+Number(m.wrong||0)+'</b></div><div class="v5-pill difficult">🚒 Difficult <b>'+Number(m.difficult||0)+'</b></div><div class="v5-pill starred">☆ Starred <b>'+Number(m.starred||0)+'</b></div></div>'}
function polishDifficult(root){(root||document).querySelectorAll('button').forEach(function(b){var t=b.textContent.trim();if(t==='Difficult'||t==='◇ Difficult'||t==='◆ Difficult'||t==='🔥 Difficult')b.textContent='🚒 Difficult'});(root||document).querySelectorAll('.v4-pill.difficult').forEach(function(p){var b=p.querySelector('b');if(b)b.textContent='🚒 '+String((b.textContent.match(/\d+/)||['0'])[0])})}
function addTopStrip(req,delay){setTimeout(function(){var main=$('#main'),content=main&&main.querySelector('.content');if(!content)return;content.classList.add('v5-top-installed');var old=content.querySelector('.v5-scope-strip');if(old)old.remove();var slot=document.createElement('div');slot.className='v5-scope-strip';slot.innerHTML=strip({});var anchor=content.firstElementChild;if(anchor&&anchor.tagName==='BUTTON')anchor.insertAdjacentElement('afterend',slot);else content.insertBefore(slot,content.firstChild);api('metric',req).then(function(m){if(slot.isConnected)slot.innerHTML=strip(m)}).catch(function(){});polishDifficult(content)},delay||0)}
function countPicker(req,label){var m=$('#modal');m.className='modal';m.innerHTML='<div class="sheet"><div class="row between"><div><div class="eyebrow">'+esc(label)+'</div><div class="quiz-title">How many questions?</div></div><button class="iconbtn" id="v5cx">×</button></div><div class="v5-revision-actions" style="margin-top:14px"><button class="btn ghost" data-v5n="10">10</button><button class="btn ghost" data-v5n="20">20</button><button class="btn ghost" data-v5n="25">25</button></div></div>';$('#v5cx').onclick=closeModal;m.onclick=function(e){if(e.target===m)closeModal()};m.querySelectorAll('[data-v5n]').forEach(function(b){b.onclick=function(){closeModal();runQuiz(Object.assign({},req,{count:Number(b.dataset.v5n)}))}})}
function runQuiz(req){loading(true);api('quiz',req).then(function(s){loading(false);if(!s||s.ok===false)return toast((s&&s.message)||'No eligible questions');window.openQuiz(s)}).catch(function(e){loading(false);toast(e.message||String(e))})}
function openReadOnly(req,title){loading(true);api('view',req).then(function(items){loading(false);var m=$('#modal');m.className='modal';m.innerHTML='<div class="sheet"><div class="row between"><div><div class="eyebrow">Read-only revision</div><div class="quiz-title">'+esc(title)+'</div></div><button class="iconbtn" id="v5vx">×</button></div><div class="muted" style="font-size:11px;margin-top:4px">'+items.length+' saved questions · no attempts recorded</div><div class="v4-read-list">'+items.map(function(x,i){return '<div class="v4-read-item" data-v5i="'+i+'"><b>'+esc(x.chapter||'Maths')+'</b><div class="muted" style="font-size:11px;margin-top:3px">'+esc(String(x.prompt||'').slice(0,140))+'</div></div>'}).join('')+'</div></div>';$('#v5vx').onclick=closeModal;m.onclick=function(e){if(e.target===m)closeModal()};m.querySelectorAll('[data-v5i]').forEach(function(el){el.onclick=function(){var x=items[Number(el.dataset.v5i)];m.querySelector('.sheet').innerHTML='<button class="btn ghost" id="v5back">← Back</button><div style="margin-top:12px"><div class="eyebrow">'+esc(x.chapter||'Maths')+'</div><div class="quiz-title">'+esc(x.topic||'Saved question')+'</div></div><div class="v3-card" style="margin-top:12px;white-space:pre-wrap;line-height:1.55"><b>Question</b>\n'+esc(x.prompt||'')+'\n\n<b>Answer</b>\n'+esc(x.answer||'')+(x.explanation?'\n\n<b>Explanation</b>\n'+esc(x.explanation):'')+'</div>';$('#v5back').onclick=function(){closeModal();openReadOnly(req,title)}}})}).catch(function(e){loading(false);toast(e.message||String(e))})}
function revisionActions(prefix){return '<div class="v5-revision-actions"><button class="btn ghost" data-'+prefix+'="view">View All</button><button class="btn ghost" data-'+prefix+'="all">Practice All</button><button class="btn ghost" data-'+prefix+'="new">New</button><button class="btn ghost" data-'+prefix+'="weak">Weak</button><button class="btn ghost" data-'+prefix+'="difficult">🚒 Difficult</button><button class="btn soft" data-'+prefix+'="random">Random</button></div>'}
function bindRevision(root,prefix,req,title){root.querySelectorAll('[data-'+prefix+']').forEach(function(b){b.onclick=function(e){e.stopPropagation();var k=b.getAttribute('data-'+prefix);if(k==='view')return openReadOnly(req,title);var r=Object.assign({},req,{kind:k,title:title});if(k==='all')runQuiz(r);else countPicker(r,title+' · '+b.textContent.trim())}})}
function statLine(s){s=s||{};return Number(s.starred||0)+' Starred · '+Number(s.mastered||0)+' Mastered · '+Number(s.focus||0)+' Focus'}
function row(title,stats,lo,hi){return '<div class="v5-day-row"><div class="v5-day-head" data-v5range="'+lo+'-'+hi+'"><div><b>'+esc(title)+'</b><div class="muted">'+statLine(stats)+'</div></div><span class="v4-chevron">›</span></div><div class="v5-day-body hidden" data-v5body="'+lo+'-'+hi+'">'+revisionActions('v5rev')+'</div></div>'}
function renderStarred(data,metric){if(app.view!=='starred')return;var h='<div class="content"><button class="btn ghost" id="v5starback">← Home</button><div class="v5-scope-strip">'+strip(metric||{})+'</div><div class="section-title">Starred Revision</div><div class="v3-card"><b>All Starred Revision</b><div class="muted" style="font-size:11px;margin:4px 0 10px">'+statLine(data.stats)+'</div>'+revisionActions('v5top')+'</div><div class="section-title">Study history</div><div class="v5-day-list">';(data.recentDays||[]).forEach(function(d){h+=row('Day '+d.day,d.stats,d.day,d.day)});(data.tenBlocks||[]).forEach(function(b){h+=row('Days '+b.lo+'–'+b.hi,b.stats,b.lo,b.hi)});(data.months||[]).forEach(function(b){h+=row(b.label+' · Days '+b.lo+'–'+b.hi,b.stats,b.lo,b.hi)});h+='</div></div>';$('#main').innerHTML=h;$('#v5starback').onclick=window.home;bindRevision($('#main'),'v5top',{scope:'star_history',starLo:1,starHi:999999},'All Starred Revision');$('#main').querySelectorAll('[data-v5range]').forEach(function(head){head.onclick=function(){var p=head.dataset.v5range.split('-'),lo=Number(p[0]),hi=Number(p[1]),body=$('[data-v5body="'+lo+'-'+hi+'"]');body.classList.toggle('hidden');head.querySelector('.v4-chevron').textContent=body.classList.contains('hidden')?'›':'⌄';if(!body.classList.contains('hidden'))bindRevision(body,'v5rev',{scope:'star_history',starLo:lo,starHi:hi},lo===hi?'Day '+lo:'Days '+lo+'–'+hi)}})}
window.openStarredRevisionV3=function(){app.view='starred';nav('home');var cached=null;try{cached=JSON.parse(localStorage.getItem('maths-v5:starred')||'null')}catch(e){}if(cached)renderStarred(cached.data,cached.metric);Promise.all([api('starred'),api('metric',{scope:'star_history',starLo:1,starHi:999999})]).then(function(x){var v={data:x[0],metric:x[1]};try{localStorage.setItem('maths-v5:starred',JSON.stringify(v))}catch(e){}renderStarred(v.data,v.metric)}).catch(function(e){if(!cached)toast(e.message||String(e))})};
/* Always route Home cards to the final handlers, even if an older Home renderer was visible for the first paint. */
document.addEventListener('click',function(e){var n=e.target.closest&&e.target.closest('#v3New,#v4new');if(n){e.preventDefault();e.stopImmediatePropagation();window.openGlobalNewV3();return}var s=e.target.closest&&e.target.closest('#v3Star,#v4star');if(s){e.preventDefault();e.stopImmediatePropagation();window.openStarredRevisionV3();return}var c=e.target.closest&&e.target.closest('#v4concept');if(c){e.preventDefault();e.stopImmediatePropagation();window.openConceptsV4()}},true);
window.home=function(){var navEl=$('#nav');if(navEl)navEl.classList.remove('hidden');var out=base.home&&base.home();setTimeout(function(){var n=$('#nav');if(n)n.classList.remove('hidden');polishDifficult($('#main'))},0);return out};
window.openChapterHub=function(ch){base.chapter(ch);addTopStrip({scope:'chapter',chapter:ch,title:ch},0)};
window.openTopicHub=function(ch,t){base.topic(ch,t);addTopStrip({scope:'topic',chapter:ch,majorTopic:t,title:t},0)};
window.openStudyGroup=function(k){base.group(k);var req;if(k==='mocks')req={scope:'demand_set',setId:'MOCK_QUESTIONS',title:'Mock Questions'};else{var list=(app.bootstrap.chapters||[]).filter(function(c){var x=String(c.chapter||'').toLowerCase(),g=/fraction pattern|triplet|calculation memory|square|cube/.test(x)?'misc':/percentage|profit|loss|discount|ratio|proportion|average|mixture|alligation|interest|time.*work|pipe|cistern|speed|distance|train|boat|stream|partnership|ages|work.*wage/.test(x)?'arithmetic':'advanced';return g===k});req={scope:'group',chapters:list.map(function(c){return c.chapter}),groupName:k,title:k}}addTopStrip(req,70)};
window.startDemandSet=function(id){base.demand(id);if(String(id)!=='CALC_TRAINING')addTopStrip({scope:'demand_set',setId:String(id),title:'Saved Set'},30)};
window.openCalculationHub=function(id){base.calc(id);addTopStrip({scope:'demand_set',setId:String(id),title:'Calculation Training'},30)};
var oldNew=window.openGlobalNewV3;window.openGlobalNewV3=function(){var r=oldNew();setTimeout(function(){var main=$('#main');if(app.view==='new'){polishDifficult(main);var card=main.querySelector('.v3-card');if(card){var existing=card.querySelector('.v4-strip-wrap');if(existing){var slot=document.createElement('div');slot.className='v5-scope-strip';slot.innerHTML=existing.innerHTML.replace(/◆/g,'🚒');card.parentElement.insertBefore(slot,card);existing.style.display='none'}}}},80);return r};
var oldConcepts=window.openConceptsV4;window.openConceptsV4=function(){var r=oldConcepts();setTimeout(function(){if(app.view==='concepts')addTopStrip({scope:'concept_saved',title:'Concepts'},0)},80);return r};
function fmt(ms){var sec=Math.max(0,Math.floor(ms/1000)),m=Math.floor(sec/60),s=sec%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function timerMs(){if(!app.quiz)return 0;var q=app.quiz,baseMs=Number(q._v5TimerElapsed||0);return q._v5TimerOn&&q._v5TimerStarted?baseMs+(Date.now()-q._v5TimerStarted):baseMs}
function paintTimer(){var b=$('#v5timer');if(!b||!app.quiz)return;b.className='btn ghost v5-timer'+(app.quiz._v5TimerOn?' on':'');b.textContent=app.quiz._v5TimerOn?'⏱ '+fmt(timerMs()):'⏱ Timer'}
function timerTick(){if(timerHandle)clearInterval(timerHandle);timerHandle=setInterval(function(){if(app.quiz&&app.quiz._v5TimerOn)paintTimer()},1000)}
function toggleTimer(){if(!app.quiz)return;var q=app.quiz;if(q._v5TimerOn){q._v5TimerElapsed=timerMs();q._v5TimerStarted=0;q._v5TimerOn=false}else{q._v5TimerOn=true;q._v5TimerStarted=Date.now()}paintTimer();timerTick()}
function installTimer(){var head=document.querySelector('.quiz-head'),counter=head&&head.querySelector('.quiz-jump-tag,.tag');if(!head||!counter)return;var wrap=head.querySelector('.v5-quiz-controls');if(!wrap){wrap=document.createElement('div');wrap.className='v5-quiz-controls';counter.parentNode.insertBefore(wrap,counter);wrap.appendChild(counter)}var b=wrap.querySelector('#v5timer');if(!b){b=document.createElement('button');b.id='v5timer';b.type='button';b.className='btn ghost v5-timer';wrap.insertBefore(b,counter);b.onclick=toggleTimer}paintTimer();timerTick()}
window.renderQuestion=function(){base.render();if(!app.quiz)return;installTimer();var db=$('#v4diffbtn');if(db)db.textContent='🚒 Difficult';polishDifficult(document.querySelector('.quiz-dock'));var navEl=$('#nav');if(navEl)navEl.classList.add('hidden')};
window.openQuiz=function(s){if(timerHandle){clearInterval(timerHandle);timerHandle=null}var r=base.openQuiz(s);if(app.quiz){app.quiz._v5TimerOn=false;app.quiz._v5TimerElapsed=0;app.quiz._v5TimerStarted=0}installTimer();return r};
window.saveAndHome=function(){var navEl=$('#nav');if(navEl)navEl.classList.remove('hidden');var r=base.saveHome();setTimeout(function(){var n=$('#nav');if(n)n.classList.remove('hidden')},0);return r};
/* Final initial paint: replace any V3 Home handlers that were installed before V4/V5 loaded. */
setTimeout(function(){if(window.app&&app.view==='home')window.home()},0);
})();
</script>
