<script>
(function(){
'use strict';
var hub=null,ROUTE_KEY='maths-ui-route-v1';
function q(s,r){return (r||document).querySelector(s)}
function qa(s,r){return Array.from((r||document).querySelectorAll(s))}
function e(v){return typeof esc==='function'?esc(v):String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toastC(s){if(typeof toast==='function')toast(String(s||''))}
function load(on,label){var x=q('#loading');if(on&&x)x.setAttribute('data-label',label||'Loading concepts…');if(typeof loading==='function')loading(on);if(!on&&x)x.removeAttribute('data-label')}
function gas(name,arg){return new Promise(function(ok,bad){var r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(x){bad(new Error(x&&x.message?x.message:String(x)))});if(name==='hub')r.getConceptsHubV16();else if(name==='quiz')r.startConceptPracticeV16(arg||{});else if(name==='view')r.getConceptViewItemsV16(arg||{});else bad(new Error('Unknown Concepts endpoint'))})}
function setView(){try{if(window.app)app.view='concepts';if(typeof nav==='function')nav('home');var n=q('#nav');if(n)n.classList.remove('hidden')}catch(x){}}
function main(html){var m=q('#main');if(m)m.innerHTML=html;var n=q('#nav');if(n)n.classList.remove('hidden')}
function saveRoute(r){try{r=r||{type:'concepts'};r.ts=Date.now();localStorage.setItem(ROUTE_KEY,JSON.stringify(r))}catch(x){}}
function strip(metric){metric=metric||{};var old=q('#maStrip')||q('#mf-strip-host')||q('#maths-global-strip');if(!old){var top=q('.topbar');if(!top)return;old=document.createElement('div');old.id='maStrip';old.className='ma-strip-host';top.insertAdjacentElement('afterend',old)}old.innerHTML='<div class="ma-strip"><div class="ma-pill coverage">Coverage '+Number(metric.coverage||0)+'%</div><div class="ma-pill wrong">✕ '+Number(metric.wrong||0)+' Wrong</div><div class="ma-pill difficult">◆ '+Number(metric.difficult||0)+'</div><div class="ma-pill starred">☆ '+Number(metric.starred||0)+'</div></div>'}
function kicker(k,t,s){return '<div class="ma-kicker">'+e(k)+'</div><div class="ma-title">'+e(t)+'</div>'+(s?'<div class="ma-sub">'+e(s)+'</div>':'')}
function back(id,text){return '<button class="btn ghost ma-back" id="'+id+'">← '+e(text)+'</button>'}
function actions(){var items=[['view','View All'],['all','Practice All'],['new','New'],['weak','Weak'],['difficult','◆ Difficult'],['random','Random']];return '<div class="ma-actions">'+items.map(function(x){return '<button class="ma-action '+(x[0]==='difficult'?'difficult':'')+'" data-ch-action="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div>'}
function reqFor(chapter,topicKey,title){var r={title:title||'Concepts'};if(chapter)r.chapter=chapter;if(topicKey)r.majorTopicKey=topicKey;return r}
function countPicker(req,kind,label){var m=q('#modal');if(!m)return;m.className='modal';m.innerHTML='<div class="sheet"><div class="row between"><div><div class="eyebrow">'+e(label)+'</div><div class="quiz-title">How many questions?</div></div><button class="iconbtn" id="chCountX">×</button></div><div class="ma-actions" style="margin-top:14px"><button class="ma-action" data-ch-n="10">10</button><button class="ma-action" data-ch-n="20">20</button><button class="ma-action" data-ch-n="25">25</button></div></div>';q('#chCountX').onclick=closeModal;m.onclick=function(ev){if(ev.target===m)closeModal()};qa('[data-ch-n]',m).forEach(function(b){b.onclick=function(){closeModal();runQuiz(Object.assign({},req,{kind:kind,count:Number(b.dataset.chN)}),label)}})}
function runQuiz(req,label){load(true,'Loading '+String(label||'concept practice')+'…');gas('quiz',req).then(function(s){load(false);if(!s||s.ok===false)return toastC(s&&s.message||'No eligible concept questions');if(typeof window.openQuiz==='function')window.openQuiz(s)}).catch(function(x){load(false);toastC(x.message)})}
function viewAll(req,title){load(true,'Loading concepts…');gas('view',req).then(function(items){load(false);items=items||[];var m=q('#modal');if(!m)return;m.className='modal';m.innerHTML='<div class="sheet"><div class="row between"><div><div class="eyebrow">Read-only Concepts</div><div class="quiz-title">'+e(title)+'</div></div><button class="iconbtn" id="chViewX">×</button></div><div class="muted" style="font-size:12px;margin:5px 0 12px">'+items.length+' concepts · browsing does not create attempts</div><div class="ma-list">'+items.map(function(x,i){return '<div class="ma-card"><div class="ma-row-title">'+e((i+1)+'. '+String(x.prompt||''))+'</div><div class="ma-row-sub" style="margin-top:8px"><b>Answer:</b> '+e(x.answer||'')+'</div>'+(x.explanation?'<div class="ma-row-sub" style="margin-top:6px">'+e(x.explanation)+'</div>':'')+(x.memoryCue?'<div class="ma-row-sub" style="margin-top:6px"><b>Memory:</b> '+e(x.memoryCue)+'</div>':'')+'</div>'}).join('')+'</div></div>';q('#chViewX').onclick=closeModal;m.onclick=function(ev){if(ev.target===m)closeModal()}}).catch(function(x){load(false);toastC(x.message)})}
function bindActions(root,req,title){qa('[data-ch-action]',root).forEach(function(b){b.onclick=function(ev){ev.stopPropagation();var k=b.dataset.chAction;if(k==='view')return viewAll(req,title);if(k==='all')return runQuiz(Object.assign({},req,{kind:'all'}),'Practice All');countPicker(req,k,b.textContent.trim())}})}
function chapterRow(name){return (hub&&hub.chapters||[]).find(function(x){return String(x.chapter)===String(name)})||null}
function topicRow(chapter,key){var c=chapterRow(chapter);return c&&(c.topics||[]).find(function(x){return String(x.key)===String(key)||String(x.name||'').toLowerCase()===String(key||'').toLowerCase()})||null}
function renderHub(){setView();var d=hub||{metric:{},chapters:[]};main('<div class="ma-page">'+back('maConceptBack','Home')+kicker('Saved','🧠 Concepts','Questions deliberately saved for concept revision.')+'<div class="ma-actions-shell">'+actions()+'</div><div class="ma-section">By Chapter</div><div class="ma-list">'+(d.chapters||[]).map(function(c){return '<div class="ma-card ma-click" data-ma-conch="'+e(c.chapter)+'"><div class="ma-row"><div class="ma-row-title">'+e(c.chapter)+'</div><span class="ma-chip">'+Number(c.metric&&c.metric.total||0)+' Q</span></div></div>'}).join('')+'</div></div>');strip(d.metric);q('#maConceptBack').onclick=function(){saveRoute({type:'home'});if(typeof window.home==='function')window.home()};bindActions(q('#main'),reqFor('','','Concepts'),'Concepts');qa('[data-ma-conch]').forEach(function(x){x.onclick=function(){saveRoute({type:'conceptChapter',chapter:x.dataset.maConch});openChapter(x.dataset.maConch)}});window.scrollTo(0,0)}
function openChapter(chapter){var row=chapterRow(chapter);if(!row)return toastC('Concept chapter not found');setView();var nested=!!row.nested&&(row.topics||[]).length>0,sub=Number(row.metric&&row.metric.total||0)+' saved questions',html='<div class="ma-page">'+back('maConChBack','Concepts')+kicker('Concepts',chapter,sub)+'<div class="ma-actions-shell">'+actions()+'</div>'+(nested?'<div class="ma-section">Topics</div><div class="ma-list">'+row.topics.map(function(t){return '<div class="ma-card ma-click" data-ma-contopic="'+e(t.key)+'" data-ma-conchapter="'+e(chapter)+'"><div class="ma-row"><div><div class="ma-row-title">'+e(t.name)+'</div><div class="ma-row-sub">'+Number(t.metric&&t.metric.total||0)+' saved questions</div></div><span class="ma-chevron">›</span></div></div>'}).join('')+'</div>':'')+'</div>';main(html);strip(row.metric);q('#maConChBack').onclick=function(){saveRoute({type:'concepts'});renderHub()};bindActions(q('#main'),reqFor(chapter,'',chapter+' · Concepts'),chapter+' · Concepts');qa('[data-ma-contopic]').forEach(function(x){x.onclick=function(){saveRoute({type:'conceptTopic',chapter:x.dataset.maConchapter,key:x.dataset.maContopic});openTopic(x.dataset.maConchapter,x.dataset.maContopic)}});window.scrollTo(0,0)}
function openTopic(chapter,key){var row=topicRow(chapter,key);if(!row)return toastC('Concept topic not found');setView();main('<div class="ma-page">'+back('maConTopicBack',chapter)+kicker(chapter,row.name,Number(row.metric&&row.metric.total||0)+' saved questions')+'<div class="ma-actions-shell">'+actions()+'</div></div>');strip(row.metric);q('#maConTopicBack').onclick=function(){saveRoute({type:'conceptChapter',chapter:chapter});openChapter(chapter)};bindActions(q('#main'),reqFor(chapter,row.key,chapter+' · '+row.name),chapter+' · '+row.name);window.scrollTo(0,0)}
function openConcepts(){setView();var c=null;try{c=JSON.parse(localStorage.getItem('maths-concepts-v16-hub')||'null')}catch(_){}if(c&&c.data){hub=c.data;load(false);renderHub()}else load(true,'Loading concepts…');return gas('hub').then(function(d){hub=d||{metric:{},chapters:[]};try{localStorage.setItem('maths-concepts-v16-hub',JSON.stringify({ts:Date.now(),data:hub}))}catch(_){}load(false);if(app.view==='concepts')renderHub();return hub}).catch(function(x){load(false);if(!c)toastC(x.message);return hub})}
window.openConceptsV4=openConcepts;window.openConceptsV16=openConcepts;window.openConceptChapterV16=openChapter;window.openConceptTopicV16=openTopic;

document.addEventListener('click',function(ev){var x=ev.target&&ev.target.closest?ev.target.closest('#maConcept,#mfConcept'):null;if(!x)return;ev.preventDefault();ev.stopImmediatePropagation();saveRoute({type:'concepts'});openConcepts()},true);
setTimeout(function(){try{var r=JSON.parse(localStorage.getItem(ROUTE_KEY)||'null');if(!r||r.type!=='conceptTopic'||Date.now()-Number(r.ts||0)>24*60*60*1000)return;openConcepts().then(function(d){if(!d)return;openChapter(r.chapter);setTimeout(function(){openTopic(r.chapter,r.key)},60)})}catch(x){}},900);
})();
</script>
