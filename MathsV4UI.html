<style>
/* Maths V4: English-inspired compact hierarchy, Maths-specific semantics */
.v4-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin:10px 0}.v4-pill{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:7px 4px;text-align:center;font-size:10px;color:var(--muted)}.v4-pill b{display:block;font-size:14px;color:var(--text);line-height:1.15}.v4-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.v4-actions .btn{min-height:42px;padding:8px 5px;font-size:11px}.v4-resume{padding:8px 10px!important;min-height:0}.v4-resume b{font-size:13px!important}.v4-resume .muted{font-size:10px!important}.v4-row{padding:11px 12px}.v4-chevron{font-size:18px;color:var(--muted)}.v4-block{border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}.v4-block-head{padding:12px;cursor:pointer}.v4-block-body{padding:0 12px 12px}.v4-day{border-top:1px solid var(--line);padding:10px 0}.v4-progressbar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:7px 0}.v4-progressbar i{display:block;height:100%;background:var(--primary);border-radius:99px}.v4-overview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.v4-overview>div{text-align:center;padding:9px 3px;background:var(--primary2);border-radius:11px}.v4-overview b{display:block;font-size:17px}.v4-overview span{font-size:9px;color:var(--muted)}
/* English quiz proportions, preserving Maths diagrams/tables */
.question-card{border-radius:14px;padding:16px}.question{font-size:clamp(19px,4.8vw,25px);line-height:1.45;font-weight:750;margin:10px 0 16px}.question.q-medium{font-size:clamp(18px,4.3vw,23px)}.question.q-long,.question.q-xlong{font-size:clamp(16px,3.8vw,20px);line-height:1.5}.options{gap:9px}.option{align-items:flex-start;border-radius:12px;padding:13px 12px;min-height:54px;font-size:16px;line-height:1.4;gap:10px}.option .letter{width:28px;height:28px;flex:0 0 28px;border-radius:8px;font-size:14px}.answer-body{font-size:16px}.dock-nav .btn{min-height:44px}.dock-tools .btn{min-height:44px;font-size:12px}
@media(max-width:390px){.v4-pill{font-size:9px}.v4-pill b{font-size:13px}.v4-actions .btn{font-size:10px}.question-card{padding:14px}.question{font-size:20px}.option{font-size:15px;padding:12px 10px}.v4-overview b{font-size:15px}}
</style>
<script>
(function(){
'use strict';
var C='maths-v4:';
function cg(k){try{return JSON.parse(localStorage.getItem(C+k)||'null')}catch(e){return null}}
function cs(k,v){try{localStorage.setItem(C+k,JSON.stringify(v))}catch(e){}return v}
function drop(){['progress','new','starred'].forEach(function(k){try{localStorage.removeItem(C+k)}catch(e){}})}
function call(fn,arg){return new Promise(function(ok,bad){var r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){bad(new Error(e&&e.message?e.message:String(e)))});if(fn==='metric')r.getMathsScopeMetricV4(arg||{});else if(fn==='new')r.getMathsNewHubV4();else if(fn==='progress')r.getMathsProgressV4();else if(fn==='starred')r.getStarredRevisionV4();else if(fn==='quiz')r.startMathsV4Quiz(arg||{});else if(fn==='attempts')r.getSessionAttemptMapV3(arg);else bad(new Error('Unknown V4 call'))})}
function strip(m){m=m||{};return '<div class="v4-strip"><div class="v4-pill"><b>'+Number(m.coverage||0)+'%</b>Coverage</div><div class="v4-pill"><b>✕ '+Number(m.wrong||0)+'</b>Wrong</div><div class="v4-pill"><b>◆ '+Number(m.difficult||0)+'</b>Difficult</div><div class="v4-pill"><b>⭐ '+Number(m.starred||0)+'</b>Starred</div></div>'}
function actions(){return '<div class="v4-actions"><button class="btn ghost" data-v4="all">Practice All</button><button class="btn ghost" data-v4="new">New</button><button class="btn ghost" data-v4="weak">Weak</button><button class="btn ghost" data-v4="starred">⭐ Starred</button><button class="btn ghost" data-v4="difficult">◆ Difficult</button><button class="btn soft" data-v4="random">Random</button></div>'}
function picker(req,label){var m=$('#modal');m.className='modal';m.innerHTML='<div class="sheet"><div class="row between"><div><div class="eyebrow">'+esc(label)+'</div><div class="quiz-title">How many?</div></div><button class="iconbtn" id="v4x">×</button></div><div class="v4-actions" style="margin-top:14px"><button class="btn ghost" data-n="10">10</button><button class="btn ghost" data-n="20">20</button><button class="btn ghost" data-n="25">25</button></div></div>';$('#v4x').onclick=closeModal;m.querySelectorAll('[data-n]').forEach(function(b){b.onclick=function(){closeModal();run(Object.assign({},req,{count:Number(b.dataset.n)}))}})}
async function run(req){loading(true);try{var s=await call('quiz',req);loading(false);if(!s||s.ok===false)return toast((s&&s.message)||'No eligible questions');openQuiz(s);primeJump()}catch(e){loading(false);toast(e.message||String(e))}}
function bind(root,req){root.querySelectorAll('[data-v4]').forEach(function(b){b.onclick=function(){var kind=b.dataset.v4,r=Object.assign({},req,{kind:kind});if(kind==='all')run(r);else picker(r,(req.title||req.chapter||'Practice')+' · '+b.textContent.trim())}})}
async function scopeHeader(root,req){var key='scope:'+JSON.stringify(req),cached=cg(key);if(cached){var x=root.querySelector('[data-v4strip]');if(x)x.innerHTML=strip(cached)}try{var m=await call('metric',req);cs(key,m);var y=root.querySelector('[data-v4strip]');if(y)y.innerHTML=strip(m)}catch(e){}}
var oldChapter=window.openChapterHub,oldTopic=window.openTopicHub,oldGroup=window.openStudyGroup;
window.openChapterHub=function(chapter){oldChapter(chapter);var main=$('#main'),card=main.querySelector('.v3-card .v3-actions');if(card)card.parentElement.innerHTML='<div data-v4strip></div>'+actions();bind(main,{scope:'chapter',chapter:chapter,title:chapter});scopeHeader(main,{scope:'chapter',chapter:chapter});};
window.openTopicHub=function(chapter,topic){oldTopic(chapter,topic);var main=$('#main'),card=main.querySelector('.v3-card .v3-actions');if(card)card.parentElement.innerHTML='<div data-v4strip></div>'+actions();bind(main,{scope:'topic',chapter:chapter,majorTopic:topic,title:topic});scopeHeader(main,{scope:'topic',chapter:chapter,majorTopic:topic});};
window.openStudyGroup=function(key){oldGroup(key);setTimeout(function(){var main=$('#main'),box=main.querySelector('.v3-card .v3-actions');if(!box)return;var list=(app.bootstrap.chapters||[]).filter(function(c){var x=String(c.chapter||'').toLowerCase(),g=/fraction pattern|triplet|calculation memory|square|cube/.test(x)?'misc':/percentage|profit|loss|discount|ratio|proportion|average|mixture|alligation|interest|time.*work|pipe|cistern|speed|distance|train|boat|stream|partnership|ages|work.*wage/.test(x)?'arithmetic':'advanced';return g===key});box.parentElement.innerHTML='<div data-v4strip></div>'+actions();var req={scope:'group',chapters:list.map(function(c){return c.chapter}),groupName:key,title:key};bind(main,req);scopeHeader(main,req)},0)};
function renderNew(data){if(app.view!=='new')return;var h='<div class="content"><button class="btn ghost" id="v4nb">← Home</button><div class="section-title">New Practice</div><div class="v3-card"><div data-v4strip>'+strip(data.overall)+'</div>'+actions()+'</div><div class="section-title">By Chapter</div><div class="list">'+(data.chapters||[]).map(function(c){return '<div class="v3-card v4-row v3-click" data-nc="'+esc(c.chapter)+'"><div class="row between"><div><b>'+esc(c.chapter)+'</b><div class="muted" style="font-size:11px">'+Number(c.metric.unseen||0)+' new · '+Number(c.metric.weak||0)+' weak · '+Number(c.metric.starred||0)+' starred</div></div><span class="v4-chevron">›</span></div></div>'}).join('')+'</div></div>';$('#main').innerHTML=h;$('#v4nb').onclick=home;bind($('#main'),{scope:'all',title:'All New Practice'});$('#main').querySelectorAll('[data-nc]').forEach(function(x){x.onclick=function(){openNewChapter(x.dataset.nc,data)}})}
function openNewChapter(chapter,data){var c=(data.chapters||[]).find(function(x){return x.chapter===chapter})||{metric:{}};$('#main').innerHTML='<div class="content"><button class="btn ghost" id="v4ncb">← New Practice</button><div style="margin:14px 2px"><div class="eyebrow">New Practice</div><div class="quiz-title">'+esc(chapter)+'</div><div class="muted" style="font-size:12px">'+Number(c.metric.unseen||0)+' new · '+Number(c.metric.weak||0)+' weak · '+Number(c.metric.starred||0)+' starred</div></div><div class="v3-card">'+strip(c.metric)+actions()+'</div></div>';$('#v4ncb').onclick=window.openGlobalNewV3;bind($('#main'),{scope:'chapter',chapter:chapter,title:chapter+' · New Practice'})}
window.openGlobalNewV3=async function(){app.view='new';nav('home');var cached=cg('new');if(cached)renderNew(cached);try{var d=await call('new');cs('new',d);renderNew(d)}catch(e){if(!cached)toast(e.message||String(e))}};
function starControls(lo,hi,title){return '<div class="v4-actions" data-star-actions><button class="btn ghost" data-sk="all">Practice All</button><button class="btn ghost" data-sk="new">Practice New</button><button class="btn ghost" data-sk="weak">Weak</button><button class="btn ghost" data-sk="random">Random</button><button class="btn ghost" data-sk="difficult">◆ Difficult</button><button class="btn ghost" data-sk="mastered">Mastered</button></div>'}
function bindStar(root,lo,hi,title){root.querySelectorAll('[data-sk]').forEach(function(b){b.onclick=function(e){e.stopPropagation();var k=b.dataset.sk,r={scope:'star_history',starLo:lo,starHi:hi,kind:k,title:title};if(k==='all')run(r);else picker(r,title+' · '+b.textContent.trim())}})}
function renderStar(data){if(app.view!=='starred')return;var s=data.stats||{},html='<div class="content"><button class="btn ghost" id="v4sb">← Home</button><div class="section-title">Starred Revision</div><div class="v3-card"><div class="row between"><div><b>All Starred Revision</b><div class="muted" style="font-size:11px">'+s.starred+' Starred · '+s.mastered+' Mastered · '+s.focus+' Focus</div></div></div><div style="margin-top:10px">'+starControls(1,999999,'All Starred Revision')+'</div></div><div class="section-title">Study history</div><div class="list">';(data.blocks||[]).forEach(function(bl,i){var recent=bl.hi>=Math.max(1,data.currentDay-9);if(recent){(bl.days||[]).forEach(function(d){html+='<div class="v4-block"><div class="v4-block-head row between" data-expand-day="'+d.day+'"><div><b>Day '+d.day+'</b><div class="muted" style="font-size:11px">'+d.stats.starred+' Starred · '+d.stats.mastered+' Mastered · '+d.stats.focus+' Focus</div></div><span class="v4-chevron">›</span></div><div class="v4-block-body hidden" data-day-body="'+d.day+'">'+starControls(d.day,d.day,'Day '+d.day)+'</div></div>'})}else{html+='<div class="v4-block"><div class="v4-block-head row between" data-expand-block="'+i+'"><div><b>Days '+bl.lo+'–'+bl.hi+'</b><div class="muted" style="font-size:11px">'+bl.stats.starred+' Starred · '+bl.stats.mastered+' Mastered · '+bl.stats.focus+' Focus</div></div><span class="v4-chevron">›</span></div><div class="v4-block-body hidden" data-block-body="'+i+'">'+starControls(bl.lo,bl.hi,'Days '+bl.lo+'–'+bl.hi)+(bl.days||[]).map(function(d){return '<div class="v4-day"><b>Day '+d.day+'</b><div class="muted" style="font-size:11px">'+d.stats.starred+' Starred · '+d.stats.mastered+' Mastered · '+d.stats.focus+' Focus</div></div>'}).join('')+'</div></div>'}});html+='</div></div>';$('#main').innerHTML=html;$('#v4sb').onclick=home;bindStar($('#main'),1,999999,'All Starred Revision');$('#main').querySelectorAll('[data-expand-day]').forEach(function(h){h.onclick=function(){var d=h.dataset.expandDay,b=$('[data-day-body="'+d+'"]');b.classList.toggle('hidden');if(!b.classList.contains('hidden'))bindStar(b,Number(d),Number(d),'Day '+d)}});$('#main').querySelectorAll('[data-expand-block]').forEach(function(h){h.onclick=function(){var i=h.dataset.expandBlock,b=$('[data-block-body="'+i+'"]'),bl=data.blocks[Number(i)];b.classList.toggle('hidden');if(!b.classList.contains('hidden'))bindStar(b,bl.lo,bl.hi,'Days '+bl.lo+'–'+bl.hi)}})}
window.openStarredRevisionV3=async function(){app.view='starred';nav('home');var cached=cg('starred');if(cached)renderStar(cached);try{var d=await call('starred');cs('starred',d);renderStar(d)}catch(e){if(!cached)toast(e.message||String(e))}};
function renderProgress(d){if(app.view!=='progress')return;var o=d.overall||{};$('#main').innerHTML='<div class="content"><div class="section-title">Progress</div><div class="v4-overview"><div><b>'+o.attempted+'/'+o.total+'</b><span>Encountered</span></div><div><b>'+o.unseen+'</b><span>New</span></div><div><b>⭐ '+o.starred+'</b><span>Starred</span></div><div><b>◆ '+o.difficult+'</b><span>Difficult</span></div></div><div class="v3-card" style="margin-top:10px">'+strip(o)+'<div class="v4-progressbar"><i style="width:'+Number(o.coverage||0)+'%"></i></div><div class="muted" style="font-size:11px">'+o.attempted+' / '+o.total+' encountered · '+o.unseen+' left</div></div><div class="section-title">By Chapter</div><div class="list">'+(d.chapters||[]).map(function(c){var m=c.metric;return '<div class="v3-card v4-row"><div class="row between"><b>'+esc(c.chapter)+'</b><span class="tag">'+m.coverage+'%</span></div><div class="v4-progressbar"><i style="width:'+m.coverage+'%"></i></div><div class="muted" style="font-size:11px">✕ '+m.wrong+' wrong · ◆ '+m.difficult+' difficult · ⭐ '+m.starred+' starred</div></div>'}).join('')+'</div></div>'}
window.progress=async function(){app.view='progress';nav('progress');var cached=cg('progress');if(cached)renderProgress(cached);try{var d=await call('progress');cs('progress',d);renderProgress(d)}catch(e){if(!cached)toast(e.message||String(e))}};
var oldShow=window.showView;window.showView=function(v){if(v==='progress')return window.progress();return oldShow(v)};
function primeJump(){if(!app.quiz||app.quiz._v4AttemptLoading||app.quiz._v4AttemptMap)return;app.quiz._v4AttemptLoading=true;call('attempts',app.quiz.sessionId).then(function(m){if(app.quiz){app.quiz._v4AttemptMap=m||{};app.quiz._v4AttemptLoading=false}}).catch(function(){if(app.quiz)app.quiz._v4AttemptLoading=false})}
window.openQuestionJump=function(){if(!app.quiz||!app.quiz.questions||!app.quiz.questions.length)return;primeJump();var total=app.quiz.questions.length,current=app.quiz.index+1,map=app.quiz._v4AttemptMap||{},m=$('#modal'),buttons='';m.className='modal';for(var i=1;i<=total;i++){var q=app.quiz.questions[i-1],s=map[String(q.questionId||'')]||'',cls=s==='correct'?'qj-correct':s==='wrong'?'qj-wrong':s==='seen'?'qj-seen':'';if(i===current)cls+=' qj-current';buttons+='<button class="btn ghost '+cls+'" data-j="'+i+'">'+i+'</button>'}m.innerHTML='<div class="sheet"><div class="row between"><div><div class="eyebrow">Question selector</div><div class="quiz-title">Jump to question</div></div><button class="iconbtn" id="v4jx">×</button></div><div class="question-jump-grid">'+buttons+'</div></div>';$('#v4jx').onclick=closeModal;m.querySelectorAll('[data-j]').forEach(function(b){b.onclick=function(){var n=Number(b.dataset.j);closeModal();app.quiz.index=n-1;app.qStart=Date.now();renderQuestion();window.scrollTo(0,0);server('saveSessionPosition',app.quiz.sessionId,app.quiz.index).catch(function(){})}})};
var oldRender=window.renderQuestion;window.renderQuestion=function(){oldRender();primeJump();var q=app.quiz&&app.quiz.questions&&app.quiz.questions[app.quiz.index],counter=document.querySelector('.quiz-head .tag'),diff=document.querySelector('[data-v3-difficult]');if(counter){counter.onclick=window.openQuestionJump}if(diff){diff.textContent=q&&q.difficult?'◆ Difficult':'◇ Difficult'} };
var oldHome=window.home;window.home=async function(){await oldHome();setTimeout(function(){var r=$('#v3ResumeHome');if(r&&r.parentElement){r.parentElement.classList.add('v4-resume');r.textContent='Resume'}},0)};
document.addEventListener('click',function(e){if(e.target&&e.target.matches('[data-v3-difficult],#markBtn'))drop()},true);
})();
</script>
