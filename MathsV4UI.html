<style>

:var(--okbg)!important;color:var(--ok)!important;border-color:var(--ok)!important}

.question-card{border-radius:14px;padding:16px}.question{font-size:clamp(19px,4.8vw,25px);line-height:1.45;font-weight:750;margin:10px 0 16px}.question.q-medium{font-size:clamp(18px,4.3vw,23px)}.question.q-long,.question.q-xlong{font-size:clamp(16px,3.8vw,20px);line-height:1.5}.options{gap:9px}.option{align-items:flex-start;border-radius:12px;padding:13px 12px;min-height:54px;font-size:16px;line-height:1.4;gap:10px}.option .letter{width:28px;height:28px;flex:0 0 28px;border-radius:8px;font-size:14px}.option.correct{background:var(--okbg)!important;border-color:var(--ok)!important}.option.correct .letter{background:var(--ok)!important;color:#fff!important}.option.wrong{background:var(--badbg)!important;border-color:var(--bad)!important}.option.wrong .letter{background:var(--bad)!important;color:#fff!important}.answer-body{font-size:16px}.dock-nav .btn{min-height:44px}.dock-tools .btn{min-height:44px;font-size:11px}.question-jump-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.question-jump-grid .qj-correct{background:var(--okbg)!important;color:var(--ok)!important;border-color:var(--ok)!important}.question-jump-grid .qj-wrong{background:var(--badbg)!important;color:var(--bad)!important;border-color:var(--bad)!important}.question-jump-grid .qj-seen{background:var(--warnbg)!important;color:var(--warn)!important;border-color:var(--warn)!important}
@media(max-width:390px){.v4-pill{font-size:8px}.v4-pill b{font-size:12px}.v4-actions .btn{font-size:10px}.question-card{padding:14px}.question{font-size:20px}.option{font-size:15px;padding:12px 10px}.v4-overview b{font-size:14px}.v4-home-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

<script>
(function(){
'use strict';
var CACHE='maths-v4:';
var oldHome=window.home,oldChapters=window.chapters,oldChapter=window.openChapterHub,oldTopic=window.openTopicHub,oldGroup=window.openStudyGroup,oldRender=window.renderQuestion,oldCalc=window.openCalculationHub,oldStartDemand=window.startDemandSet,oldChoose=window.chooseOption,oldReveal=window.revealAnswer;
var jumpMap={};
function cg(k){try{return JSON.parse(localStorage.getItem(CACHE+k)||'null')}catch(e){return null}}
function cs(k,v){try{localStorage.setItem(CACHE+k,JSON.stringify(v))}catch(e){}return v}
function drop(k){try{localStorage.removeItem(CACHE+k)}catch(e){}}
function call(fn,arg,arg2){return new Promise(function(ok,bad){var r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){bad(new Error(e&&e.message?e.message:String(e)))});if(fn==='metric')r.getMathsScopeMetricV4(arg||{});else if(fn==='new')r.getMathsNewHubV4();else if(fn==='progress')r.getMathsProgressV4();else if(fn==='starred')r.getStarredRevisionV4();else if(fn==='concepts')r.getConceptsHubV4();else if(fn==='view')r.getMathsViewItemsV4(arg||{});else if(fn==='quiz')r.startMathsV4Quiz(arg||{});else if(fn==='attempts')r.getSessionAttemptMapV3(arg);else if(fn==='conceptSave')r.saveConceptV4(arg,arg2);else if(fn==='star')r.toggleImportantV3(arg,arg2);else if(fn==='difficult')r.toggleDifficultV3(arg,arg2);else if(fn==='bootstrap')r.getMathsV3Bootstrap();else bad(new Error('Unknown V4 call'))})}
function strip(m){m=m||{};return '<div class="v4-strip-wrap"><div class="v4-scope-count">'+Number(m.total||0)+' questions</div><div class="v4-strip"><div class="v4-pill coverage"><b>'+Number(m.coverage||0)+'%</b>Coverage</div><div class="v4-pill wrong"><b>✕ '+Number(m.wrong||0)+'</b>Wrong</div><div class="v4-pill difficult"><b>◆ '+Number(m.difficult||0)+'</b>Difficult</div><div class="v4-pill starred"><b>☆ '+Number(m.starred||0)+'</b>Starred</div></div></div>'}
function actions(){return '<div class="v4-actions"><button class="btn ghost" data-v4="all">Practice All</button><button class="btn ghost" data-v4="new">New</button><button class="btn ghost" data-v4="weak">Weak</button><button class="btn ghost" data-v4="starred">Starred</button><button class="btn ghost" data-v4="difficult">Difficult</button><button class="btn soft" data-v4="random">Random</button></div>'}
function fiveActions(prefix){return '<div class="v4-actions v4-five"><button class="btn ghost" data-'+prefix+'="view">View All</button><button class="btn ghost" data-'+prefix+'="all">Practice All</button><button class="btn ghost" data-'+prefix+'="new">New</button><button class="btn ghost" data-'+prefix+'="weak">Weak</button><button class="btn soft" data-'+prefix+'="random">Random</button></div>'}
function picker(req,label){var m=$('#modal');m.className='modal';m.innerHTML='<div class="sheet"><div class="row between"><div><div class="eyebrow">'+esc(label)+'</div><div class="quiz-title">How many questions?</div></div><button class="iconbtn" id="v4x">×</button></div><div class="v4-actions" style="margin-top:14px"><button class="btn ghost" data-n="10">10</button><button class="btn ghost" data-n="20">20</button><button class="btn ghost" data-n="25">25</button></div></div>';$('#v4x').onclick=closeModal;m.onclick=function(e){if(e.target===m)closeModal()};m.querySelectorAll('[data-n]').forEach(function(b){b.onclick=function(){closeModal();run(Object.assign({},req,{count:Number(b.dataset.n)}))}})}
async function run(req){loading(true);try{var s=await call('quiz',req);loading(false);if(!s||s.ok===false)return toast((s&&s.message)||'No eligible questions');openQuiz(s);primeJump()}catch(e){loading(false);toast(e.message||String(e))}}
function bind(root,req){root.querySelectorAll('[data-v4]').forEach(function(b){b.onclick=function(){var kind=b.dataset.v4,r=Object.assign({},req,{kind:kind});if(kind==='all')run(r);else picker(r,(req.title||req.chapter||'Practice')+' · '+b.textContent.trim())}})}
function modulePanel(req,m){return '<div data-v4strip>'+strip(m||{})+'</div>'+actions()}
async function scopeHeader(root,req){var key='scope:'+JSON.stringify(req),cached=cg(key),spot=root.querySelector('[data-v4strip]');if(cached&&spot)spot.innerHTML=strip(cached);try{var m=await call('metric',req);cs(key,m);spot=root.querySelector('[data-v4strip]');if(spot)spot.innerHTML=strip(m)}catch(e){}}
function installModulePanel(main,req){var holder=null;(main.querySelectorAll('.v3-card')||[]).forEach(function(c){if(!holder&&c.querySelector('.v3-actions'))holder=c});if(!holder)return;holder.innerHTML=modulePanel(req,{});bind(holder,req);scopeHeader(holder,req)}
function groupFor(chapter){var x=String(chapter||'').toLowerCase();if(/fraction pattern|triplet|calculation memory|square|cube/.test(x))return'misc';if(/percentage|profit|loss|discount|ratio|proportion|average|mixture|alligation|interest|time.*work|pipe|cistern|speed|distance|train|boat|stream|partnership|ages|work.*wage/.test(x))return'arithmetic';return'advanced'}
function chapterReq(chapter){return {scope:'chapter',chapter:chapter,title:chapter}}
window.openChapterHub=function(chapter){oldChapter(chapter);installModulePanel($('#main'),chapterReq(chapter))};
window.openTopicHub=function(chapter,topic){oldTopic(chapter,topic);installModulePanel($('#main'),{scope:'topic',chapter:chapter,majorTopic:topic,title:topic})};
window.openStudyGroup=function(key){oldGroup(key);setTimeout(function(){var req;if(key==='mocks')req={scope:'demand_set',setId:'MOCK_QUESTIONS',title:'Mock Questions'};else{var list=(app.bootstrap.chapters||[]).filter(function(c){return groupFor(c.chapter)===key});req={scope:'group',chapters:list.map(function(c){return c.chapter}),groupName:key,title:key==='advanced'?'Advanced':key==='arithmetic'?'Arithmetic':'MISC'}}installModulePanel($('#main'),req)},0)};
window.chapters=function(){app.view='chapters';nav('chapters');var list=app.bootstrap.chapters||[],groups={advanced:[],arithmetic:[],misc:[]};list.forEach(function(c){groups[groupFor(c.chapter)].push(c)});var mock=(app.bootstrap.demandSets||[]).find(function(s){return String(s.setId)==='MOCK_QUESTIONS'});$('#main').innerHTML='<div class="content"><div class="section-title">Practice Hub</div><div class="v3-groups"><div class="v3-card v3-group v4-compact-group v3-click" data-g="advanced"><div class="eyebrow">Advanced</div><b>'+groups.advanced.length+' '+(groups.advanced.length===1?'chapter':'chapters')+'</b></div><div class="v3-card v3-group v4-compact-group v3-click" data-g="arithmetic"><div class="eyebrow">Arithmetic</div><b>'+groups.arithmetic.length+' '+(groups.arithmetic.length===1?'chapter':'chapters')+'</b></div><div class="v3-card v3-group v3-click" data-g="misc"><div class="eyebrow">MISC</div><div><b>'+groups.misc.length+' banks</b><div class="muted">Recall material</div></div></div><div class="v3-card v3-group v3-click" data-g="mocks"><div class="eyebrow">Mocks</div><div><b>'+(mock?Number(mock.count||0):0)+' questions</b><div class="muted">Saved Mock Questions</div></div></div></div></div>';$('#main').querySelectorAll('[data-g]').forEach(function(x){x.onclick=function(){window.openStudyGroup(x.dataset.g)}})};
function renderHome(data){if(app.view!=='home')return;var d=app.bootstrap.dashboard||{},resume=app.bootstrap.resume,pending=(d.pending||[]).slice(0,2),s=data&&data.schedule||{},day=Number(s.day||d.day||0),chapter=String(s.chapter||d.todayChapter||''),concepts=cg('concepts'),conceptCount=concepts&&concepts.metric?Number(concepts.metric.total||0):0;var h='<div class="content grid">';if(resume)h+='<div class="v4-resume-line"><div><b>'+esc(resume.title)+'</b><div class="muted">Q'+(Number(resume.currentIndex||0)+1)+'/'+Number(resume.total||0)+'</div></div><button class="btn soft" id="v4resume">Resume</button></div>';h+='<div class="v3-card v3-hero"><div class="eyebrow">Today’s Maths</div><h2 style="margin:5px 0">'+esc(day>0?'Day '+day+' · '+chapter:'Daily Practice')+'</h2><div class="muted">20-question target</div><button class="btn primary" id="v4daily" style="margin-top:12px">Start / Continue</button></div>';if(pending.length)h+='<div class="section-title">Pending</div><div class="list">'+pending.map(function(p){return '<div class="v3-card row between"><div><b>Day '+Number(p.day)+' · '+esc(p.chapter)+'</b><div class="muted" style="font-size:11px">'+esc(p.status||'Pending')+'</div></div><button class="btn soft" data-pday="'+Number(p.day)+'">Open</button></div>'}).join('')+'</div>';h+='<div class="v4-home-grid"><div class="v3-card v3-click" id="v4new"><div class="eyebrow">New Practice</div><b>'+Number(data&&data.newCount||0)+' unseen</b></div><div class="v3-card v3-click" id="v4star"><div class="eyebrow">Starred Revision</div><b>'+Number(data&&data.starred||0)+' starred</b></div><div class="v3-card v3-click" id="v4concept"><div class="eyebrow">Concepts</div><b>'+conceptCount+' saved questions</b></div></div></div>';$('#main').innerHTML=h;if(resume)$('#v4resume').onclick=function(){resumeQuiz(resume.sessionId)};$('#v4daily').onclick=function(){beginQuiz('daily',{planDay:day||undefined})};$('#v4new').onclick=window.openGlobalNewV3;$('#v4star').onclick=window.openStarredRevisionV3;$('#v4concept').onclick=window.openConceptsV4;$('#main').querySelectorAll('[data-pday]').forEach(function(b){b.onclick=function(){beginQuiz('daily',{planDay:Number(b.dataset.pday)})}})}
window.home=function(){app.view='home';nav('home');var cached=cg('home');renderHome(cached||{});call('bootstrap').then(function(d){cs('home',d);renderHome(d)}).catch(function(){});if(!cg('concepts'))call('concepts').then(function(d){cs('concepts',d);if(app.view==='home')renderHome(cg('home')||{})}).catch(function(){})};
function renderNew(data){if(app.view!=='new')return;var h='<div class="content"><button class="btn ghost" id="v4nb">← Home</button><div class="section-title">New Practice</div><div class="v3-card">'+strip(data.overall)+actions()+'</div><div class="section-title">By Chapter</div><div class="list">'+(data.chapters||[]).map(function(c){return '<div class="v3-card v4-row v3-click" data-nc="'+esc(c.chapter)+'"><div class="row between"><div><b>'+esc(c.chapter)+'</b><div class="muted" style="font-size:11px">'+Number(c.metric.unseen||0)+' new · '+Number(c.metric.weak||0)+' weak · '+Number(c.metric.starred||0)+' starred</div></div><span class="v4-chevron">›</span></div></div>'}).join('')+'</div></div>';$('#main').innerHTML=h;$('#v4nb').onclick=window.home;bind($('#main'),{scope:'all',title:'All New Practice'});$('#main').querySelectorAll('[data-nc]').forEach(function(x){x.onclick=function(){openNewChapter(x.dataset.nc,data)}})}
function openNewChapter(chapter,data){var c=(data.chapters||[]).find(function(x){return x.chapter===chapter})||{metric:{}};$('#main').innerHTML='<div class="content"><button class="btn ghost" id="v4ncb">← New Practice</button><div style="margin:14px 2px"><div class="eyebrow">New Practice</div><div class="quiz-title">'+esc(chapter)+'</div></div><div class="v3-card">'+strip(c.metric)+actions()+'</div></div>';$('#v4ncb').onclick=window.openGlobalNewV3;bind($('#main'),{scope:'chapter',chapter:chapter,title:chapter+' · New Practice'})}
window.openGlobalNewV3=function(){app.view='new';nav('home');var cached=cg('new');if(cached)renderNew(cached);call('new').then(function(d){cs('new',d);renderNew(d)}).catch(function(e){if(!cached)toast(e.message||String(e))})};
function openReadOnly(req,title){loading(true);call('view',req).then(function(items){loading(false);var m=$('#modal');m.className='modal';m.innerHTML='<div class="sheet"><div class="row between"><div><div class="eyebrow">Read-only revision</div><div class="quiz-title">'+esc(title)+'</div></div><button class="iconbtn" id="v4viewx">×</button></div><div class="muted" style="font-size:11px;margin-top:4px">'+items.length+' saved questions · viewing does not create attempts</div><div class="v4-read-list">'+items.map(function(x,i){return '<div class="v4-read-item" data-view-i="'+i+'"><b>'+esc(x.chapter||'Maths')+'</b><div class="muted" style="font-size:11px;margin-top:3px">'+esc(String(x.prompt||'').slice(0,135))+'</div></div>'}).join('')+'</div></div>';$('#v4viewx').onclick=closeModal;m.onclick=function(e){if(e.target===m)closeModal()};m.querySelectorAll('[data-view-i]').forEach(function(el){el.onclick=function(){var x=items[Number(el.dataset.viewI)];m.querySelector('.sheet').innerHTML='<button class="btn ghost" id="v4viewback">← Back</button><div style="margin-top:12px"><div class="eyebrow">'+esc(x.chapter||'Maths')+'</div><div class="quiz-title">'+esc(x.topic||'Saved question')+'</div></div><div class="v3-card" style="margin-top:12px"><div class="v4-read-detail"><b>Question</b>\n'+esc(x.prompt||'')+'\n\n<b>Answer</b>\n'+esc(x.answer||'')+(x.explanation?'\n\n<b>Explanation</b>\n'+esc(x.explanation):'')+'</div></div>';$('#v4viewback').onclick=function(){closeModal();openReadOnly(req,title)}}})}).catch(function(e){loading(false);toast(e.message||String(e))})}
function bindFive(root,prefix,req,title){root.querySelectorAll('[data-'+prefix+']').forEach(function(b){b.onclick=function(e){e.stopPropagation();var k=b.getAttribute('data-'+prefix);if(k==='view')return openReadOnly(req,title);var r=Object.assign({},req,{kind:k,title:title});if(k==='all')run(r);else picker(r,title+' · '+b.textContent.trim())}})}
function statLine(s){s=s||{};return Number(s.starred||0)+' Starred · '+Number(s.mastered||0)+' Mastered · '+Number(s.focus||0)+' Focus'}
function starScope(lo,hi){return {scope:'star_history',starLo:lo,starHi:hi}}
function starBlock(title,s,lo,hi,attr){return '<div class="v4-block"><div class="v4-block-head row between" '+attr+'><div><b>'+esc(title)+'</b><div class="muted" style="font-size:11px">'+statLine(s)+'</div></div><span class="v4-chevron">›</span></div><div class="v4-block-body hidden" data-star-body="'+lo+'-'+hi+'">'+fiveActions('star')+'</div></div>'}
function renderStar(data){if(app.view!=='starred')return;var s=data.stats||{},html='<div class="content"><button class="btn ghost" id="v4sb">← Home</button><div class="section-title">Starred Revision</div><div class="v3-card"><b>All Starred Revision</b><div class="muted" style="font-size:11px;margin:4px 0 10px">'+statLine(s)+'</div>'+fiveActions('starTop')+'</div><div class="section-title">Study history</div><div class="list">';(data.recentDays||[]).forEach(function(d){html+=starBlock('Day '+d.day,d.stats,d.day,d.day,'data-star-range="'+d.day+'-'+d.day+'"')});(data.tenBlocks||[]).forEach(function(bl){html+=starBlock('Days '+bl.lo+'–'+bl.hi,bl.stats,bl.lo,bl.hi,'data-star-range="'+bl.lo+'-'+bl.hi+'"')});(data.months||[]).forEach(function(bl){html+=starBlock(bl.label+' · Days '+bl.lo+'–'+bl.hi,bl.stats,bl.lo,bl.hi,'data-star-range="'+bl.lo+'-'+bl.hi+'"')});html+='</div></div>';$('#main').innerHTML=html;$('#v4sb').onclick=window.home;bindFive($('#main'),'starTop',starScope(1,999999),'All Starred Revision');$('#main').querySelectorAll('[data-star-range]').forEach(function(h){h.onclick=function(){var p=h.dataset.starRange.split('-'),lo=Number(p[0]),hi=Number(p[1]),body=$('[data-star-body="'+lo+'-'+hi+'"]');body.classList.toggle('hidden');if(!body.classList.contains('hidden'))bindFive(body,'star',starScope(lo,hi),(lo===hi?'Day '+lo:'Days '+lo+'–'+hi))}})}
window.openStarredRevisionV3=function(){app.view='starred';nav('home');var cached=cg('starred');if(cached)renderStar(cached);call('starred').then(function(d){cs('starred',d);renderStar(d)}).catch(function(e){if(!cached)toast(e.message||String(e))})};
function renderConcepts(data){if(app.view!=='concepts')return;var m=data.metric||{},h='<div class="content"><button class="btn ghost" id="v4cb">← Home</button><div class="section-title">Concepts</div><div class="v3-card"><div class="muted" style="font-size:11px;margin-bottom:4px">Saved questions for concept revision</div>'+strip(m)+fiveActions('concept')+'</div>'+(data.chapters&&data.chapters.length?'<div class="section-title">By Chapter</div><div class="list">'+data.chapters.map(function(c){return '<div class="v3-card v4-row"><div class="row between"><b>'+esc(c.chapter)+'</b><span class="tag">'+Number(c.metric.total||0)+'</span></div></div>'}).join('')+'</div>':'')+'</div>';$('#main').innerHTML=h;$('#v4cb').onclick=window.home;bindFive($('#main'),'concept',{scope:'concept_saved'},'Concepts')}
window.openConceptsV4=function(){app.view='concepts';nav('home');var cached=cg('concepts');if(cached)renderConcepts(cached);call('concepts').then(function(d){cs('concepts',d);renderConcepts(d)}).catch(function(e){if(!cached)toast(e.message||String(e))})};
function renderProgress(d){if(app.view!=='progress')return;var o=d.overall||{};$('#main').innerHTML='<div class="content"><div class="section-title">Progress</div><div class="v4-overview"><div><b>'+o.total+'</b><span>Total Questions</span></div><div><b>'+o.attempted+'</b><span>Encountered</span></div><div><b>✕ '+o.wrong+'</b><span>Wrong</span></div><div><b>☆ '+o.starred+'</b><span>Starred</span></div></div><div class="v3-card" style="margin-top:10px">'+strip(o)+'<div class="v4-progressbar"><i style="width:'+Number(o.coverage||0)+'%"></i></div><div class="muted" style="font-size:11px">'+o.attempted+' / '+o.total+' questions encountered · '+o.unseen+' left</div></div><div class="section-title">By Chapter</div><div class="list">'+(d.chapters||[]).map(function(c){var m=c.metric;return '<div class="v3-card v4-row"><div class="row between"><b>'+esc(c.chapter)+'</b><span class="tag">'+Number(m.total||0)+' Q</span></div><div class="v4-progressbar"><i style="width:'+Number(m.coverage||0)+'%"></i></div><div style="margin-top:7px">'+strip(m)+'</div></div>'}).join('')+'</div></div>'}
window.progress=function(){app.view='progress';nav('progress');var cached=cg('progress');if(cached)renderProgress(cached);call('progress').then(function(d){cs('progress',d);renderProgress(d)}).catch(function(e){if(!cached)toast(e.message||String(e))})};
window.startDemandSet=function(setId){var set=(app.bootstrap.demandSets||[]).find(function(s){return String(s.setId)===String(setId)});if(String(setId)==='CALC_TRAINING')return oldCalc(setId);app.view='ondemand';nav('ondemand');var title=set?String(set.name||set.setName||'Saved Set'):'Saved Set',req={scope:'demand_set',setId:String(setId),title:title};$('#main').innerHTML='<div class="content"><button class="btn ghost" id="v4db">← On Demand</button><div style="margin:14px 2px"><div class="eyebrow">Saved Set</div><div class="quiz-title">'+esc(title)+'</div></div><div class="v3-card"><div data-v4strip></div>'+actions()+'</div></div>';$('#v4db').onclick=function(){showView('ondemand')};bind($('#main'),req);scopeHeader($('#main'),req)};
window.openCalculationHub=function(setId){oldCalc(setId);var main=$('#main'),content=main.querySelector('.content');if(!content)return;var panel=document.createElement('div');panel.className='v3-card';panel.style.marginTop='10px';panel.innerHTML='<div data-v4strip></div>'+actions();var first=content.children[0];if(first&&first.nextSibling)content.insertBefore(panel,first.nextSibling);else content.appendChild(panel);var req={scope:'demand_set',setId:String(setId),title:'Calculation Training'};bind(panel,req);scopeHeader(panel,req)};
function primeJump(){jumpMap={};if(!app.quiz)return;(app.quiz.questions||[]).forEach(function(q){if(q._answered)jumpMap[String(q.questionId)]=q._selected===q.correctOption?'correct':'wrong';else if(q._revealed)jumpMap[String(q.questionId)]='seen'});call('attempts',app.quiz.sessionId).then(function(m){Object.keys(m||{}).forEach(function(k){jumpMap[k]=m[k]})}).catch(function(){})}
window.openQuestionJump=function(){if(!app.quiz||!app.quiz.questions||!app.quiz.questions.length)return;var total=app.quiz.questions.length,current=app.quiz.index+1,m=$('#modal'),buttons='';m.className='modal';for(var i=1;i<=total;i++){var q=app.quiz.questions[i-1],st=jumpMap[String(q.questionId||'')]||'',cls=st==='correct'?'qj-correct':st==='wrong'?'qj-wrong':st==='seen'?'qj-seen':'';if(i===current)cls+=' qj-current';buttons+='<button class="btn ghost '+cls+'" data-jump="'+i+'">'+i+'</button>'}m.innerHTML='<div class="sheet"><div class="row between"><div><div class="eyebrow">Question selector</div><div class="quiz-title">Jump to question</div></div><button class="iconbtn" id="v4jumpx">×</button></div><div class="question-jump-grid">'+buttons+'</div></div>';$('#v4jumpx').onclick=closeModal;m.onclick=function(e){if(e.target===m)closeModal()};m.querySelectorAll('[data-jump]').forEach(function(b){b.onclick=function(){var target=Number(b.dataset.jump)-1;closeModal();app.quiz.index=target;app.qStart=Date.now();window.renderQuestion();window.scrollTo(0,0);server('saveSessionPosition',app.quiz.sessionId,target).catch(function(){})}})};
if(oldChoose)window.chooseOption=function(k){oldChoose(k);var q=app.quiz&&app.quiz.questions[app.quiz.index];if(q){jumpMap[String(q.questionId)]=q._selected===q.correctOption?'correct':'wrong';setTimeout(function(){if(q._revealed)paintAnsweredOptions(q)},0)}};
if(oldReveal)window.revealAnswer=function(){oldReveal();var q=app.quiz&&app.quiz.questions[app.quiz.index];if(q)jumpMap[String(q.questionId)]='seen'};
function styleToolbar(q){var tools=document.querySelector('.dock-tools');if(!tools||!q)return;tools.innerHTML='<button class="btn ghost small" id="v4starbtn">☆ Starred</button><button class="btn ghost small" id="v4diffbtn">◇ Difficult</button><button class="btn ghost small" id="v4conceptbtn">＋ Concept</button><button class="btn ghost small" id="v4pausebtn">⏸ Pause</button>';var sb=$('#v4starbtn'),db=$('#v4diffbtn'),cb=$('#v4conceptbtn');function paint(){sb.textContent=q.important||q.marked?'★ Starred':'☆ Starred';sb.className='btn small '+(q.important||q.marked?'v4-toolbar-active-star':'ghost');db.textContent=q.difficult?'◆ Difficult':'◇ Difficult';db.className='btn small '+(q.difficult?'v4-toolbar-active-diff':'ghost');cb.textContent=q.inConcept?'✓ Concept':'＋ Concept';cb.className='btn small '+(q.inConcept?'v4-toolbar-active-concept':'ghost')}paint();sb.onclick=function(){var before=!!(q.important||q.marked),next=!before;q.important=next;q.marked=next;paint();drop('home');drop('starred');drop('progress');call('star',q.questionId,app.quiz.sessionId).then(function(r){q.important=!!r.important;q.marked=!!r.important;paint()}).catch(function(){q.important=before;q.marked=before;paint();toast('Star save delayed')})};db.onclick=function(){var before=!!q.difficult;q.difficult=!before;paint();drop('progress');call('difficult',q.questionId,app.quiz.sessionId).then(function(r){q.difficult=!!r.difficult;paint()}).catch(function(){q.difficult=before;paint();toast('Difficult save delayed')})};cb.onclick=function(){if(q.inConcept)return;q.inConcept=true;paint();drop('concepts');call('conceptSave',q.questionId,app.quiz.sessionId).catch(function(){q.inConcept=false;paint();toast('Concept save delayed')})};$('#v4pausebtn').onclick=fastPause}
window.renderQuestion=function(){oldRender();if(!app.quiz)return;var q=app.quiz.questions[app.quiz.index],counter=document.querySelector('.quiz-head .tag');if(counter){counter.classList.add('quiz-jump-tag');counter.textContent='Q '+(app.quiz.index+1)+'/'+app.quiz.questions.length+' ▾';counter.onclick=window.openQuestionJump}styleToolbar(q);if(q&&q._revealed&&q.answerMode==='MCQ')setTimeout(function(){paintAnsweredOptions(q)},0)};
function fastPause(){if(!app.quiz)return;var m=$('#modal');m.className='modal';m.innerHTML='<div class="sheet"><div style="text-align:center"><h2 style="margin-top:0">Session paused</h2><p class="muted">'+esc(app.quiz.title)+' · '+(app.quiz.index+1)+'/'+app.quiz.questions.length+'</p><button class="btn primary" style="width:100%" id="v4resumequiz">Resume</button><div style="height:8px"></div><button class="btn ghost" style="width:100%" id="v4savehome">Save & Home</button></div></div>';m.onclick=function(e){if(e.target===m)closeModal()};$('#v4resumequiz').onclick=closeModal;$('#v4savehome').onclick=function(){var q=app.quiz,idx=q.index;closeModal();app.bootstrap.resume={sessionId:q.sessionId,title:q.title,currentIndex:idx,total:q.questions.length,mode:q.mode};server('saveSessionPosition',q.sessionId,idx).catch(function(){});window.home()}}
window.saveAndHome=function(){if(!app.quiz)return window.home();var q=app.quiz,idx=q.index;closeModal();app.bootstrap.resume={sessionId:q.sessionId,title:q.title,currentIndex:idx,total:q.questions.length,mode:q.mode};server('saveSessionPosition',q.sessionId,idx).catch(function(){});window.home()};
var oldOpenQuiz=window.openQuiz;if(oldOpenQuiz)window.openQuiz=function(s){oldOpenQuiz(s);primeJump()};
var oldShowView=window.showView;window.showView=function(v){app.view=v;$('#nav').classList.remove('hidden');nav(v);if(v==='home')return window.home();if(v==='chapters')return window.chapters();if(v==='progress')return window.progress();if(v==='library')return window.library();if(v==='ondemand')return window.ondemand();return oldShowView(v)};
})();
</script>
