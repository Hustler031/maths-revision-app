<style>
.v7-home-shell{padding:14px}.v7-home-shell .shell-hero{height:150px;border-radius:18px;background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 38%,var(--card)),color-mix(in srgb,var(--primary) 17%,var(--card)));border:1px solid var(--line)}.v7-home-shell .shell-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:10px}.v7-home-shell .shell-card{height:82px;border-radius:15px;background:var(--card);border:1px solid var(--line)}
</style>
<script>
(function(){
'use strict';
var main=document.getElementById('main'),loader=document.getElementById('loading');
if(!main)return;
if(!main.innerHTML.trim()){
  var cached=null;try{cached=JSON.parse(localStorage.getItem('maths-v7:bootstrap')||'null')}catch(e){}
  if(cached&&window.app&&typeof window.home==='function'){
    try{app.bootstrap=cached;window.home();if(loader)loader.classList.add('hidden');return}catch(e){}
  }
  main.innerHTML='<div class="v7-home-shell"><div class="shell-hero"></div><div class="shell-grid"><div class="shell-card"></div><div class="shell-card"></div><div class="shell-card"></div><div class="shell-card"></div></div></div>';
  if(loader)loader.classList.add('hidden');
}
})();
</script>
