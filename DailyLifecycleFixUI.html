<script>
(function(){
'use strict';
var baseServer=window.server;
if(typeof baseServer==='function'&&!baseServer.__dailyLifecycleGuard){
  var guarded=function(fn){var args=Array.prototype.slice.call(arguments,1);return baseServer.apply(this,[fn].concat(args)).then(function(r){if(fn==='finishSession'&&r&&r.ok===false)throw new Error(r.message||'Daily is not fully saved yet.');return r})};
  guarded.__dailyLifecycleGuard=true;
  window.server=guarded;
}
function resultFor(q){return q&&q.answerMode==='MCQ'?(q._selected===q.correctOption?'correct':'wrong'):'seen'}
function attemptMap(sessionId){
  return new Promise(function(ok,bad){
    google.script.run.withSuccessHandler(function(x){ok(x||{})}).withFailureHandler(function(e){bad(new Error(e&&e.message?e.message:String(e)))}).getSessionAttemptMapV3(sessionId);
  });
}
var baseSaveAttempt=window.saveAttempt;
if(typeof baseSaveAttempt==='function'&&!baseSaveAttempt.__durableDailySave){
  var durableSave=function(q,result){
    if(!q||!window.app||!app.quiz)return baseSaveAttempt.apply(this,arguments);
    if(q._attemptSaved)return q._attemptSavePromise||Promise.resolve({ok:true});
    if(q._attemptSavePromise)return q._attemptSavePromise;
    var payload={questionId:q.questionId,result:result,mastered:!!q.mastered,mode:app.quiz.mode,sessionId:app.quiz.sessionId,nextIndex:app.quiz.index+1,responseSec:(Date.now()-app.qStart)/1000,variantType:q.variantType||'',correctOption:q.correctOption||''};
    var before=(typeof pendingAttemptSave!=='undefined'&&pendingAttemptSave&&typeof pendingAttemptSave.then==='function')?pendingAttemptSave.catch(function(){return null}):Promise.resolve();
    var p=before.then(function(){return window.server('submitRecall',payload)}).then(function(r){
      if(!r||r.ok===false)throw new Error(r&&r.message||'Attempt save failed.');
      q._attemptSaved=true;q._attemptSavePromise=null;return r;
    }).catch(function(e){
      q._attemptSaved=false;q._attemptSavePromise=null;
      if(typeof toast==='function')toast('Saving delayed. Please retry before finishing.');
      throw e;
    });
    q._attemptSavePromise=p;
    if(typeof pendingAttemptSave!=='undefined')pendingAttemptSave=p;
    return p;
  };
  durableSave.__durableDailySave=true;
  window.saveAttempt=durableSave;
}
async function reconcileAnswered(){
  if(!window.app||!app.quiz||!app.quiz.sessionId)return;
  try{if(typeof pendingAttemptSave!=='undefined')await pendingAttemptSave}catch(e){}
  var map=await attemptMap(app.quiz.sessionId),list=app.quiz.questions||[];
  for(var i=0;i<list.length;i++){
    var q=list[i],id=String(q&&q.questionId||'');
    if(!q||!id)continue;
    if(map[id]){q._attemptSaved=true;q._attemptSavePromise=null;continue}
    if(q._revealed&&typeof window.saveAttempt==='function'){
      await window.saveAttempt(q,resultFor(q));
      map[id]=resultFor(q);
    }
  }
}
var baseComplete=window.completeQuiz;
if(typeof baseComplete==='function'&&!baseComplete.__dailyLifecycleGuard){
  var wrapped=async function(){
    if(!window.app||!app.quiz)return baseComplete.apply(this,arguments);
    try{
      await reconcileAnswered();
      return await baseComplete.apply(this,arguments);
    }catch(e){
      if(typeof loading==='function')loading(false);
      if(typeof toast==='function')toast(e&&e.message?e.message:'Last answer is not saved yet. Please retry Finish.');
      throw e;
    }
  };
  wrapped.__dailyLifecycleGuard=true;
  window.completeQuiz=wrapped;
}
})();
</script>
