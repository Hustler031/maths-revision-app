<script>
(function(){

const PREFIX='maths-app-v9:',FRESH=5*60*1000,MAX_STALE=24*60*60*1000;const mem={};let knownVersion='',prefetching=false;
function qs(s,r){return(r||document).querySelector(s)}function qsa(s,r){return Array.from((r||document).querySelectorAll(s))}function esc2(v){return typeof esc==='function'?esc(v):String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function call(name,arg,b){return new Promise((ok,bad)=>{let r=google.script.run.withSuccessHandler(ok).withFailureHandler(e=>bad(new Error(e&&e.message?e.message:String(e))));if(name==='bootstrap')r.getAppBootstrapV9();else if(name==='home')r.getMathsHomeV9();else if(name==='snapshot')r.getMathsSnapshotV9(false);else if(name==='new')r.getMathsNewHubV9();else if(name==='starred')r.getStarredRevisionV9();else if(name==='starGroup')r.getStarredRevisionGroupV9(arg,b);else if(name==='concepts')r.getConceptsHubV9();else if(name==='metric')r.getMathsScopeMetricV9(arg||{});else if(name==='quiz')r.startMathsPracticeV9(arg||{});else if(name==='view')r.getMathsViewItemsV9(arg||{});else if(name==='version')r.getMathsCacheVersionV9();else bad(new Error('Unknown Maths UI endpoint'))})}

function stripHtml(m){m=m||{};return '<div class="ma-strip"><div class="ma-pill coverage">Coverage '+Number(m.coverage||0)+'%</div><div class="ma-pill wrong">✕ '+Number(m.wrong||0)+' Wrong</div><div class="ma-pill difficult">◆ '+Number(m.difficult||0)+'</div><div class="ma-pill starred">☆ '+Number(m.starred||0)+'</div></div>'}function stripHost(){let x=qs('#maStrip');if(x)return x;const top=qs('.topbar');if(!top)return null;x=document.createElement('div');x.id='maStrip';x.className='ma-strip-host';top.insertAdjacentElement('afterend',x);return x}function showStrip(m){if(typeof app!=='undefined'&&(app.view==='home'||app.view==='quiz'))return clearStrip();const x=stripHost();if(x)x.innerHTML=stripHtml(m)}function clearStrip(){qs('#maStrip')?.remove();qs('#mf-strip-host')?.remove();qs('#maths-global-strip')?.remove()}
function kicker(k,t,s){return '<div class="ma-kicker">'+esc2(k)+'</div><div class="ma-title">'+esc2(t)+'</div>'+(s?'<div class="ma-sub">'+esc2(s)+'</div>':'')}function back(id,t){return '<button class="btn ghost ma-back" id="'+id+'">← '+esc2(t)+'</button>'}

function countPicker(req,label){const m=qs('#modal');m.className='modal';m.innerHTML='<div class="sheet"><div class="row between"><div><div class="eyebrow">'+esc2(label)+'</div><div class="quiz-title">How many questions?</div></div><button class="iconbtn" id="maCountX">×</button></div><div class="ma-actions" style="margin-top:14px"><button class="ma-action" data-ma-n="10">10</button><button class="ma-action" data-ma-n="20">20</button><button class="ma-action" data-ma-n="25">25</button></div></div>';qs('#maCountX').onclick=closeModal;m.onclick=e=>{if(e.target===m)closeModal()};qsa('[data-ma-n]',m).forEach(b=>b.onclick=()=>{closeModal();runPractice(Object.assign({},req,{count:Number(b.dataset.maN)}),label)})}

let browseItems=[];function openBrowse(req,title){load(true,'Loading revision…');call('view',req).then(items=>{load(false);browseItems=items||[];const m=qs('#modal');m.className='modal';m.innerHTML='<div class="sheet"><div class="row between"><div><div class="eyebrow">Read-only revision</div><div class="quiz-title">'+esc2(title)+'</div></div><button class="iconbtn" id="maBrowseX">×</button></div><div class="muted" style="font-size:12px;margin-top:5px">'+browseItems.length+' questions · browsing does not create attempts</div><div class="ma-browse">'+browseItems.map((x,i)=>'<div class="ma-browse-row" data-ma-browse="'+i+'"><b>'+esc2((i+1)+'. '+(x.chapter||'Maths'))+'</b><div class="ma-row-sub">'+esc2(String(x.prompt||'').slice(0,170))+'</div></div>').join('')+'</div></div>';qs('#maBrowseX').onclick=closeModal;m.onclick=e=>{if(e.target===m)closeModal()};qsa('[data-ma-browse]',m).forEach(r=>r.onclick=()=>openBrowseDetail(Number(r.dataset.maBrowse))) }).catch(e=>{load(false);toast2(e.message)})}
function openBrowseDetail(i){const x=browseItems[i];if(!x)return;const m=qs('#modal'),opts=(x.options||[]).map(o=>'<div class="ma-card" style="padding:9px 10px"><b>'+esc2(o.key)+'.</b> '+esc2(o.text)+'</div>').join('');m.className='modal';m.innerHTML='<div class="sheet"><div class="row between"><div><div class="eyebrow">'+esc2(x.chapter||'Maths')+'</div><div class="quiz-title">Question '+(i+1)+'</div></div><button class="iconbtn" id="maDetailX">×</button></div><div class="question" style="font-size:18px;margin-top:14px">'+esc2(x.prompt||'')+'</div>'+(opts?'<div class="ma-list">'+opts+'</div>':'')+'<div class="answer-block" style="margin-top:12px"><div class="answer-head">Answer'+(x.correctOption?' · '+esc2(x.correctOption):'')+'</div><div class="answer-body"><div class="formula-answer">'+esc2(x.answer||'')+'</div>'+(x.explanation?'<h4>How it works</h4><div class="explanation">'+esc2(x.explanation)+'</div>':'')+(x.memoryCue?'<h4>Memory cue</h4><div class="memory">'+esc2(x.memoryCue)+'</div>':'')+(x.sourceFile?'<h4>Source</h4><div class="muted">'+esc2(x.sourceFile)+(x.sourcePage?' · p. '+esc2(x.sourcePage):'')+'</div>':'')+'</div></div></div>';qs('#maDetailX').onclick=closeModal;m.onclick=e=>{if(e.target===m)closeModal()}}
function scopeKey(req){const x=Object.assign({},req||{});delete x.title;return 'metric:'+JSON.stringify(x)}function loadMetric(req,seed){const key=scopeKey(req),c=cached(key);if(c&&c.stale)showStrip(c.data);else showStrip(seed||null);const should=!c||!c.fresh||c.version!==knownVersion;if(!should)return;call('metric',req).then(m=>{write(key,m);if(app.view!=='home'&&app.view!=='quiz')showStrip(m)}).catch(()=>{})}
function groupFor(chapter){const x=String(chapter||'').toLowerCase();if(/fraction pattern|triplet|calculation memory|square|cube/.test(x))return'misc';if(/percentage|profit|loss|discount|ratio|proportion|average|mixture|alligation|interest|time.*work|pipe|cistern|speed|distance|train|boat|stream|partnership|ages|work.*wage/.test(x))return'arithmetic';return'advanced'}
function renderHome(d){if(app.view!=='home')return;clearStrip();d=d||{};const s=d.schedule||{},daily=d.daily||{},day=Math.max(1,Number(s.day||1)),chapter=String(s.chapter||'Daily Practice'),target=Math.max(1,Number(daily.target||20)),done=Math.max(0,Math.min(target,Number(daily.done||0))),left=Math.max(0,target-done),pct=Math.round(done*100/target);let html='<div class="ma-home"><div class="ma-hero"><div class="ma-kicker">Today’s Maths</div><h2>Day '+day+' · '+esc2(chapter)+'</h2><div class="ma-hero-desc">Finish Day '+day+' first, then use focused practice.</div><div class="ma-goal"><span>Today’s Goal</span><b>'+done+' / '+target+'</b></div><div class="ma-track"><i style="width:'+pct+'%"></i></div><div class="ma-hero-note">Fresh-first: '+target+' questions · reinforcement 0</div><button class="ma-hero-btn" id="maDaily">'+(done?'Continue Day '+day+' · '+left+' left':'Start Day '+day+' · '+left+' left')+'</button></div>';if(d.resume&&!d.resumeIsDaily)html+='<div class="ma-resume"><div><b>Resume '+esc2(d.resume.title||'practice')+'</b><div class="ma-row-sub">Question '+(Number(d.resume.currentIndex||0)+1)+' / '+Number(d.resume.total||0)+'</div></div><button class="btn soft" id="maResume">Resume</button></div>';if(d.pending&&d.pending.length){const p=d.pending[0];html+='<div class="ma-card ma-click" id="maPending" style="margin-top:10px"><div class="ma-row"><div><b>Pending · Day '+Number(p.day||0)+'</b><div class="ma-row-sub">'+esc2(p.chapter||'')+'</div></div><span class="ma-chevron">›</span></div></div>'}html+='<div class="ma-quick-head">Quick Start</div><div class="ma-quick"><div class="ma-quick-card" id="maNew"><span class="ma-quick-icon">✨</span><span><span class="ma-quick-title">New Practice</span><span class="ma-quick-sub">'+Number(d.newCount||0)+' unseen · recent additions by chapter</span></span><span class="ma-chevron">›</span></div><div class="ma-quick-card" id="maStar"><span class="ma-quick-icon">⭐</span><span><span class="ma-quick-title">Starred Revision</s function home(){setView('home','home');clearStrip();const c=cached('home');if(c&&c.stale)renderHome(c.data);else main('<div class="ma-loading-shell"><div class="ma-loading-card"></div></div>');const should=!c||!c.fresh||c.version!==knownVersion;if(should)call('home').then(d=>{write('home',d);if(app.view==='home')renderHome(d)}).catch(e=>{if(!c)toast2(e.message)});else renderHome(c.data)}

function openGroup(key){const g=chapterGroups(),list=key==='advanced'?g.advanced:key==='arithmetic'?g.arithmetic:key==='misc'?g.misc:[],title=key==='advanced'?'Advanced':key==='arithmetic'?'Arithmetic':key==='misc'?'MISC':'Mock Questions';setView('chapters','chapters');if(key==='mocks'){const req={scope:'demand_set',setId:'MOCK_QUESTIONS',title:'Mock Questions'};main('<div class="ma-page">'+back('maGroupBack','Practice Hub')+kicker('Mocks','Mock Questions','Saved mock-question collection')+'<div class="ma-actions-shell">'+actions('standard')+'</div></div>');qs('#maGroupBack').onclick=chapters;bindActions(qs('#main'),req,'standard');loadMetric(req);return}const total=list.reduce((a,c)=>a+Number(c.total||0),0),req={scope:'group',chapters:list.map(c=>c.chapter),groupName:key,title};main('<div class="ma-page">'+back('maGroupBack','Practice Hub')+kicker(title,total+' questions','')+'<div class="ma-actions-shell">'+actions('standard')+'</div><div class="ma-section">Chapters</div><div class="ma-list">'+list.map(c=>'<div class="ma-card ma-click" data-ma-ch="'+esc2(c.chapter)+'"><div class="ma-row"><div><div class="ma-row-title">'+esc2(c.chapter)+'</div><div class="ma-row-sub">'+Number(c.total||0)+' questions</div></div><span class="ma-chevron">›</span></div></div>').join('')+'</div></div>');qs('#maGroupBack').onclick=chapters;bindActions(qs('#main'),req,'standard');qsa('[data-ma-ch]').forEach(x=>x.onclick=()=>openChapter(x.dataset.maCh));loadMetric(req)}

function openChapter(chapter){const c=chapterInfo(chapter);if(!c)return toast2('Chapter not found');setView('chapters','chapters');let topics=c.majorTopics||[];if(String(chapter).toLowerCase()==='coordinate geometry'){const mp={};topics.forEach(t=>mp[String(t.name||'').toLowerCase()]=t);topics=['Questions','Concepts'].map(n=>mp[n.toLowerCase()]||{name:n,key:n,total:0})}const req={scope:'chapter',chapter,title:chapter},attempted=Math.max(0,Number(c.total||0)-Number(c.remaining||0)),pct=Number(c.total||0)?Math.round(attempted*100/Number(c.total)):0;main('<div class="ma-page">'+back('maChapterBack','Chapters')+kicker('Chapter',chapter,Number(c.total||0)+' questions · '+attempted+' attempted')+'<div class="ma-progress"><i style="width:'+pct+'%"></i></div><div class="ma-actions-shell">'+actions('standard')+'</div>'+(topics.length?'<div class="ma-section">Study banks</div><div class="ma-list">'+topics.map(t=>'<div class="ma-card ma-click" data-ma-topic="'+esc2(t.key||t.name)+'"><div class="ma-row"><div><div class="ma-row-title">'+esc2(t.name)+'</div><div class="ma-row-sub">'+Number(t.total||0)+' questions</div></div><span class="ma-chevron">›</span></div></div>').join('')+'</div>':'')+'</div>');qs('#maChapterBack').onclick=chapters;bindActions(qs('#main'),req,'standard');qsa('[data-ma-topic]').forEach(x=>x.onclick=()=>openTopic(chapter,x.dataset.maTopic));loadMetric(req)}
function openTopic(chapter,key){const c=chapterInfo(chapter),t=c&&(c.majorTopics||[]).find(x=>String(x.key||x.name)===String(key)||String(x.name||'').toLowerCase()===String(key||'').toLowerCase())||{name:key,key,total:0};setView('chapters','chapters');const req={scope:'topic',chapter,majorTopic:t.key||t.name,title:chapter+' · '+t.name};main('<div class="ma-page">'+back('maTopicBack',chapter)+kicker(chapter,t.name,Number(t.total||0)+' questions')+'<div class="ma-actions-shell">'+actions('standard')+'</div></div>');qs('#maTopicBack').onclick=()=>openChapter(chapter);bindActions(qs('#main'),req,'standard');loadMetric(req)}
function renderNew(d){if(app.view!=='new')return;d=d||{overall:{},chapters:[]};main('<div class="ma-page">'+back('maNewBack','Home')+kicker('Fresh material','New Practice',Number(d.overall&&d.overall.total||0)+' recent unseen questions')+'<div class="ma-actions-shell">'+actions('standard')+'</div><div class="ma-section">By Chapter</div><div class="ma-list">'+(d.chapters||[]).map(c=>'<div class="ma-card ma-click" data-ma-newch="'+esc2(c.chapter)+'"><div class="ma-row"><div><div class="ma-row-title">'+esc2(c.chapter)+'</div><div class="ma-row-sub">'+Number(c.metric&&c.metric.total||0)+' unseen · <span class="ma-purple">◆ '+Number(c.metric&&c.metric.difficult||0)+'</span> · <span class="ma-amber">☆ '+Number(c.metric&&c.metric.starred||0)+'</span></div></div><span class="ma-chevron">›</span></div></div>').join('')+'</div></div>');showStrip(d.overall);qs('#maNewBack').onclick=home;bindActions(qs('#main'),{scope:'new_practice',title:'All New Practice'},'standard');qsa('[data-ma-newch]').forEach(x=>x.onclick=()=>openNewChapter(x.dataset.maNewch,d))}
function openNew(){setView('new','home');const c=cached('new');if(c&&c.stale)renderNew(c.data);else main('<div class="ma-loading-shell"><div class="ma-loading-card"></div></div>');const should=!c||!c.fresh||c.version!==knownVersion;if(should)call('new').then(d=>{write('new',d);if(app.view==='new')renderNew(d)}).catch(e=>{if(!c)toast2(e.message)});else renderNew(c.data)}
function openNewChapter(ch,d){const row=(d.chapters||[]).find(x=>String(x.chapter)===String(ch))||{metric:{}};const req={scope:'new_practice',chapter:ch,title:ch+' · New Practice'};main('<div class="ma-page">'+back('maNewChBack','New Practice')+kicker('New Practice',ch,Number(row.metric&&row.metric.total||0)+' unseen')+'<div class="ma-actions-shell">'+actions('standard')+'</div></div>');qs('#maNewChBack').onclick=openNew;bindActions(qs('#main'),req,'standard');showStrip(row.metric);loadMetric(req,row.metric)}
function statsLine(s){s=s||{};return Number(s.starred||0)+' Starred · '+Number(s.mastered||0)+' Mastered · '+Number(s.focus||0)+' Focus'}
function histRow(label,s,lo,hi,type){return '<div class="ma-history-row"><div class="ma-history-head" data-ma-range="'+lo+'-'+hi+'" data-ma-type="'+type+'"><div><b>'+esc2(label)+'</b><div class="ma-row-sub">'+statsLine(s)+'</div></div><span class="ma-chevron">›</span></div><div class="ma-history-body ma-hidden" data-ma-body="'+lo+'-'+hi+'"><div class="ma-actions-shell" style="margin:0">'+actions('revision')+'</div><div class="ma-days"></div></div></div>'}
function renderStarred(d){if(app.view!=='starred')return;d=d||{stats:{},recentDays:[],tenBlocks:[],months:[]};let h='<div class="ma-page">'+back('maStarBack','Home')+kicker('Revision','⭐ Starred Revision','Starred and difficult questions share one revision history.')+'<div class="ma-card"><div class="ma-row-title">All Starred Revision</div><div class="ma-row-sub">'+statsLine(d.stats)+'</div><div class="ma-actions-shell" style="margin-bottom:0">'+actions('revision')+'</div></div><div class="ma-section">Study history</div><div class="ma-history">';(d.recentDays||[]).forEach(x=>h+=histRow('Day '+x.day,x.stats,x.day,x.day,'day'));(d.tenBlocks||[]).forEach(x=>h+=histRow('Days '+x.lo+'–'+x.hi,x.stats,x.lo,x.hi,'block'));(d.months||[]).forEach(x=>h+=histRow((x.label||'Month')+' · Days '+x.lo+'–'+x.hi,x.stats,x.lo,x.hi,'block'));h+='</div></div>';main(h);qs('#maStarBack').onclick=home;bindActions(qs('#main'),{scope:'star_history',starLo:1,starHi:999999,title:'All Starred Revision'},'revision');qsa('[data-ma-range]').forEach(head=>head.onclick=()=>toggleHistory(head))}
function toggleHistory(head){const [lo,hi]=head.dataset.maRange.split('-').map(Number),body=qs('[data-ma-body="'+lo+'-'+hi+'"]'),opening=body.classList.contains('ma-hidden');body.classList.toggle('ma-hidden',!opening);head.querySelector('.ma-chevron').textContent=opening?'⌄':'›';if(!opening)return;bindActions(body,{scope:'star_history',starLo:lo,starHi:hi,title:lo===hi?'Day '+lo:'Days '+lo+'–'+hi},'revision');if(head.dataset.maType==='day')return;const wrap=qs('.ma-days',body);if(wrap.dataset.loaded)return;wrap.innerHTML='<div class="ma-row-sub" style="padding:8px">Loading days…</div>';call('starGroup',lo,hi).then(r=>{wrap.dataset.loaded='1';wrap.innerHTML=(r.days||[]).map(d=>'<div class="ma-day"><div class="ma-day-head" data-ma-day="'+d.day+'"><div><b>'+esc2(d.label)+'</b><div class="ma-row-sub">'+statsLine(d.stats)+'</div></div><span class="ma-chevron">›</span></div><div class="ma-history-body ma-hidden"><div class="ma-actions-shell" style="margin:0">'+actions('revision')+'</div></div></div>').join('');qsa('[data-ma-day]',wrap).forEach(h=>h.onclick=()=>{const p=h.parentElement.querySelector('.ma-history-body'),open=p.classList.contains('ma-hidden');p.classList.toggle('ma-hidden',!open);h.querySelector('.ma-chevron').textContent=open?'⌄':'›';if(open)bindActions(p,{scope:'star_history',starLo:Number(h.dataset.maDay),starHi:Number(h.dataset.maDay),title:'Day '+h.dataset.maDay},'revision')})}).catch(e=>wrap.innerHTML='<div class="ma-row-sub">'+esc2(e.message)+'</div>')}
function openStarred(){setView('starred','home');const c=cached('starred');if(c&&c.stale)renderStarred(c.data);else main('<div class="ma-loading-shell"><div class="ma-loading-card"></div></div>');const should=!c||!c.fresh||c.version!==knownVersion;if(should)call('starred').then(d=>{write('starred',d);if(app.view==='starred')renderStarred(d)}).catch(e=>{if(!c)toast2(e.message)});else renderStarred(c.data);loadMetric({scope:'star_history',starLo:1,starHi:999999,title:'Starred Revision'})}
function renderConcepts(d){if(app.view!=='concepts')return;d=d||{metric:{},chapters:[]};main('<div class="ma-page">'+back('maConceptBack','Home')+kicker('Saved','🧠 Concepts','Questions deliberately saved for concept revision.')+'<div class="ma-actions-shell">'+actions('concepts')+'</div><div class="ma-section">By Chapter</div><div class="ma-list">'+(d.chapters||[]).map(c=>'<div class="ma-card ma-click" data-ma-conch="'+esc2(c.chapter)+'"><div class="ma-row"><div class="ma-row-title">'+esc2(c.chapter)+'</div><span class="ma-chip">'+Number(c.metric&&c.metric.total||0)+' Q</span></div></div>').join('')+'</div></div>');showStrip(d.metric);qs('#maConceptBack').onclick=home;bindActions(qs('#main'),{scope:'concept_saved',title:'Concepts'},'concepts');qsa('[data-ma-conch]').forEach(x=>x.onclick=()=>openConceptChapter(x.dataset.maConch,d))}
function openConcepts(){setView('concepts','home');const c=cached('concepts');if(c&&c.stale)renderConcepts(c.data);else main('<div class="ma-loading-shell"><div class="ma-loading-card"></div></div>');const should=!c||!c.fresh||c.version!==knownVersion;if(should)call('concepts').then(d=>{write('concepts',d);if(app.view==='concepts')renderConcepts(d)}).catch(e=>{if(!c)toast2(e.message)});else renderConcepts(c.data)}
function openConceptChapter(ch,d){const row=(d.chapters||[]).find(x=>String(x.chapter)===String(ch))||{metric:{}};main('<div class="ma-page">'+back('maConChBack','Concepts')+kicker('Concepts',ch,Number(row.metric&&row.metric.total||0)+' saved questions')+'<div class="ma-actions-shell">'+actions('concepts')+'</div></div>');qs('#maConChBack').onclick=openConcepts;bindActions(qs('#main'),{scope:'concept_saved',chapter:ch,title:ch+' · Concepts'},'concepts');showStrip(row.metric)}
function progress(){setView('progress','progress');const c=cached('snapshot');if(c&&c.stale)renderProgress(c.data);else main('<div class="ma-loading-shell"><div class="ma-loading-card"></div></div>');const should=!c||!c.fresh||c.version!==knownVersion;if(should)call('snapshot').then(d=>{write('snapshot',d);if(app.view==='progress')renderProgress(d)}).catch(e=>{if(!c)toast2(e.message)});else renderProgress(c.data)}
function renderProgress(d){if(app.view!=='progress')return;const o=d&&d.overall||{};let h='<div class="ma-page">'+kicker('Overview','Progress','')+'<div class="ma-overview"><div><b>'+Number(o.total||0)+'</b><span>Total Q</span></div><div><b>'+Number(o.attempted||0)+'</b><span>Encountered</span></div><div><b class="ma-red">✕ '+Number(o.wrong||0)+'</b><span>Wrong</span><small>'+Number(o.wrongPct||0)+'%</small></div><div><b class="ma-purple">◆ '+Number(o.difficult||0)+'</b><span>Difficult</span><small>'+Number(o.difficultPct||0)+'%</small></div><div><b class="ma-amber">☆ '+Number(o.starred||0)+'</b><span>Starred</span><small>'+Number(o.starredPct||0)+'%</small></div></div><div class="ma-progress"><i style="width:'+Number(o.coverage||0)+'%"></i></div><div class="ma-row-sub"><b>'+Number(o.attempted||0)+' / '+Number(o.total||0)+'</b> encountered · '+Number(o.unseen||0)+' left</div><div class="ma-section">By Chapter</div><div class="ma-list">';(d.chapters||[]).forEach(c=>{const m=c.metric||{};h+='<div class="ma-card"><div class="ma-row"><div class="ma-row-title">'+esc2(c.chapter)+'</div><span class="ma-chip">'+Number(m.total||0)+' Q</span></div><div class="ma-progress"><i style="width:'+Number(m.coverage||0)+'%"></i></div><div class="ma-row-sub"><span class="ma-red">✕ Wrong <b>'+Number(m.wrong||0)+'</b></span> · <span class="ma-purple">◆ Difficult <b>'+Number(m.difficult||0)+'</b></span> · <span class="ma-amber">☆ Starred <b>'+Number(m.starred||0)+'</b></span> · Left <b>'+Number(m.unseen||0)+'</b></div></div>'});h+='</div></div>';main(h);showStrip(o)}
function library(){setView('library','library');clearStrip();const l=app.bootstrap&&app.bootstrap.library||{},items=[['Formula','Σ',l.formulas],['Methods','⚡',l.methods],['Fractions','⅞',l.fractions],['Triplets','△',l.triplets],['Marked','⭐',l.marked],['Notes','📝',l.notes],['Recent','＋',l.recent]];main('<div class="ma-page">'+kicker('Reference','Library','Formula, methods, notes and saved material.')+'<div class="ma-groups">'+items.map(x=>'<div class="ma-group" data-ma-lib="'+x[0]+'"><div class="ma-kicker">'+x[1]+' '+x[0]+'</div><b>'+Number(x[2]||0)+' cards</b></div>').join('')+'</div></div>');qsa('[data-ma-lib]').forEach(x=>x.onclick=()=>beginQuiz('library',{cluster:x.dataset.maLib}))}
function ondemand(){setView('ondemand','ondemand');clearStrip();const sets=(app.bootstrap&&app.bootstrap.demandSets||[]).filter(s=>String(s.setId)!=='MOCK_QUESTIONS'),chs=(app.bootstrap&&app.bootstrap.chapters||[]).map(x=>x.chapter);main('<div class="ma-page">'+kicker('Custom','On Demand','Calculation Training and preserved custom sets.')+'<div class="ma-card"><div class="ma-row-title">Quick chapter practice</div><select id="maODChapter" style="width:100%;margin:10px 0;padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--text)"><option value="">All chapters</option>'+chs.map(x=>'<option>'+esc2(x)+'</option>').join('')+'</select><button class="btn primary" style="width:100%" id="maODStart">Start 20 random</button></div><div class="ma-section">Saved sets</div><div class="ma-list">'+sets.map(s=>'<div class="ma-card"><div class="ma-row"><div><div class="ma-row-title">'+esc2(s.name)+'</div><div class="ma-row-sub">'+Number(s.count||0)+' questions'+(s.setId==='CALC_TRAINING'?' · '+Number(s.dayCount||0)+' days':'')+'</div></div><button class="btn soft" data-ma-set="'+esc2(s.setId)+'">'+(s.setId==='CALC_TRAINING'?'Open':'Practice')+'</button></div></div>').join('')+'</div></div>');qs('#maODStart').onclick=()=>beginQuiz('ondemand',{chapter:qs('#maODChapter').value,count:20,activeOnly:true});qsa('[data-ma-set]').forEach(b=>b.onclick=()=>{if(b.dataset.maSet==='CALC_TRAINING')openCalculationHub(b.dataset.maSet);else startDemandSet(b.dataset.maSet)})}
function route(v){if(v==='home')return home();if(v==='chapters')return chapters();if(v==='library')return library();if(v==='ondemand')return ondemand();if(v==='progress')return progress()}
window.showView=route;window.home=home;window.chapters=chapters;window.library=library;window.ondemand=ondemand;window.progress=progress;window.openStudyGroup=openGroup;window.openChapterHub=openChapter;window.openTopicHub=openTopic;window.openGlobalNewV3=openNew;window.openStarredRevisionV3=openStarred;window.openConceptsV4=openConcepts;
function refreshBootstrap(){return call('bootstrap').then(b=>{app.bootstrap=b;knownVersion=String(b.version||knownVersion);write('bootstrap',b);return b})}
function checkVersion(){call('version').then(v=>{const nv=String(v&&v.version||'');if(!nv)return;if(knownVersion&&nv!==knownVersion){knownVersion=nv;Object.keys(mem).forEach(k=>{if(k!=='bootstrap')drop(k)});refreshBootstrap().then(()=>{if(app.view==='home')home()})}else knownVersion=nv}).catch(()=>{})}
function prefetch(){if(prefetching)return;prefetching=true;Promise.allSettled([call('snapshot').then(d=>write('snapshot',d)),call('new').then(d=>write('new',d)),call('starred').then(d=>write('starred',d)),call('concepts').then(d=>write('concepts',d))]).finally(()=>prefetching=false)}

document.addEventListener('click',e=>{const b=e.target.closest('#nav button[data-view]');if(!b)return;e.preventDefault();e.stopPropagation();route(b.dataset.view)},true);
setTimeout(()=>{const bc=cached('bootstrap');if(bc&&bc.stale){app.bootstrap=bc.data;knownVersion=String(bc.version||bc.data.version||'')}const hc=cached('home');setView('home','home');if(hc&&hc.stale)renderHome(hc.data);else main('<div class="ma-loading-shell"><div class="ma-loading-card"></div></div>');refreshBootstrap().then(()=>home()).catch(()=>{if(!hc&&app.bootstrap)home()});setTimeout(checkVersion,450);setTimeout(prefetch,1200)},0);
})();
