<style>

:root{--mf-red:#ff7f89;--mf-purple:#b79cff;--mf-amber:#e8bd66;--mf-green:#72d994;--mf-indigo:#9eabff}
.brand h1{font-size:26px!important;line-height:1.08!important;letter-spacing:-.025em!important}.brand small{font-size:15px!important;line-height:1.25!important}.topbar{padding:16px 16px!important}.iconbtn{width:42px!important;height:42px!important}
#maths-global-strip{display:none!important}.v5-scope-strip,.v4-strip-wrap,.v6-scope,.v6-module-panel>.v6-strip,.v7-page-strip,.maths-top-strip{display:none!important}
.mf-strip-host{padding:10px 16px 9px;background:var(--bg);border-bottom:1px solid color-mix(in srgb,var(--line) 74%,transparent)}
.mf-strip{display:grid;grid-template-columns:1.15fr repeat(3,minmax(0,1fr));gap:6px;width:100%}.mf-pill{height:39px;border:1px solid var(--line);border-radius:999px;display:flex;align-items:center;justify-content:center;gap:4px;min-width:0;font-size:12px;font-weight:850;white-space:nowrap;background:var(--card)}
.mf-pill.coverage{color:var(--mf-indigo);border-color:color-mix(in srgb,var(--mf-indigo) 38%,var(--line));background:color-mix(in srgb,var(--mf-indigo) 7%,var(--card))}.mf-pill.wrong{color:var(--mf-red);border-color:color-mix(in srgb,var(--mf-red) 38%,var(--line));background:color-mix(in srgb,var(--mf-red) 7%,var(--card))}.mf-pill.difficult{color:var(--mf-purple);border-color:color-mix(in srgb,var(--mf-purple) 38%,var(--line));background:color-mix(in srgb,var(--mf-purple) 7%,var(--card))}.mf-pill.starred{color:var(--mf-amber);border-color:color-mix(in srgb,var(--mf-amber) 38%,var(--line));background:color-mix(in srgb,var(--mf-amber) 7%,var(--card))}.mf-pill.pending{color:var(--muted)}
.mf-page{padding:18px 16px 98px!important}.mf-title{font-size:28px;line-height:1.12;font-weight:900;letter-spacing:-.025em;margin:3px 0}.mf-kicker{font-size:13px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--primary);margin-bottom:4px}.mf-sub{font-size:14px;line-height:1.35;color:var(--muted)}.mf-section{font-size:20px;font-weight:900;letter-spacing:-.015em;margin:24px 0 11px}.mf-back{min-height:45px!important;padding:8px 13px!important;font-size:14px!important;border-radius:13px!important;margin-bottom:17px}.mf-card{border:1px solid var(--line);border-radius:17px;background:var(--card);padding:15px;box-shadow:none}.mf-list{display:grid;gap:10px}.mf-click{cursor:pointer}.mf-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.mf-row-title{font-size:18px;font-weight:850;line-height:1.18}.mf-row-sub{font-size:13px;color:var(--muted);line-height:1.3;margin-top:4px}.mf-chip{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;padding:6px 9px;color:var(--muted);font-size:12px}.mf-chevron{font-size:22px;color:var(--muted)}
.mf-actions-shell{border:1px solid var(--line);border-radius:17px;background:var(--card);padding:12px;margin:14px 0 3px}.mf-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.mf-action{min-height:47px;border:1px solid color-mix(in srgb,var(--primary) 25%,var(--line));border-radius:13px;background:color-mix(in srgb,var(--primary) 8%,var(--card));color:var(--primary);font-size:13px;font-weight:850;padding:8px 5px}.mf-action:active{transform:translateY(1px)}.mf-action:disabled{opacity:.38}.mf-action.difficult{color:var(--mf-purple);border-color:color-mix(in srgb,var(--mf-purple) 28%,var(--line));background:color-mix(in srgb,var(--mf-purple) 6%,var(--card))}.mf-action.starred{color:var(--mf-amber);border-color:color-mix(in srgb,var(--mf-amber) 28%,var(--line));background:color-mix(in srgb,var(--mf-amber) 6%,var(--card))}
/* Home closely follows the English visual hierarchy, but retains Maths content. */
.mf-home{padding:18px 16px 102px!important}.mf-hero{border-radius:22px;padding:22px 20px;background:linear-gradient(135deg,#3656d8 0%,#7489ec 100%);color:#fff;box-shadow:0 13px 32px rgba(40,67,180,.20)}.mf-hero-kicker{font-size:14px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#e8ecff}.mf-hero h2{font-size:31px;line-height:1.11;letter-spacing:-.03em;margin:7px 0 15px;max-width:96%}.mf-hero-desc{font-size:16px;line-height:1.38;color:rgba(255,255,255,.87);margin-bottom:17px}.mf-goal{display:flex;align-items:center;justify-content:space-between;font-size:15px;margin-top:2px}.mf-goal b{font-size:17px}.mf-daily-track{height:8px;background:rgba(255,255,255,.28);border-radius:999px;overflow:hidden;margin:9px 0 8px}.mf-daily-track i{display:block;height:100%;background:#fff;border-radius:999px}.mf-fresh-note{font-size:13px;line-height:1.3;color:rgba(255,255,255,.78)}.mf-hero-cta{margin-top:18px;min-height:50px;border:0;border-radius:14px;padding:10px 17px;background:#fff;color:#3152c7;font-size:16px;font-weight:900}.mf-resume{margin-top:13px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 16px;border:1px solid var(--line);border-radius:17px;background:var(--card)}.mf-resume-title{font-size:17px;font-weight:850;line-height:1.18}.mf-resume-sub{font-size:14px;color:var(--muted);margin-top:4px}.mf-resume-btn{min-height:47px!important;padding:9px 16px!important;font-size:15px!important;border-radius:13px!important;flex:0 0 auto}.mf-quick-head{font-size:20px;font-weight:900;margin:25px 0 11px}.mf-quick{display:grid;gap:10px}.mf-quick-card{display:grid;grid-template-columns:46px minmax(0,1fr) auto;align-items:center;gap:12px;min-height:82px;padding:13px 15px;border:1px solid var(--line);border-radius:17px;background:var(--card);cursor:pointer}.mf-quick-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--primary) 10%,var(--card));font-size:23px}.mf-quick-title{font-size:18px;font-weight:900;line-height:1.15}.mf-quick-sub{font-size:13px;color:var(--muted);line-height:1.3;margin-top:4px}.mf-pending{margin-top:13px;padding:12px 14px;border:1px solid var(--line);border-radius:15px;background:var(--card)}
/* Practice hub/group cards */
.mf-groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.mf-group{min-height:116px;padding:16px;border:1px solid var(--line);border-radius:17px;background:var(--card);display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}.mf-group .mf-kicker{font-size:13px}.mf-group b{font-size:21px}.mf-group small{font-size:13px;color:var(--muted);line-height:1.3}
/* Progress */
.mf-overview{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:12px 0}.mf-overview>div{min-height:91px;border:1px solid var(--line);border-radius:15px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:7px 3px}.mf-overview b{font-size:20px;line-height:1.05}.mf-overview span{font-size:10px;color:var(--muted);margin-top:5px}.mf-overview small{font-size:9px;color:var(--muted);margin-top:2px}.mf-overview .wrong{border-color:color-mix(in srgb,var(--mf-red) 34%,var(--line))}.mf-overview .wrong b{color:var(--mf-red)}.mf-overview .difficult{border-color:color-mix(in srgb,var(--mf-purple) 34%,var(--line))}.mf-overview .difficult b{color:var(--mf-purple)}.mf-overview .starred{border-color:color-mix(in srgb,var(--mf-amber) 34%,var(--line))}.mf-overview .starred b{color:var(--mf-amber)}.mf-progress-track{height:7px;background:var(--line);border-radius:999px;overflow:hidden;margin:10px 0}.mf-progress-track i{display:block;height:100%;background:var(--mf-green);border-radius:999px}.mf-progress-summary{font-size:13px;color:var(--muted)}.mf-progress-summary b{color:var(--text)}.mf-chapter-progress{padding:15px 15px 13px}.mf-diagnostics{font-size:13px;color:var(--muted);line-height:1.45;margin-top:8px}.mf-red{color:var(--mf-red)}.mf-purple{color:var(--mf-purple)}.mf-amber{color:var(--mf-amber)}
/* Starred / accordion */
.mf-star-hero{border-color:color-mix(in srgb,var(--mf-amber) 28%,var(--line));background:color-mix(in srgb,var(--mf-amber) 5%,var(--card))}.mf-star-stats{font-size:14px;color:var(--muted);margin-top:5px;margin-bottom:12px}.mf-history{display:grid;gap:9px}.mf-history-row{border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}.mf-history-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 15px;cursor:pointer}.mf-history-head b{font-size:17px}.mf-history-head small{display:block;font-size:13px;color:var(--muted);margin-top:4px}.mf-history-body{padding:0 12px 12px}.mf-hidden{display:none!important}
/* Existing quiz stays untouched; only Pause typography receives a consistent size. */
.maths-pause-sheet h2{font-size:21px!important}.maths-pause-sheet p{font-size:13px!important}.maths-pause-sheet .btn{font-size:13px!important}
@media(max-width:390px){.brand h1{font-size:24px!important}.brand small{font-size:14px!important}.topbar{padding:14px 13px!important}.mf-strip-host{padding:8px 10px}.mf-strip{gap:4px}.mf-pill{height:36px;font-size:10.2px}.mf-page,.mf-home{padding-left:13px!important;padding-right:13px!important}.mf-title{font-size:25px}.mf-section{font-size:18px}.mf-hero{padding:20px 17px}.mf-hero h2{font-size:28px}.mf-hero-desc{font-size:15px}.mf-quick-title{font-size:17px}.mf-quick-sub{font-size:12px}.mf-actions{gap:7px}.mf-action{min-height:45px;font-size:11.5px}.mf-overview{gap:5px}.mf-overview b{font-size:17px}.mf-overview span{font-size:8px}.mf-overview small{font-size:8px}.mf-diagnostics{font-size:12px}}
</style>
<script>
(function(){
'use strict';
var CACHE_PREFIX='maths-final:';
var FRESH_MS=5*60*1000;
var MAX_STALE_MS=24*60*60*1000;
var legacy={library:window.library,ondemand:window.ondemand,startDemandSet:window.startDemandSet,openCalculationHub:window.openCalculationHub};
function el(s,r){return (r||document).querySelector(s)}
function els(s,r){return Array.from((r||document).querySelectorAll(s))}
function safeEsc(v){return typeof esc==='function'?esc(v):String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toastSafe(s){if(typeof toast==='function')toast(String(s||''))}
function cacheRead(key){try{var x=JSON.parse(localStorage.getItem(CACHE_PREFIX+key)||'null');if(!x||!x.ts)return null;return {data:x.data,fresh:(Date.now()-x.ts)<=FRESH_MS,stale:(Date.now()-x.ts)<=MAX_STALE_MS,ts:x.ts}}catch(e){return null}}
function cacheWrite(key,data){try{localStorage.setItem(CACHE_PREFIX+key,JSON.stringify({ts:Date.now(),version:data&&data.version||'',data:data}))}catch(e){}return data}
function cacheDrop(key){try{localStorage.removeItem(CACHE_PREFIX+key)}catch(e){}}
function server(name,arg){return new Promise(function(ok,bad){var r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){bad(new Error(e&&e.message?e.message:String(e)))});if(name==='home')r.getMathsHomeV8();else if(name==='snapshot')r.getMathsSnapshotV8(false);else if(name==='new')r.getMathsNewHubV8();else if(name==='starred')r.getStarredRevisionV6();else if(name==='concepts')r.getConceptsHubV6();else if(name==='metric')r.getMathsScopeMetricV6(arg||{});else if(name==='quiz')r.startMathsV6Quiz(arg||{});else if(name==='view')r.getMathsViewItemsV4(arg||{});else bad(new Error('Unknown Maths final endpoint: '+name))})}
function stripHtml(m){if(!m)return '<div class="mf-strip"><div class="mf-pill pending">Coverage —</div><div class="mf-pill pending">✕ — Wrong</div><div class="mf-pill pending">◆ —</div><div class="mf-pill pending">☆ —</div></div>';return '<div class="mf-strip"><div class="mf-pill coverage">Coverage '+Number(m.coverage||0)+'%</div><div class="mf-pill wrong">✕ '+Number(m.wrong||0)+' Wrong</div><div class="mf-pill difficult">◆ '+Number(m.difficult||0)+'</div><div class="mf-pill starred">☆ '+Number(m.starred||0)+'</div></div>'}
function stripHost(){var x=el('#mf-strip-host');if(x)return x;var old=el('#maths-global-strip');if(old)old.remove();var top=el('.topbar'),main=el('#main');if(!top||!main)return null;x=document.createElement('div');x.id='mf-strip-host';x.className='mf-strip-host';top.insertAdjacentElement('afterend',x);return x}
function clearStrip(){var x=el('#mf-strip-host');if(x)x.remove();var old=el('#maths-global-strip');if(old)old.remove()}
function showStrip(m){if(window.app&&(app.view==='home'||app.view==='quiz'))return clearStrip();var x=stripHost();if(x)x.innerHTML=stripHtml(m)}
function scopeKey(req){var x=Object.assign({},req||{});delete x.title;return 'metric:'+JSON.stringify(x)}
function loadScope(req,seed){var key=scopeKey(req),c=cacheRead(key);showStrip(c&&c.stale?c.data:(seed||null));server('metric',req).then(function(m){cacheWrite(key,m);if(window.app&&app.view!=='home'&&app.view!=='quiz')showStrip(m)}).catch(function(){})}
function setMain(html){var main=el('#main');if(main)main.innerHTML=html;var n=el('#nav');if(n)n.classList.remove('hidden')}
function setView(view,navKey){if(window.app)app.view=view;if(typeof nav==='function')nav(navKey||view)}
function groupFor(chapter){var x=String(chapter||'').toLowerCase();if(/fraction pattern|triplet|calculation memory|square|cube/.test(x))return'misc';if(/percentage|profit|loss|discount|ratio|proportion|average|mixture|alligation|interest|time.*work|pipe|cistern|speed|distance|train|boat|stream|partnership|ages|work.*wage/.test(x))return'arithmetic';return'advanced'}
function chapterByName(name){return (app.bootstrap&&app.bootstrap.chapters||[]).find(function(c){return String(c.chapter)===String(name)})}
function snapshotSeedFor(req){var c=cacheRead('snapshot'),s=c&&c.stale?c.data:null;if(!s)return null;if(req.scope==='all')return s.overall;if(req.scope==='group'){if(req.groupName==='advanced')return s.advanced;if(req.groupName==='arithmetic')return s.arithmetic;if(req.groupName==='misc')return s.misc}if(req.scope==='chapter'){var row=(s.chapters||[]).find(function(x){return String(x.chapter)===String(req.chapter)});return row&&row.metric||null}return null}
function refreshSnapshot(renderIf){var c=cacheRead('snapshot');server('snapshot').then(function(s){cacheWrite('snapshot',s);if(typeof renderIf==='function')renderIf(s,c&&c.data)}).catch(function(){})}
function actionsHtml(mode){var items=mode==='revision'?['view','all','new','weak','difficult','random']:mode==='concepts'?['view','all','new','weak','random']:['all','new','weak','starred','difficult','random'];var names={view:'View All',all:'Practice All',new:'New',weak:'Weak',starred:'Starred',difficult:'◆ Difficult',random:'Random'};return '<div class="mf-actions">'+items.map(function(k){return '<button class="mf-action '+(k==='starred'?'starred':k==='difficult'?'difficult':'')+'" data-mf-action="'+k+'">'+names[k]+'</button>'}).join('')+'</div>'}
function countPicker(req,label){var m=el('#modal');if(!m)return;m.className='modal';m.innerHTML='<div class="sheet"><div class="row between"><div><div class="eyebrow">'+safeEsc(label)+'</div><div class="quiz-title">How many questions?</div></div><button class="iconbtn" id="mfCountX">×</button></div><div class="mf-actions" style="margin-top:14px"><button class="mf-action" data-mf-n="10">10</button><button class="mf-action" data-mf-n="20">20</button><button class="mf-action" data-mf-n="25">25</button></div></div>';el('#mfCountX').onclick=closeModal;m.onclick=function(e){if(e.target===m)closeModal()};els('[data-mf-n]',m).forEach(function(b){b.onclick=function(){closeModal();runQuiz(Object.assign({},req,{count:Number(b.dataset.mfN)}))}})}
function runQuiz(req){if(typeof loading==='function')loading(true);server('quiz',req).then(function(s){if(typeof loading==='function')loading(false);if(!s||s.ok===false)return toastSafe(s&&s.message||'No eligible questions');if(typeof openQuiz==='function')openQuiz(s)}).catch(function(e){if(typeof loading==='function')loading(false);toastSafe(e.message)})}
function openReadOnly(req,title){if(typeof loading==='function')loading(true);server('view',req).then(function(items){if(typeof loading==='function')loading(false);items=items||[];var m=el('#modal');if(!m)return;m.className='modal';m.innerHTML='<div class="sheet"><div class="row between"><div><div class="eyebrow">Read-only revision</div><div class="quiz-title">'+safeEsc(title)+'</div></div><button class="iconbtn" id="mfViewX">×</button></div><div class="muted" style="font-size:13px;margin-top:5px">'+items.length+' questions · browsing does not create attempts</div><div class="list" style="margin-top:13px">'+items.map(function(x,i){return '<div class="mf-card mf-click" data-mf-view="'+i+'"><div class="mf-row-title">'+safeEsc(x.chapter||'Maths')+'</div><div class="mf-row-sub">'+safeEsc(String(x.prompt||'').slice(0,155))+'</div></div>'}).join('')+'</div></div>';el('#mfViewX').onclick=closeModal;m.onclick=function(e){if(e.target===m)closeModal()}}).catch(function(e){if(typeof loading==='function')loading(false);toastSafe(e.message)})}
function bindActions(root,req,mode){els('[data-mf-action]',root).forEach(function(b){b.onclick=function(e){e.stopPropagation();var k=b.dataset.mfAction,r=Object.assign({},req,{kind:k});if(k==='view')return openReadOnly(req,req.title||'Revision');if(k==='all')return runQuiz(r);countPicker(r,(req.title||req.chapter||'Practice')+' · '+b.textContent.trim())}})}
function backButton(id,text){return '<button class="btn ghost mf-back" id="'+id+'">← '+safeEsc(text)+'</button>'}
function headerBlock(kicker,title,sub){return '<div class="mf-kicker">'+safeEsc(kicker)+'</div><div class="mf-title">'+safeEsc(title)+'</div>'+(sub?'<div class="mf-sub">'+safeEsc(sub)+'</div>':'')}

/* HOME */
function homeFallback(){var d=app.bootstrap&&app.bootstrap.dashboard||{},r=app.bootstrap&&app.bootstrap.resume||null,target=20,done=0;if(r&&Number(r.total||0)===target&&String(r.title||'').indexOf('Day '+Number(d.day||0))===0)done=Math.max(0,Math.min(target,Number(r.currentIndex||0)));return {schedule:{day:Number(d.day||1),chapter:String(d.todayChapter||'')},daily:{target:target,done:done,left:target-done},resume:r,resumeIsDaily:!!(r&&Number(r.total||0)===target&&String(r.title||'').indexOf('Day '+Number(d.day||0))===0),newCount:Number(d.freshRemaining||0),starred:0,difficult:0,concepts:0,pending:(d.pending||[]).slice(0,2)} }
function renderHome(d){if(!window.app||app.view!=='home')return;clearStrip();d=d||homeFallback();var s=d.schedule||{},daily=d.daily||{},day=Math.max(1,Number(s.day||1)),chapter=String(s.chapter||'Daily Practice'),target=Math.max(1,Number(daily.target||20)),done=Math.max(0,Math.min(target,Number(daily.done||0))),left=Math.max(0,target-done),pct=Math.round(done*100/target),html='<div class="content mf-home"><div class="mf-hero"><div class="mf-hero-kicker">Today’s Maths</div><h2>Day '+day+' · '+safeEsc(chapter)+'</h2><div class="mf-hero-desc">Finish Day '+day+' first, then use focused practice.</div><div class="mf-goal"><span>Today’s Goal</span><b>'+done+' / '+target+'</b></div><div class="mf-daily-track"><i style="width:'+pct+'%"></i></div><div class="mf-fresh-note">Fresh-first: '+target+' questions · reinforcement 0</div><button class="mf-hero-cta" id="mfDaily">'+(done>0?'Continue Day '+day+' · '+left+' left':'Start Day '+day+' · '+left+' left')+'</button></div>';
if(d.resume&&!d.resumeIsDaily){html+='<div class="mf-resume"><div><div class="mf-resume-title">Resume paused extra practice</div><div class="mf-resume-sub">'+safeEsc(d.resume.title||'Practice')+' · '+(Number(d.resume.currentIndex||0)+1)+'/'+Number(d.resume.total||0)+'</div></div><button class="btn soft mf-resume-btn" id="mfResume">Resume</button></div>'}
if(d.pending&&d.pending.length){var p=d.pending[0];html+='<div class="mf-pending mf-click" id="mfPending"><div class="mf-row"><div><div class="mf-row-title">Pending · Day '+Number(p.day||0)+'</div><div class="mf-row-sub">'+safeEsc(p.chapter||'')+'</div></div><span class="mf-chevron">›</span></div></div>'}
html+='<div class="mf-quick-head">Quick Start</div><div class="mf-quick"><div class="mf-quick-card" id="mfNew"><span class="mf-quick-icon">✨</span><span><span class="mf-quick-title">New Practice</span><span class="mf-quick-sub">'+Number(d.newCount||0)+' unseen · recently added by chapter</span></span><span class="mf-chevron">›</span></div><div class="mf-quick-card" id="mfStar"><span class="mf-quick-icon">⭐</span><span><span class="mf-quick-title">Starred Revision</span><span class="mf-quick-sub">'+Number(d.starred||0)+' starred · day-wise focus and revision blocks</span></span><span class="mf-chevron">›</span></div><div class="mf-quick-card" id="mfConcept"><span class="mf-quick-icon">🧠</span><span><span class="mf-quick-title">Concepts</span><span class="mf-quick-sub">'+Number(d.concepts||0)+' saved questions · concept review</span></span><span class="mf-chevron">›</span></div></div></div>';setMain(html);el('#mfDaily').onclick=function(){if(typeof beginQuiz==='function')beginQuiz('daily',{planDay:day})};if(el('#mfResume'))el('#mfResume').onclick=function(){if(typeof resumeQuiz==='function')resumeQuiz(d.resume.sessionId)};if(el('#mfPending'))el('#mfPending').onclick=function(){if(typeof beginQuiz==='function')beginQuiz('daily',{planDay:Number(d.pending[0].day)})};el('#mfNew').onclick=window.openGlobalNewV3;el('#mfStar').onclick=window.openStarredRevisionV3;el('#mfConcept').onclick=window.openConceptsV4}
window.home=function(){setView('home','home');clearStrip();var c=cacheRead('home');renderHome(c&&c.stale?c.data:homeFallback());server('home').then(function(d){cacheWrite('home',d);if(app.view==='home')renderHome(d)}).catch(function(){})};

/* CHAPTERS + GROUPS — direct rendering removes the old first-open flash. */
function chapterGroups(){var list=app.bootstrap&&app.bootstrap.chapters||[],g={advanced:[],arithmetic:[],misc:[]};list.forEach(function(c){g[groupFor(c.chapter)].push(c)});return g}
window.chapters=function(){setView('chapters','chapters');var g=chapterGroups(),mock=(app.bootstrap&&app.bootstrap.demandSets||[]).find(function(s){return String(s.setId)==='MOCK_QUESTIONS'}),html='<div class="content mf-page">'+headerBlock('Practice','Practice Hub','Choose a focused Maths bank.')+'<div class="mf-groups" style="margin-top:17px"><div class="mf-group" data-mf-group="advanced"><div class="mf-kicker">Advanced</div><div><b>'+g.advanced.length+' '+(g.advanced.length===1?'chapter':'chapters')+'</b></div></div><div class="mf-group" data-mf-group="arithmetic"><div class="mf-kicker">Arithmetic</div><div><b>'+g.arithmetic.length+' '+(g.arithmetic.length===1?'chapter':'chapters')+'</b></div></div><div class="mf-group" data-mf-group="misc"><div class="mf-kicker">MISC</div><div><b>'+g.misc.length+' banks</b><small>Recall material</small></div></div><div class="mf-group" data-mf-group="mocks"><div class="mf-kicker">Mocks</div><div><b>'+Number(mock&&mock.count||0)+' questions</b><small>Saved Mock Questions</small></div></div></div></div>';setMain(html);var seed=snapshotSeedFor({scope:'all'});loadScope({scope:'all',title:'Practice Hub'},seed);els('[data-mf-group]').forEach(function(x){x.onclick=function(){window.openStudyGroup(x.dataset.mfGroup)}});refreshSnapshot(function(s){if(app.view==='chapters'&&!el('[data-mf-scope-page]'))showStrip(s.overall)})};
window.openStudyGroup=function(key){var g=chapterGroups(),list=key==='advanced'?g.advanced:key==='arithmetic'?g.arithmetic:key==='misc'?g.misc:[],title=key==='advanced'?'Advanced':key==='arithmetic'?'Arithmetic':key==='misc'?'MISC':'Mock Questions',req;if(key==='mocks'){req={scope:'demand_set',setId:'MOCK_QUESTIONS',title:'Mock Questions'};var mock=(app.bootstrap&&app.bootstrap.demandSets||[]).find(function(s){return String(s.setId)==='MOCK_QUESTIONS'});setView('chapters','chapters');setMain('<div class="content mf-page" data-mf-scope-page="1">'+backButton('mfGroupBack','Practice Hub')+headerBlock('Mocks','Mock Questions',Number(mock&&mock.count||0)+' saved questions')+'<div class="mf-actions-shell">'+actionsHtml('standard')+'</div></div>');el('#mfGroupBack').onclick=window.chapters;bindActions(el('#main'),req,'standard');loadScope(req,null);window.scrollTo(0,0);return}req={scope:'group',chapters:list.map(function(c){return c.chapter}),groupName:key,title:title};var total=list.reduce(function(a,c){return a+Number(c.total||0)},0);setView('chapters','chapters');var html='<div class="content mf-page" data-mf-scope-page="1">'+backButton('mfGroupBack','Practice Hub')+headerBlock(title,total+' cards','')+'<div class="mf-actions-shell">'+actionsHtml('standard')+'</div><div class="mf-section">Chapters</div><div class="mf-list">'+list.map(function(c){return '<div class="mf-card mf-click" data-mf-chapter="'+safeEsc(c.chapter)+'"><div class="mf-row"><div><div class="mf-row-title">'+safeEsc(c.chapter)+'</div><div class="mf-row-sub">'+Number(c.total||0)+' cards</div></div><span class="mf-chip">Open</span></div></div>'}).join('')+'</div></div>';setMain(html);el('#mfGroupBack').onclick=window.chapters;bindActions(el('#main'),req,'standard');els('[data-mf-chapter]').forEach(function(x){x.onclick=function(){window.openChapterHub(x.dataset.mfChapter)}});loadScope(req,snapshotSeedFor(req));window.scrollTo(0,0)};
window.openChapterHub=function(chapter){var c=chapterByName(chapter);if(!c)return toastSafe('Chapter not found');setView('chapters','chapters');var attempted=Math.max(0,Number(c.total||0)-Number(c.remaining||0)),pct=Number(c.total||0)?Math.round(attempted*100/Number(c.total)):0,topics=c.majorTopics||[];if(String(chapter).trim().toLowerCase()==='coordinate geometry'){var mp={};topics.forEach(function(t){mp[String(t.name||'').trim().toLowerCase()]=t});topics=['Questions','Concepts'].map(function(n){return mp[n.toLowerCase()]||{name:n,key:n,total:0,active:0}})}var req={scope:'chapter',chapter:chapter,title:chapter},html='<div class="content mf-page" data-mf-scope-page="1">'+backButton('mfChapterBack','Chapters')+headerBlock('Chapter',chapter,Number(c.total||0)+' cards · '+attempted+' attempted')+'<div class="mf-progress-track"><i style="width:'+pct+'%"></i></div><div class="mf-actions-shell">'+actionsHtml('standard')+'</div>'+(topics.length?'<div class="mf-section">Study banks</div><div class="mf-list">'+topics.map(function(t){return '<div class="mf-card mf-click" data-mf-topic="'+safeEsc(t.key||t.name)+'"><div class="mf-row"><div><div class="mf-row-title">'+safeEsc(t.name)+'</div><div class="mf-row-sub">'+Number(t.total||0)+' cards</div></div><span class="mf-chevron">›</span></div></div>'}).join('')+'</div>':'')+'</div>';setMain(html);el('#mfChapterBack').onclick=window.chapters;bindActions(el('#main'),req,'standard');els('[data-mf-topic]').forEach(function(x){x.onclick=function(){window.openTopicHub(chapter,x.dataset.mfTopic)}});loadScope(req,snapshotSeedFor(req));window.scrollTo(0,0)};
window.openTopicHub=function(chapter,key){var c=chapterByName(chapter),t=c&&(c.majorTopics||[]).find(function(x){return String(x.key||x.name)===String(key)||String(x.name||'').toLowerCase()===String(key||'').toLowerCase()});if(!t)t={name:key,key:key,total:0};setView('chapters','chapters');var req={scope:'topic',chapter:chapter,majorTopic:t.key||t.name,title:chapter+' · '+t.name},html='<div class="content mf-page" data-mf-scope-page="1">'+backButton('mfTopicBack',chapter)+headerBlock(chapter,t.name,Number(t.total||0)+' cards')+'<div class="mf-actions-shell">'+actionsHtml('standard')+'</div></div>';setMain(html);el('#mfTopicBack').onclick=function(){window.openChapterHub(chapter)};bindActions(el('#main'),req,'standard');loadScope(req,null);window.scrollTo(0,0)};

/* NEW PRACTICE */
function renderNew(data){if(app.view!=='new')return;data=data||{overall:{},chapters:[]};var html='<div class="content mf-page" data-mf-scope-page="1">'+backButton('mfNewBack','Home')+headerBlock('Fresh material','New Practice',Number(data.overall&&data.overall.unseen||0)+' unseen across Maths')+'<div class="mf-actions-shell">'+actionsHtml('standard')+'</div><div class="mf-section">By Chapter</div><div class="mf-list">'+(data.chapters||[]).map(function(c){var m=c.metric||{};return '<div class="mf-card mf-click" data-mf-newchapter="'+safeEsc(c.chapter)+'"><div class="mf-row"><div><div class="mf-row-title">'+safeEsc(c.chapter)+'</div><div class="mf-row-sub">'+Number(m.unseen||0)+' unseen · <span class="mf-red">'+Number(m.wrong||0)+' wrong</span> · <span class="mf-purple">◆ '+Number(m.difficult||0)+'</span> · <span class="mf-amber">☆ '+Number(m.starred||0)+'</span></div></div><span class="mf-chip">'+Number(m.total||0)+' Q</span></div></div>'}).join('')+'</div></div>';setMain(html);showStrip(data.overall||null);el('#mfNewBack').onclick=window.home;bindActions(el('#main'),{scope:'all',title:'All New Practice'},'standard');els('[data-mf-newchapter]').forEach(function(x){x.onclick=function(){openNewChapterFinal(x.dataset.mfNewchapter,data)}})}
function openNewChapterFinal(chapter,data){var row=(data.chapters||[]).find(function(x){return String(x.chapter)===String(chapter)})||{metric:{}};var req={scope:'chapter',chapter:chapter,title:chapter+' · New Practice'};setMain('<div class="content mf-page" data-mf-scope-page="1">'+backButton('mfNewChapterBack','New Practice')+headerBlock('New Practice',chapter,Number(row.metric&&row.metric.unseen||0)+' unseen')+'<div class="mf-actions-shell">'+actionsHtml('standard')+'</div></div>');showStrip(row.metric||null);el('#mfNewChapterBack').onclick=window.openGlobalNewV3;bindActions(el('#main'),req,'standard');loadScope(req,row.metric||null);window.scrollTo(0,0)}
window.openGlobalNewV3=function(){setView('new','home');var c=cacheRead('new');if(c&&c.stale)renderNew(c.data);else{var s=cacheRead('snapshot');if(s&&s.stale)renderNew({overall:s.data.overall,chapters:(s.data.chapters||[]).filter(function(x){return Number(x.metric&&x.metric.unseen||0)>0})})}server('new').then(function(d){cacheWrite('new',d);if(app.view==='new')renderNew(d)}).catch(function(e){if(!c)toastSafe(e.message)})};

/* STARRED REVISION */
function starStats(s){s=s||{};return Number(s.starred||0)+' Starred · '+Number(s.mastered||0)+' Mastered · '+Number(s.focus||0)+' Focus'}
function revisionActions(req,title,root){bindActions(root,req,'revision')}
function historyRow(title,s,lo,hi){return '<div class="mf-history-row"><div class="mf-history-head" data-mf-range="'+lo+'-'+hi+'"><div><b>'+safeEsc(title)+'</b><small>'+starStats(s)+'</small></div><span class="mf-chevron">›</span></div><div class="mf-history-body mf-hidden" data-mf-body="'+lo+'-'+hi+'"><div class="mf-actions-shell" style="margin:0">'+actionsHtml('revision')+'</div></div></div>'}
function renderStarred(data,metric){if(app.view!=='starred')return;data=data||{stats:{},recentDays:[],tenBlocks:[],months:[]};var html='<div class="content mf-page" data-mf-scope-page="1">'+backButton('mfStarBack','Home')+headerBlock('Revision','⭐ Starred Revision','Focused revision of questions you saved across every quiz.')+'<div class="mf-card mf-star-hero"><div class="mf-row-title">All Starred Revision</div><div class="mf-star-stats">'+starStats(data.stats)+'</div><div class="mf-actions-shell" style="margin:0">'+actionsHtml('revision')+'</div></div><div class="mf-section">Study history</div><div class="mf-history">';(data.recentDays||[]).forEach(function(x){html+=historyRow('Day '+x.day,x.stats,x.day,x.day)});(data.tenBlocks||[]).forEach(function(x){html+=historyRow('Days '+x.lo+'–'+x.hi,x.stats,x.lo,x.hi)});(data.months||[]).forEach(function(x){html+=historyRow((x.label||'Month')+' · Days '+x.lo+'–'+x.hi,x.stats,x.lo,x.hi)});html+='</div></div>';setMain(html);showStrip(metric||null);el('#mfStarBack').onclick=window.home;revisionActions({scope:'star_history',starLo:1,starHi:999999,title:'All Starred Revision'},'All Starred Revision',el('#main'));els('[data-mf-range]').forEach(function(head){head.onclick=function(){var p=head.dataset.mfRange.split('-'),lo=Number(p[0]),hi=Number(p[1]),body=el('[data-mf-body="'+lo+'-'+hi+'"]');body.classList.toggle('mf-hidden');head.querySelector('.mf-chevron').textContent=body.classList.contains('mf-hidden')?'›':'⌄';if(!body.classList.contains('mf-hidden'))revisionActions({scope:'star_history',starLo:lo,starHi:hi,title:lo===hi?'Day '+lo:'Days '+lo+'–'+hi},'',body)}})}
window.openStarredRevisionV3=function(){setView('starred','home');var c=cacheRead('starred'),mc=cacheRead('metric:starred-all');if(c&&c.stale)renderStarred(c.data,mc&&mc.stale?mc.data:null);Promise.all([server('starred'),server('metric',{scope:'star_history',starLo:1,starHi:999999})]).then(function(x){cacheWrite('starred',x[0]);cacheWrite('metric:starred-all',x[1]);if(app.view==='starred')renderStarred(x[0],x[1])}).catch(function(e){if(!c)toastSafe(e.message)})};

/* CONCEPTS */
function renderConcepts(data){if(app.view!=='concepts')return;data=data||{metric:{},chapters:[]};var html='<div class="content mf-page" data-mf-scope-page="1">'+backButton('mfConceptBack','Home')+headerBlock('Saved','🧠 Concepts','Questions you deliberately saved for concept revision.')+'<div class="mf-actions-shell">'+actionsHtml('concepts')+'</div>'+(data.chapters&&data.chapters.length?'<div class="mf-section">By Chapter</div><div class="mf-list">'+data.chapters.map(function(c){return '<div class="mf-card mf-click" data-mf-conceptchapter="'+safeEsc(c.chapter)+'"><div class="mf-row"><div class="mf-row-title">'+safeEsc(c.chapter)+'</div><span class="mf-chip">'+Number(c.metric&&c.metric.total||0)+' Q</span></div></div>'}).join('')+'</div>':'')+'</div>';setMain(html);showStrip(data.metric||null);el('#mfConceptBack').onclick=window.home;bindActions(el('#main'),{scope:'concept_saved',title:'Concepts'},'concepts');els('[data-mf-conceptchapter]').forEach(function(x){x.onclick=function(){var ch=x.dataset.mfConceptchapter,row=(data.chapters||[]).find(function(c){return String(c.chapter)===String(ch)})||{metric:{}};setMain('<div class="content mf-page" data-mf-scope-page="1">'+backButton('mfConceptChapterBack','Concepts')+headerBlock('Concepts',ch,Number(row.metric&&row.metric.total||0)+' saved questions')+'<div class="mf-actions-shell">'+actionsHtml('concepts')+'</div></div>');showStrip(row.metric||null);el('#mfConceptChapterBack').onclick=window.openConceptsV4;bindActions(el('#main'),{scope:'concept_saved',chapter:ch,title:ch+' · Concepts'},'concepts')}})}
window.openConceptsV4=function(){setView('concepts','home');var c=cacheRead('concepts');if(c&&c.stale)renderConcepts(c.data);server('concepts').then(function(d){cacheWrite('concepts',d);if(app.view==='concepts')renderConcepts(d)}).catch(function(e){if(!c)toastSafe(e.message)})};

/* PROGRESS */
function renderProgress(d){if(app.view!=='progress')return;d=d||{overall:{},chapters:[]};var o=d.overall||{},html='<div class="content mf-page" data-mf-scope-page="1">'+headerBlock('Overview','Progress','')+'<div class="mf-overview"><div><b>'+Number(o.total||0)+'</b><span>Total Q</span></div><div><b>'+Number(o.attempted||0)+'</b><span>Encountered</span></div><div class="wrong"><b>✕ '+Number(o.wrong||0)+'</b><span>Wrong</span><small>'+Number(o.wrongPct||0)+'%</small></div><div class="difficult"><b>◆ '+Number(o.difficult||0)+'</b><span>Difficult</span><small>'+Number(o.difficultPct||0)+'%</small></div><div class="starred"><b>☆ '+Number(o.starred||0)+'</b><span>Starred</span><small>'+Number(o.starredPct||0)+'%</small></div></div><div class="mf-progress-track"><i style="width:'+Number(o.coverage||0)+'%"></i></div><div class="mf-progress-summary"><b>'+Number(o.attempted||0)+' / '+Number(o.total||0)+'</b> encountered · '+Number(o.unseen||0)+' left</div><div class="mf-section">By Chapter</div><div class="mf-list">';(d.chapters||[]).forEach(function(c){var m=c.metric||{};html+='<div class="mf-card mf-chapter-progress"><div class="mf-row"><div class="mf-row-title">'+safeEsc(c.chapter)+'</div><span class="mf-chip">'+Number(m.total||0)+' Q</span></div><div class="mf-progress-track"><i style="width:'+Number(m.coverage||0)+'%"></i></div><div class="mf-diagnostics"><span class="mf-red">✕ Wrong <b>'+Number(m.wrong||0)+'</b></span> · <span class="mf-purple">◆ Difficult <b>'+Number(m.difficult||0)+'</b></span> · <span class="mf-amber">☆ Starred <b>'+Number(m.starred||0)+'</b></span> · Left <b>'+Number(m.unseen||0)+'</b></div></div>'});html+='</div></div>';setMain(html);showStrip(o)}
window.progress=function(){setView('progress','progress');var c=cacheRead('snapshot');if(c&&c.stale)renderProgress(c.data);server('snapshot').then(function(d){cacheWrite('snapshot',d);if(app.view==='progress')renderProgress(d)}).catch(function(e){if(!c)toastSafe(e.message)})};

/* Legacy Library/On Demand remain functionally mature; attach the persistent shell strip
   and never let their internal async work remove it. */
window.library=function(){setView('library','library');clearStrip();if(typeof legacy.library==='function')legacy.library();var seed=snapshotSeedFor({scope:'all'});loadScope({scope:'all',title:'Library'},seed)};
window.ondemand=function(){setView('ondemand','ondemand');clearStrip();if(typeof legacy.ondemand==='function')legacy.ondemand();var seed=snapshotSeedFor({scope:'all'});loadScope({scope:'all',title:'On Demand'},seed)};
window.startDemandSet=function(setId){if(typeof legacy.startDemandSet==='function')legacy.startDemandSet(setId);var req={scope:'demand_set',setId:String(setId),title:'Saved Set'};loadScope(req,null)};
window.openCalculationHub=function(setId){if(typeof legacy.openCalculationHub==='function')legacy.openCalculationHub(setId);loadScope({scope:'demand_set',setId:String(setId),title:'Calculation Training'},null)};

/* Bottom navigation always resolves to the authoritative functions above. */
window.showView=function(v){if(v==='home')return window.home();if(v==='chapters')return window.chapters();if(v==='library')return window.library();if(v==='ondemand')return window.ondemand();if(v==='progress')return window.progress()};

/* Cached-first first paint.  Background revalidation starts immediately; the 5-minute
   TTL means cached data is considered fresh for five minutes, not that refresh waits. */
setTimeout(function(){if(window.app&&(!app.view||app.view==='home'))window.home()},0);
})();
</script>
