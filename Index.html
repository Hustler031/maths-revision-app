<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7fb">
  <title>Maths Revision</title>
  <style>
:root{--bg:#f6f7fb;--card:#fff;--text:#172033;--muted:#6d7688;--line:#e5e8ef;--primary:#3454d1;--primary2:#edf0ff;--green:#15803d;--red:#c62828;--amber:#a16207;--shadow:0 6px 22px rgba(26,36,64,.07)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%}.app{width:100%;max-width:820px;margin:0 auto;min-height:100vh;padding-bottom:92px}.topbar{position:sticky;top:0;z-index:20;background:rgba(246,247,251,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:13px 16px}.brand{font-size:20px;font-weight:900}.muted{color:var(--muted)}.content{padding:14px}.grid{display:grid;gap:12px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card,.list-card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:15px}.list{display:grid;gap:9px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.section-title{font-size:13px;font-weight:900;letter-spacing:.08em;color:var(--muted);margin:8px 2px;text-transform:uppercase}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.08em;color:var(--primary);text-transform:uppercase}.btn{border:0;border-radius:12px;padding:11px 13px;font-weight:800;font-size:14px;cursor:pointer}.btn.primary{background:var(--primary);color:white}.btn.soft{background:var(--primary2);color:var(--primary)}.btn.ghost{background:#f3f4f8;color:var(--text)}.btn.small{padding:8px 10px;font-size:12px}.tag{font-size:11px;font-weight:800;background:#f1f3f8;border-radius:999px;padding:6px 8px;color:var(--muted)}.action-card{display:flex;gap:12px;align-items:center;cursor:pointer}.action-icon{font-size:24px}.action-title{font-weight:900}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(820px,100%);z-index:30;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 6px calc(7px + env(safe-area-inset-bottom))}.nav button{border:0;background:none;padding:7px 2px;color:var(--muted);font-size:11px;font-weight:800}.nav button.active{color:var(--primary)}.nav .ico{display:block;font-size:20px;margin-bottom:2px}.hidden{display:none!important}.hero{background:linear-gradient(135deg,#2f4fd0,#6378e8);color:#fff;border:0}.hero .muted{color:#e7eaff}.hero-title{font-size:24px;font-weight:950;margin:4px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:rgba(255,255,255,.13);border-radius:12px;padding:10px}.stat b{display:block;font-size:18px}.progress{height:8px;background:#e8eaf1;border-radius:999px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--primary);border-radius:999px}.hub-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:13px}.hub-stat{background:#f6f7fb;border-radius:12px;padding:10px;text-align:center}.hub-stat b{display:block;font-size:18px}.hub-stat span{font-size:11px}.practice-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.topic-row{cursor:pointer}.quiz{padding:14px 14px 110px}.quiz-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.quiz-title{font-weight:900;font-size:18px}.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow)}.qtext{font-size:22px;line-height:1.42;font-weight:850;white-space:pre-wrap;overflow-wrap:anywhere}.qtext.q-medium{font-size:20px}.qtext.q-long{font-size:18px}.qtext.q-xlong{font-size:16px}.options{display:grid;gap:9px;margin-top:16px}.option{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px;font-size:16px;line-height:1.35;color:var(--text)}.option.correct{border-color:#86c89a;background:#eef9f1}.option.wrong{border-color:#ef9b9b;background:#fff0f0}.explain{margin-top:15px;border-top:1px solid var(--line);padding-top:14px}.explain h4{margin:0 0 6px}.memory{margin-top:9px;background:#fff8dd;border-radius:12px;padding:10px}.diagram{margin:14px auto 4px;max-width:420px;width:100%;overflow:hidden}.diagram svg{width:100%;height:auto;display:block}.quiz-dock{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(820px,100%);z-index:40;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;gap:8px}.quiz-dock .btn{flex:1}.modal{position:fixed;inset:0;background:rgba(20,25,40,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}.sheet{background:#fff;width:min(820px,100%);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}.iconbtn{border:0;background:#f1f3f8;border-radius:10px;width:38px;height:38px;font-size:20px}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 14px;border-radius:10px;z-index:80;font-size:13px;max-width:90%;text-align:center}
@media(max-width:390px){.content{padding:12px}.qtext{font-size:21px}.qtext.q-medium{font-size:19px}.qtext.q-long{font-size:17px}.qtext.q-xlong{font-size:15px}.practice-actions{grid-template-columns:1fr}.stats{gap:6px}.card,.list-card{padding:13px}}
  </style>
</head>
<body>
<div class="app" id="app">
  <div class="topbar"><div class="row between"><div><div class="brand">Maths Revision</div><div class="muted" style="font-size:12px" id="subtitle">Loading…</div></div><button class="iconbtn" onclick="refreshApp()">↻</button></div></div>
  <main id="main"><div class="content"><div class="card">Loading Maths Revision…</div></div></main>
</div>
<nav class="nav" id="nav">
  <button data-view="home" onclick="showView('home')"><span class="ico">⌂</span>Home</button>
  <button data-view="chapters" onclick="showView('chapters')"><span class="ico">▦</span>Chapters</button>
  <button data-view="library" onclick="showView('library')"><span class="ico">★</span>Library</button>
  <button data-view="ondemand" onclick="showView('ondemand')"><span class="ico">⚡</span>On Demand</button>
  <button data-view="more" onclick="showView('more')"><span class="ico">•••</span>More</button>
</nav>
<div id="modal" class="hidden"></div><div id="toast" class="toast hidden"></div>
<script>
const app={bootstrap:null,view:'home',session:null,startedAt:0,revealed:false,selected:null};
const $=s=>document.querySelector(s);
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(t){const x=$('#toast');x.textContent=t;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),1800)}
function nav(v){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v))}
function refreshApp(){google.script.run.withSuccessHandler(b=>{app.bootstrap=b;$('#subtitle').textContent=`Day ${b.dashboard.day} · ${b.dashboard.todayChapter}`;showView(app.view==='quiz'?'home':app.view)}).withFailureHandler(e=>toast(e.message||e)).getAppBootstrap()}
function showView(v){app.view=v;nav(v);$('#nav').classList.remove('hidden');if(v==='home')home();if(v==='chapters')chapters();if(v==='library')library();if(v==='ondemand')ondemand();if(v==='more')more()}
function home(){
 const d=app.bootstrap.dashboard,p=d.pending||[],pending=p.length?`<div class="section-title">Pending Days</div><div class="list">${p.map(x=>`<div class="list-card"><div class="row between"><div><b>Day ${x.day} · ${esc(x.chapter)}</b><div class="muted" style="font-size:12px">${esc(x.status)} · ${x.remaining} active of ${x.total}</div></div><button class="btn ghost small" data-day="${x.day}" onclick="startDaily(Number(this.dataset.day))">Start</button></div></div>`).join('')}</div>`:'';
 $('#main').innerHTML=`<div class="content grid"><div class="card hero"><div class="eyebrow" style="color:#dce2ff">Today's revision · Day ${d.day}</div><div class="hero-title">${esc(d.todayChapter)}</div><div class="muted">Schedule advances by calendar day. Missed days stay pending.</div><div class="stats"><div class="stat"><b>${d.chapterRemaining}</b><span>Active</span></div><div class="stat"><b>${d.freshRemaining}</b><span>Fresh</span></div><div class="stat"><b>${d.chapterMastered}</b><span>Mastered</span></div></div><button class="btn" style="width:100%;margin-top:14px;background:#fff;color:#2944b8" onclick="startDaily(${d.day})">Start Day ${d.day}</button></div>${pending}<div class="grid2"><div class="card action-card" onclick="beginQuiz('practice_more',{chapter:'${esc(d.todayChapter)}',count:20})"><div class="action-icon">＋</div><div><div class="action-title">Practice More</div><div class="muted" style="font-size:12px">Today's chapter</div></div></div><div class="card action-card" onclick="showView('library')"><div class="action-icon">★</div><div><div class="action-title">Marked</div><div class="muted" style="font-size:12px">${d.marked} saved</div></div></div></div></div>`;
}
function startDaily(day){beginQuiz('daily',{planDay:Number(day)})}
function chapters(){
 const cs=app.bootstrap.chapters||[];
 $('#main').innerHTML=`<div class="content"><div class="section-title">Chapters</div><div class="list">${cs.map(c=>`<div class="list-card topic-row" data-chapter="${esc(c.chapter)}" onclick="openChapterHub(this.dataset.chapter)"><div class="row between"><div><b>${esc(c.chapter)}</b><div class="muted">${c.total} total · ${c.mastered} mastered · ${c.remaining} active</div></div><span class="tag">Open</span></div></div>`).join('')}</div></div>`;
}
function findChapterInfo(chapter){return (app.bootstrap.chapters||[]).find(c=>String(c.chapter)===String(chapter))}
function openChapterHub(chapter){
  const c=findChapterInfo(chapter);if(!c){toast('Chapter not found');return}app.view='chapters';nav('chapters');
  const topics=c.majorTopics||[];
  $('#main').innerHTML=`<div class="content"><button class="btn ghost" onclick="chapters()">← Chapters</button><div class="section-title">${esc(chapter).toUpperCase()}</div><div class="card"><div class="hub-stats"><div class="hub-stat"><b>${c.total}</b><span class="muted">Total</span></div><div class="hub-stat"><b>${c.mastered}</b><span class="muted">Mastered</span></div><div class="hub-stat"><b>${c.remaining}</b><span class="muted">Active</span></div></div><div class="practice-actions"><button class="btn soft" data-chapter="${esc(chapter)}" onclick="beginQuiz('chapter_random',{chapter:this.dataset.chapter,count:20})">🔀 Random Practice</button><button class="btn ghost" data-chapter="${esc(chapter)}" onclick="beginQuiz('chapter_weak',{chapter:this.dataset.chapter,count:20})">🎯 Weak Practice</button><button class="btn ghost" data-chapter="${esc(chapter)}" onclick="beginQuiz('chapter_complete',{chapter:this.dataset.chapter})">📚 Complete Bank</button></div></div><div class="section-title">Topics</div><div class="list">${topics.map(t=>`<div class="list-card topic-row" data-chapter="${esc(chapter)}" data-topic-key="${esc(t.key||'')}" onclick="openTopicHub(this.dataset.chapter,this.dataset.topicKey)"><div class="row between"><div><b>${esc(t.name)}</b><div class="muted">${t.total} cards · ${t.mastered} mastered · ${t.active} active</div></div><span class="tag">Open</span></div></div>`).join('')||'<div class="card muted">No topic cards available.</div>'}</div></div>`;window.scrollTo(0,0)
}
function openTopicHub(chapter,majorTopicKey){
  const c=findChapterInfo(chapter);if(!c){toast('Chapter not found');return}
  const t=(c.majorTopics||[]).find(x=>String(x.key||'')===String(majorTopicKey||''));if(!t){toast('Topic not found');return}
  app.view='chapters';nav('chapters');
  $('#main').innerHTML=`<div class="content"><button class="btn ghost" data-chapter="${esc(chapter)}" onclick="openChapterHub(this.dataset.chapter)">← ${esc(chapter)}</button><div class="section-title">${esc(chapter).toUpperCase()} → ${esc(t.name).toUpperCase()}</div><div class="card"><div class="hub-stats"><div class="hub-stat"><b>${t.total}</b><span class="muted">Total</span></div><div class="hub-stat"><b>${t.mastered}</b><span class="muted">Mastered</span></div><div class="hub-stat"><b>${t.active}</b><span class="muted">Active</span></div></div><div class="practice-actions"><button class="btn soft" data-chapter="${esc(chapter)}" data-topic-key="${esc(t.key)}" onclick="beginQuiz('topic_random',{chapter:this.dataset.chapter,majorTopicKey:this.dataset.topicKey,count:20})">🔀 Random ${esc(t.name)}</button><button class="btn ghost" data-chapter="${esc(chapter)}" data-topic-key="${esc(t.key)}" onclick="beginQuiz('topic_weak',{chapter:this.dataset.chapter,majorTopicKey:this.dataset.topicKey,count:20})">🎯 Weak ${esc(t.name)}</button><button class="btn ghost" data-chapter="${esc(chapter)}" data-topic-key="${esc(t.key)}" onclick="beginQuiz('topic_complete',{chapter:this.dataset.chapter,majorTopicKey:this.dataset.topicKey})">📚 Complete ${esc(t.name)} Bank</button></div></div></div>`;window.scrollTo(0,0)
}
function library(){
  const l=app.bootstrap.library;
  const items=[['Formula','Σ',l.formulas],['Methods','⚡',l.methods],['Fractions','⅞',l.fractions],['Triplets','△',l.triplets],['Marked','★',l.marked],['Notes','📝',l.notes],['Recent','＋',l.recent]];
  $('#main').innerHTML=`<div class="content"><div class="section-title">Library</div><div class="grid2">${items.map(x=>`<div class="card action-card" data-cluster="${x[0]}" onclick="beginQuiz('library',{cluster:this.dataset.cluster})"><div class="action-icon">${x[1]}</div><div><div class="action-title">${x[0]}</div><div class="muted" style="font-size:12px">${x[2]} cards</div></div></div>`).join('')}</div></div>`;
}
function ondemand(){
  const ch=(app.bootstrap.chapters||[]).map(x=>x.chapter),sets=(app.bootstrap.demandSets||[]).filter(s=>String(s.setId)==='CALC_TRAINING');
  $('#main').innerHTML=`<div class="content grid">
    <div class="section-title">On Demand</div>
    <div class="card">
      <div class="eyebrow">Quick Practice</div>
      <div class="muted" style="font-size:14px;margin:6px 0 12px">Fresh random practice. Nothing here is preserved as a named set.</div>
      <div class="grid2">
        <button class="btn ghost" onclick="beginQuiz('generated',{chapter:'Calculation Memory',topic:'Squares',count:20,title:'Squares · Quick Practice'})">□ Squares</button>
        <button class="btn ghost" onclick="beginQuiz('generated',{chapter:'Calculation Memory',topic:'Cubes',count:20,title:'Cubes · Quick Practice'})">▣ Cubes</button>
        <button class="btn ghost" onclick="beginQuiz('generated',{chapter:'Calculation Memory',count:20,title:'Squares + Cubes · Mixed'})">⚡ Mixed Memory</button>
        <button class="btn ghost" onclick="$('#chapterBox').classList.toggle('hidden')">📚 Chapter Practice</button>
      </div>
      <div id="chapterBox" class="hidden" style="margin-top:12px">
        <select id="odChapter" style="width:100%;margin-bottom:9px;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font-size:16px"><option value="">All chapters</option>${ch.map(x=>`<option>${esc(x)}</option>`).join('')}</select>
        <select id="odCount" style="width:100%;margin-bottom:9px;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font-size:16px"><option>10</option><option selected>20</option><option>30</option><option>50</option></select>
        <button class="btn primary" style="width:100%" onclick="runOD()">Start Chapter Practice</button>
      </div>
    </div>
    <div class="card">
      <div class="eyebrow">Calculation Training</div>
      <div class="muted" style="font-size:14px;margin:6px 0 12px">Your dedicated calculation-speed program stays here. Saved mocks are now under Chapters → Mocks.</div>
      ${sets.length?`<div class="list">${sets.map(s=>`<div class="list-card"><div class="row between"><div><b>${esc(s.name)}</b><div class="muted" style="font-size:13px">${(s.dayCount||0)} days · ${s.count} questions</div><div class="muted" style="font-size:12px;margin-top:4px">30-day SSC CGL calculation-speed program</div></div><button class="btn soft small" data-set-id="${esc(s.setId)}" onclick="openCalculationHub(this.dataset.setId)">Open</button></div></div>`).join('')}</div>`:`<div class="muted" style="font-size:14px">Calculation Training is not available yet.</div>`}
    </div>
  </div>`;
}
function runOD(){beginQuiz('ondemand',{chapter:$('#odChapter').value,count:Number($('#odCount').value),activeOnly:true})}
function startDemandSet(setId){beginQuiz('demand_set',{setId:String(setId),activeOnly:false})}
function openCalculationHub(setId){
  const set=(app.bootstrap.demandSets||[]).find(s=>String(s.setId)===String(setId));
  if(!set){toast('Calculation Training set not found.');return}
  app.view='calc_training';nav('ondemand');$('#nav').classList.remove('hidden');
  const days=(set.days||[]).slice().reverse();
  $('#main').innerHTML=`<div class="content grid"><div class="row" style="margin-bottom:2px"><button class="btn ghost" onclick="showView('ondemand')">← Back</button><div><div class="eyebrow">Calculation Training</div><div class="quiz-title">Calculation Training</div></div></div>
    <div class="grid2">
      <div class="card action-card" onclick="startCalcHubMode('mixed')"><div class="action-icon">⚡</div><div><div class="action-title">Mixed Revision</div><div class="muted" style="font-size:12px">Weighted across all days</div></div></div>
      <div class="card action-card" onclick="startCalcHubMode('random')"><div class="action-icon">🔀</div><div><div class="action-title">Random Practice</div><div class="muted" style="font-size:12px">Random questions from all days</div></div></div>
      <div class="card action-card" onclick="startCalcHubMode('weak')"><div class="action-icon">🎯</div><div><div class="action-title">Weak Practice</div><div class="muted" style="font-size:12px">Wrong and slow calculations first</div></div></div>
    </div>
    <div class="section-title">Days</div><div class="list">${days.map(d=>`<div class="list-card"><div class="row between"><div><b>Day ${d.day}</b><div class="muted" style="font-size:12px">${d.count} questions</div></div><button class="btn ghost small" data-day="${d.day}" onclick="startCalcDay(Number(this.dataset.day))">Practice</button></div></div>`).join('')}</div></div>`;window.scrollTo(0,0)
}
function startCalcHubMode(mode){beginQuiz('demand_set',{setId:'CALC_TRAINING',calcMode:mode,count:20})}
function startCalcDay(day){beginQuiz('demand_set',{setId:'CALC_TRAINING',calcMode:'day',day:Number(day),count:100})}
function more(){
 $('#main').innerHTML=`<div class="content grid"><div class="section-title">More</div><div class="card"><b>Maths Revision</b><div class="muted" style="margin-top:5px">Mobile-first SSC revision engine.</div></div><div class="card"><div class="row between"><div><b>Progress</b><div class="muted" style="font-size:12px">Attempts, mastered and marked</div></div><span class="tag">${app.bootstrap.dashboard.attempted} attempted</span></div></div></div>`;
}
function beginQuiz(mode,opts){google.script.run.withSuccessHandler(openQuiz).withFailureHandler(e=>toast(e.message||e)).startQuiz(Object.assign({mode},opts||{}))}
function openQuiz(s){if(!s||s.ok===false){toast((s&&s.message)||'No questions');return}app.session=s;app.view='quiz';app.revealed=false;app.selected=null;app.startedAt=Date.now();$('#nav').classList.add('hidden');renderQuestion()}
function questionSizeClass(text){const t=String(text||'').replace(/<[^>]*>/g,'').trim(),len=t.length,breaks=(t.match(/\n/g)||[]).length;if(len>360||breaks>=5)return'q-xlong';if(len>240||breaks>=3)return'q-long';if(len>135||breaks>=2)return'q-medium';return''}
function renderQuestion(){
 const s=app.session,q=s.questions[s.index];if(!q){finishQuiz();return}app.revealed=false;app.selected=null;app.startedAt=Date.now();
 const mcq=String(q.answerMode||'').toLowerCase()==='mcq'&&Array.isArray(q.options)&&q.options.length;
 $('#main').innerHTML=`<div class="quiz"><div class="quiz-head"><div><div class="eyebrow">${esc(s.title||'Practice')}</div><div class="quiz-title">${s.index+1} / ${s.questions.length}</div></div><button class="iconbtn" onclick="exitQuiz()">×</button></div><div class="qcard"><div class="qtext ${questionSizeClass(q.question)}">${esc(q.question)}</div>${renderDiagram(q)}<div id="answerArea">${mcq?`<div class="options">${q.options.map((o,i)=>`<button class="option" data-index="${i}" onclick="answerMCQ(Number(this.dataset.index))">${esc(o)}</button>`).join('')}</div>`:`<button class="btn primary" style="width:100%;margin-top:16px" onclick="showAnswer()">Show Answer</button>`}</div><div id="explanation"></div></div></div><div class="quiz-dock"><button class="btn ghost" onclick="prevQuestion()">← Previous</button><button class="btn ghost" id="markBtn" onclick="toggleMark()">${q.marked?'★ Marked':'☆ Mark'}</button><button class="btn soft hidden" id="nextBtn" onclick="nextQuestion()">Next →</button></div>`;
}
function answerMCQ(i){if(app.revealed)return;const q=app.session.questions[app.session.index],buttons=[...document.querySelectorAll('.option')],correct=Number(q.correctOption);app.selected=i;app.revealed=true;buttons.forEach((b,idx)=>{if(idx===correct)b.classList.add('correct');else if(idx===i)b.classList.add('wrong');b.disabled=true});revealExplanation(i===correct?'correct':'wrong')}
function showAnswer(){if(app.revealed)return;app.revealed=true;revealExplanation('seen')}
function revealExplanation(result){const q=app.session.questions[app.session.index];$('#explanation').innerHTML=`<div class="explain"><h4>${result==='correct'?'✓ Correct':result==='wrong'?'✕ Review':'Answer'}</h4>${q.answer?`<div><b>${esc(q.answer)}</b></div>`:''}${q.explanation?`<div style="margin-top:7px">${esc(q.explanation)}</div>`:''}${q.memoryCue?`<div class="memory"><b>Memory cue</b><div>${esc(q.memoryCue)}</div></div>`:''}<div class="row" style="margin-top:12px"><button class="btn ghost" onclick="setCurrentMastered(true)">Mastered</button><button class="btn ghost" onclick="openNote()">Note</button></div></div>`;$('#nextBtn').classList.remove('hidden');submitAttempt(result)}
function submitAttempt(result){const q=app.session.questions[app.session.index],sec=(Date.now()-app.startedAt)/1000;google.script.run.submitRecall({questionId:q.questionId,result,responseSec:sec,variantType:q.variantType||'',correctOption:q.correctOption,mode:app.session.mode,sessionId:app.session.sessionId,nextIndex:app.session.index+1,mastered:!!q.mastered})}
function nextQuestion(){if(app.session.index>=app.session.questions.length-1){finishQuiz();return}app.session.index++;renderQuestion();window.scrollTo(0,0)}
function prevQuestion(){if(app.session.index<=0)return;app.session.index--;renderQuestion();window.scrollTo(0,0)}
function setCurrentMastered(v){const q=app.session.questions[app.session.index];google.script.run.withSuccessHandler(r=>{q.mastered=r.mastered;toast(r.mastered?'Marked mastered':'Mastered removed')}).setMastered(q.questionId,v)}
function toggleMark(){const q=app.session.questions[app.session.index];google.script.run.withSuccessHandler(r=>{q.marked=r.marked;$('#markBtn').textContent=r.marked?'★ Marked':'☆ Mark'}).toggleMarked(q.questionId)}
function openNote(){const q=app.session.questions[app.session.index],m=$('#modal');m.className='modal';m.innerHTML=`<div class="sheet"><div class="row between"><div class="quiz-title">Question note</div><button class="iconbtn" onclick="closeModal()">×</button></div><textarea id="noteText" style="width:100%;height:120px;margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit">${esc(q.note||'')}</textarea><button class="btn primary" style="width:100%;margin-top:10px" onclick="saveCurrentNote()">Save note</button></div>`}
function closeModal(){$('#modal').className='hidden';$('#modal').innerHTML=''}
function saveCurrentNote(){const q=app.session.questions[app.session.index],t=$('#noteText').value;google.script.run.withSuccessHandler(()=>{q.note=t;closeModal();toast('Note saved')}).saveNote(q.questionId,t)}
function finishQuiz(){const sid=app.session&&app.session.sessionId;google.script.run.withSuccessHandler(d=>{app.bootstrap.dashboard=d;app.session=null;showView('home')}).finishSession(sid)}
function exitQuiz(){app.session=null;showView('home')}
function renderDiagram(q){
  let raw=q.diagramJson,obj=null;if(!q.diagramType||raw==null||raw===''||raw==='{}')return'';try{obj=typeof raw==='string'?JSON.parse(raw):raw}catch(e){return''}if(!obj||typeof obj!=='object'||obj.show===false||!Object.keys(obj).length)return'';
  const type=String(q.diagramType||'').toLowerCase(),svg=diagramSvg(type,obj);return svg?`<div class="diagram">${svg}</div>`:'';
}
function diagramSvg(type,d){
 const wrap=inner=>`<svg viewBox="0 0 360 230" role="img" aria-label="Mathematical diagram" xmlns="http://www.w3.org/2000/svg"><g stroke="currentColor" fill="none" stroke-width="2">${inner}</g></svg>`,txt=(x,y,t)=>`<text x="${x}" y="${y}" fill="currentColor" stroke="none" font-size="13" font-family="system-ui">${esc(t||'')}</text>`;
 if(/circle|chord|arc|tangent|secant|sector|semicircle|cyclic/.test(type)){let z=`<circle cx="180" cy="115" r="75"/>`;if(/chord|cyclic/.test(type))z+=`<line x1="120" y1="75" x2="240" y2="75"/>`;if(/tangent/.test(type))z+=`<line x1="80" y1="190" x2="280" y2="190"/><line x1="180" y1="115" x2="180" y2="190"/>`;if(/secant/.test(type))z+=`<line x1="70" y1="155" x2="290" y2="70"/>`;if(/sector/.test(type))z+=`<line x1="180" y1="115" x2="245" y2="78"/><line x1="180" y1="115" x2="225" y2="175"/>`;return wrap(z)}
 if(/triangle|median|centroid|incenter|circumcenter|orthocenter|altitude|bisector|similar|congruen|trigon|height/.test(type)){let z=`<polygon points="70,190 290,190 190,35"/>`;if(/altitude|height|orthocenter/.test(type))z+=`<line x1="190" y1="35" x2="190" y2="190"/><path d="M190 176h14v14"/>`;if(/median|centroid/.test(type))z+=`<line x1="190" y1="35" x2="180" y2="190"/><circle cx="184" cy="138" r="4" fill="currentColor"/>`;return wrap(z)}
 if(/square|rectangle|parallelogram|rhombus|trapez|quadrilateral|polygon/.test(type)){let pts=/trapez/.test(type)?'90,55 260,55 305,185 55,185':/parallelogram/.test(type)?'105,55 280,55 245,185 70,185':/rhombus/.test(type)?'180,35 300,115 180,195 60,115':'75,50 285,50 285,190 75,190';let z=`<polygon points="${pts}"/>`;if(/rhombus/.test(type))z+=`<line x1="180" y1="35" x2="180" y2="195"/><line x1="60" y1="115" x2="300" y2="115"/>`;return wrap(z)}
 if(/coordinate/.test(type)){let z=`<line x1="35" y1="115" x2="325" y2="115"/><line x1="180" y1="20" x2="180" y2="210"/><circle cx="245" cy="70" r="4" fill="currentColor"/>${txt(250,66,d.point||'P')}`;return wrap(z)}
 if(/cube|cuboid|prism|pyramid|cylinder|cone|frustum|sphere|hemisphere|solid|3d/.test(type)){if(/sphere/.test(type))return wrap(`<circle cx="180" cy="115" r="75"/><ellipse cx="180" cy="115" rx="75" ry="24" stroke-dasharray="5 5"/>`);if(/cylinder/.test(type))return wrap(`<ellipse cx="180" cy="55" rx="65" ry="22"/><line x1="115" y1="55" x2="115" y2="175"/><line x1="245" y1="55" x2="245" y2="175"/><ellipse cx="180" cy="175" rx="65" ry="22"/>`);if(/cone/.test(type))return wrap(`<ellipse cx="180" cy="180" rx="70" ry="20"/><line x1="110" y1="180" x2="180" y2="35"/><line x1="250" y1="180" x2="180" y2="35"/>`);return wrap(`<rect x="90" y="65" width="150" height="115"/><polyline points="90,65 130,35 280,35 240,65"/><polyline points="240,65 280,35 280,150 240,180"/>`)}
 if(/line|angle|parallel|transversal/.test(type))return wrap(`<line x1="55" y1="70" x2="305" y2="70"/><line x1="55" y1="165" x2="305" y2="165"/><line x1="130" y1="25" x2="230" y2="210"/>`);
 return'';
}
function boot(){google.script.run.withSuccessHandler(b=>{app.bootstrap=b;$('#subtitle').textContent=`Day ${b.dashboard.day} · ${b.dashboard.todayChapter}`;home();nav('home')}).withFailureHandler(e=>{$('#main').innerHTML=`<div class="content"><div class="card">${esc(e.message||e)}</div></div>`}).getAppBootstrap()}
boot();
</script>
</body>
</html>
