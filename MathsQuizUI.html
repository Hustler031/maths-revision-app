<style>
/* Sole quiz presentation/interaction layer. */
.question-card{border-radius:14px;padding:16px}.question{font-size:clamp(19px,4.8vw,25px);line-height:1.45;font-weight:750;margin:10px 0 16px}.question.q-medium{font-size:clamp(18px,4.3vw,23px)}.question.q-long,.question.q-xlong{font-size:clamp(16px,3.8vw,20px);line-height:1.5}.options{gap:9px}.option{align-items:flex-start;border-radius:12px;padding:13px 12px;min-height:54px;font-size:16px;line-height:1.4;gap:10px}.option .letter{width:28px;height:28px;flex:0 0 28px;border-radius:8px;font-size:14px}.option.correct{background:var(--okbg)!important;border-color:var(--ok)!important}.option.correct .letter{background:var(--ok)!important;color:#fff!important}.option.wrong{background:var(--badbg)!important;border-color:var(--bad)!important}.option.wrong .letter{background:var(--bad)!important;color:#fff!important}.answer-body{font-size:16px}
.quiz-dock{bottom:0!important;left:50%!important;transform:translateX(-50%)!important;width:min(820px,100%)!important;border:0!important;border-top:1px solid var(--line)!important;border-radius:0!important;box-shadow:none!important;padding:8px 10px max(18px,calc(8px + env(safe-area-inset-bottom)))!important;background:var(--nav)!important;display:grid!important;gap:6px!important}.dock-tools{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:7px!important}.dock-tools .btn{min-width:0!important;min-height:48px!important;padding:8px 4px!important;font-size:12px!important}.dock-nav{display:grid!important;grid-template-columns:1fr 1fr!important;gap:6px!important;margin-top:0!important}.dock-nav .btn{min-width:0!important;min-height:52px!important;padding:9px 6px!important;font-size:16px!important;border-radius:13px!important}.dock-nav .btn:disabled{opacity:.38!important;pointer-events:none}.quiz-wrap{padding-bottom:188px!important}
.mq-star-on{background:var(--warnbg)!important;color:var(--warn)!important;border-color:var(--warn)!important}.mq-diff-on{background:color-mix(in srgb,#9d7cff 12%,var(--card))!important;color:#9d7cff!important;border-color:color-mix(in srgb,#9d7cff 50%,var(--line))!important}.mq-concept-on{background:var(--okbg)!important;color:var(--ok)!important;border-color:var(--ok)!important}.question-jump-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}.question-jump-grid .qj-correct{background:var(--okbg)!important;color:var(--ok)!important;border-color:var(--ok)!important}.question-jump-grid .qj-wrong{background:var(--badbg)!important;color:var(--bad)!important;border-color:var(--bad)!important}.question-jump-grid .qj-seen{background:var(--warnbg)!important;color:var(--warn)!important;border-color:var(--warn)!important}.question-jump-grid .qj-current{outline:2px solid var(--primary);outline-offset:1px}.quiz-jump-tag{cursor:pointer;user-select:none}
@media(max-width:390px){.question-card{padding:14px}.question{font-size:20px}.option{font-size:15px;padding:12px 10px}.dock-tools{gap:5px!important}.dock-tools .btn{font-size:11px!important;min-height:47px!important}.dock-nav .btn{font-size:15px!important;min-height:52px!important}.quiz-wrap{padding-bottom:192px!important}}
</style>
<script>
(function(){
'use strict';
var baseRender=window.renderQuestion,baseOpenQuiz=window.openQuiz,baseChoose=window.chooseOption,baseReveal=window.revealAnswer;
var jumpMap={};
function q(s,r){return (r||document).querySelector(s)}
function gas(name,a,b){return new Promise(function(ok,bad){var r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){bad(new Error(e&&e.message?e.message:String(e)))});if(name==='attempts')r.getSessionAttemptMapV3(a);else if(name==='star')r.toggleStarredV9(a,b);else if(name==='diff')r.toggleDifficultV9(a,b);else if(name==='concept')r.toggleConceptV9(a,b);else if(name==='position')r.saveSessionPosition(a,b);else bad(new Error('Unknown quiz endpoint'))})}
function toastSafe(s){if(typeof toast==='function')toast(String(s||''))}
function primeJump(){jumpMap={};if(!app.quiz)return;(app.quiz.questions||[]).forEach(function(x){if(x._answered)jumpMap[String(x.questionId)]=x._selected===x.correctOption?'correct':'wrong';else if(x._revealed)jumpMap[String(x.questionId)]='seen'});gas('attempts',app.quiz.sessionId).then(function(m){Object.keys(m||{}).forEach(function(k){jumpMap[k]=m[k]})}).catch(function(){})}
window.openQuestionJump=function(){if(!app.quiz||!app.quiz.questions||!app.quiz.questions.length)return;var total=app.quiz.questions.length,current=app.quiz.index+1,m=q('#modal'),buttons='';m.className='modal';for(var i=1;i<=total;i++){var x=app.quiz.questions[i-1],st=jumpMap[String(x.questionId||'')]||'',cls=st==='correct'?'qj-correct':st==='wrong'?'qj-wrong':st==='seen'?'qj-seen':'';if(i===current)cls+=' qj-current';buttons+='<button class="btn ghost '+cls+'" data-mq-jump="'+i+'">'+i+'</button>'}m.innerHTML='<div class="sheet"><div class="row between"><div><div class="eyebrow">Question selector</div><div class="quiz-title">Jump to question</div></div><button class="iconbtn" id="mqJumpX">×</button></div><div class="question-jump-grid">'+buttons+'</div></div>';q('#mqJumpX').onclick=closeModal;m.onclick=function(e){if(e.target===m)closeModal()};m.querySelectorAll('[data-mq-jump]').forEach(function(b){b.onclick=function(){var target=Math.max(0,Math.min(total-1,Number(b.dataset.mqJump||1)-1));closeModal();app.quiz.index=target;app.qStart=Date.now();window.renderQuestion();window.scrollTo(0,0);gas('position',app.quiz.sessionId,target).catch(function(){})}})};
if(baseChoose)window.chooseOption=function(k){baseChoose(k);var x=app.quiz&&app.quiz.questions[app.quiz.index];if(x){jumpMap[String(x.questionId)]=x._selected===x.correctOption?'correct':'wrong';stabilizeNav(x);if(x._revealed&&typeof paintAnsweredOptions==='function')setTimeout(function(){paintAnsweredOptions(x)},0)}};
if(baseReveal)window.revealAnswer=function(){baseReveal();var x=app.quiz&&app.quiz.questions[app.quiz.index];if(x){jumpMap[String(x.questionId)]='seen';stabilizeNav(x)}};
function toolbar(x){var tools=q('.dock-tools');if(!tools||!x)return;tools.innerHTML='<button class="btn ghost small" id="mqStar">☆ Starred</button><button class="btn ghost small" id="mqDiff">◇ Difficult</button><button class="btn ghost small" id="mqConcept">＋ Concept</button><button class="btn ghost small" id="mqPause">⏸ Pause</button>';var sb=q('#mqStar'),db=q('#mqDiff'),cb=q('#mqConcept');function paint(){var star=!!(x.important||x.marked);sb.textContent=star?'★ Starred':'☆ Starred';sb.className='btn small '+(star?'mq-star-on':'ghost');db.textContent=x.difficult?'◆ Difficult':'◇ Difficult';db.className='btn small '+(x.difficult?'mq-diff-on':'ghost');cb.textContent=x.inConcept?'✓ Concept':'＋ Concept';cb.className='btn small '+(x.inConcept?'mq-concept-on':'ghost')}paint();sb.onclick=function(){var before=!!(x.important||x.marked),next=!before;x.important=next;x.marked=next;paint();gas('star',x.questionId,app.quiz.sessionId).then(function(r){x.important=!!r.important;x.marked=!!r.important;paint();window.dispatchEvent(new CustomEvent('maths:data-changed'))}).catch(function(){x.important=before;x.marked=before;paint();toastSafe('Star update delayed')})};db.onclick=function(){var before=!!x.difficult;x.difficult=!before;paint();gas('diff',x.questionId,app.quiz.sessionId).then(function(r){x.difficult=!!r.difficult;paint();window.dispatchEvent(new CustomEvent('maths:data-changed'))}).catch(function(){x.difficult=before;paint();toastSafe('Difficult update delayed')})};cb.onclick=function(){var before=!!x.inConcept;x.inConcept=!before;paint();gas('concept',x.questionId,app.quiz.sessionId).then(function(r){x.inConcept=!!r.inConcept;paint();window.dispatchEvent(new CustomEvent('maths:data-changed'))}).catch(function(){x.inConcept=before;paint();toastSafe('Concept update delayed')})};q('#mqPause').onclick=pauseFast}
function stabilizeNav(){var buttons=document.querySelectorAll('.dock-nav .btn');if(buttons.length<2||!app.quiz)return;var prev=buttons[0],next=buttons[1],i=app.quiz.index,total=app.quiz.questions.length;prev.classList.remove('hidden');prev.disabled=i===0;next.classList.remove('hidden');next.disabled=false;next.textContent=i===total-1?'Finish':'Next →';next.classList.remove('ghost');next.classList.add('primary')}
function moveQuestion(delta){if(!app.quiz||!app.quiz.questions||!app.quiz.questions.length)return;var target=app.quiz.index+Number(delta||0);if(target<0||target>=app.quiz.questions.length)return;app.quiz.index=target;app.qStart=Date.now();window.renderQuestion();window.scrollTo(0,0);gas('position',app.quiz.sessionId,target).catch(function(){})}
window.previousQuestion=function(){moveQuestion(-1)};
window.nextQuestion=function(){if(!app.quiz)return;var total=app.quiz.questions.length;if(app.quiz.index>=total-1){if(typeof completeQuiz==='function')completeQuiz();return}moveQuestion(1)};
function pauseFast(){if(!app.quiz)return;var m=q('#modal');m.className='modal';m.innerHTML='<div class="sheet maths-pause-sheet"><div style="text-align:center"><h2 style="margin-top:0">Session paused</h2><p class="muted">'+esc(app.quiz.title)+' · '+(app.quiz.index+1)+'/'+app.quiz.questions.length+'</p><div class="row" style="gap:8px"><button class="btn primary" style="flex:1" id="mqResume">Continue</button><button class="btn ghost" style="flex:1" id="mqSaveHome">Save & Home</button></div></div></div>';m.onclick=function(e){if(e.target===m)closeModal()};q('#mqResume').onclick=closeModal;q('#mqSaveHome').onclick=window.saveAndHome}
window.renderQuestion=function(){baseRender();if(!app.quiz)return;var x=app.quiz.questions[app.quiz.index],counter=q('.quiz-head .tag');if(counter){counter.classList.add('quiz-jump-tag');counter.textContent='Q '+(app.quiz.index+1)+'/'+app.quiz.questions.length+' ▾';counter.onclick=window.openQuestionJump}toolbar(x);stabilizeNav();var navEl=q('#nav');if(navEl)navEl.classList.add('hidden');if(x&&x._revealed&&x.answerMode==='MCQ'&&typeof paintAnsweredOptions==='function')setTimeout(function(){paintAnsweredOptions(x)},0)};
window.openQuiz=function(s){var out=baseOpenQuiz(s);primeJump();return out};
window.saveAndHome=function(){if(!app.quiz)return typeof window.home==='function'?window.home():undefined;var x=app.quiz,idx=x.index;closeModal();if(app.bootstrap)app.bootstrap.resume={sessionId:x.sessionId,title:x.title,currentIndex:idx,total:x.questions.length,mode:x.mode};gas('position',x.sessionId,idx).catch(function(){});var navEl=q('#nav');if(navEl)navEl.classList.remove('hidden');if(typeof window.home==='function')window.home()};
})();
</script>
