<style>
/* Sole quiz presentation/interaction layer. English-style optimistic UX: answer feedback and navigation are immediate; persistence runs in background. */
.question-card{border-radius:14px;padding:16px}.question{font-size:clamp(19px,4.8vw,25px);line-height:1.45;font-weight:750;margin:10px 0 16px}.question.q-medium{font-size:clamp(18px,4.3vw,23px)}.question.q-long,.question.q-xlong{font-size:clamp(16px,3.8vw,20px);line-height:1.5}.options{gap:9px}.option{align-items:flex-start;border-radius:12px;padding:13px 12px;min-height:54px;font-size:16px;line-height:1.4;gap:10px}.option .letter{width:28px;height:28px;flex:0 0 28px;border-radius:8px;font-size:14px}.option.correct{background:var(--okbg)!important;border-color:var(--ok)!important}.option.correct .letter{background:var(--ok)!important;color:#fff!important}.option.wrong{background:var(--badbg)!important;border-color:var(--bad)!important}.option.wrong .letter{background:var(--bad)!important;color:#fff!important}.answer-body{font-size:16px}
.quiz-dock{bottom:0!important;left:50%!important;transform:translateX(-50%)!important;width:min(820px,100%)!important;border:0!important;border-top:1px solid var(--line)!important;border-radius:0!important;box-shadow:none!important;padding:8px 10px max(18px,calc(8px + env(safe-area-inset-bottom)))!important;background:var(--nav)!important;display:grid!important;gap:6px!important}.dock-tools{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:7px!important}.dock-tools .btn{min-width:0!important;min-height:48px!important;padding:8px 4px!important;font-size:12px!important}.dock-nav{display:grid!important;grid-template-columns:1fr 1fr!important;gap:6px!important;margin-top:0!important}.dock-nav .btn{min-width:0!important;min-height:52px!important;padding:9px 6px!important;font-size:16px!important;border-radius:13px!important}.dock-nav .btn:disabled{opacity:.38!important;pointer-events:none}.quiz-wrap{padding-bottom:188px!important}
.mq-star-on{background:var(--warnbg)!important;color:var(--warn)!important;border-color:var(--warn)!important}.mq-diff-on{background:color-mix(in srgb,#9d7cff 12%,var(--card))!important;color:#9d7cff!important;border-color:color-mix(in srgb,#9d7cff 50%,var(--line))!important}.mq-concept-on{background:var(--okbg)!important;color:var(--ok)!important;border-color:var(--ok)!important}.question-jump-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}.question-jump-grid .qj-correct{background:var(--okbg)!important;color:var(--ok)!important;border-color:var(--ok)!important}.question-jump-grid .qj-wrong{background:var(--badbg)!important;color:var(--bad)!important;border-color:var(--bad)!important}.question-jump-grid .qj-seen{background:var(--warnbg)!important;color:var(--warn)!important;border-color:var(--warn)!important}.question-jump-grid .qj-current{outline:2px solid var(--primary);outline-offset:1px}.quiz-jump-tag{cursor:pointer;user-select:none}
@media(max-width:390px){.question-card{padding:14px}.question{font-size:20px}.option{font-size:15px;padding:12px 10px}.dock-tools{gap:5px!important}.dock-tools .btn{font-size:11px!important;min-height:47px!important}.dock-nav .btn{font-size:15px!important;min-height:52px!important}.quiz-wrap{padding-bottom:192px!important}}
</style>
<script>
(function(){
'use strict';
var baseRender=window.renderQuestion,baseOpenQuiz=window.openQuiz,baseReveal=window.revealAnswer;
var jumpMap={};
function q(s,r){return (r||document).querySelector(s)}
function clearQuizMetricStrip(){['#maStrip','#mf-strip-host','#maths-global-strip'].forEach(function(s){var x=q(s);if(x)x.remove()})}
function gas(name,a,b){return new Promise(function(ok,bad){var r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){bad(new Error(e&&e.message?e.message:String(e)))});if(name==='attempts')r.getSessionAttemptMapV3(a);else if(name==='recall')r.submitRecallV15(a);else if(name==='star')r.toggleStarredV9(a,b);else if(name==='diff')r.toggleDifficultV9(a,b);else if(name==='concept')r.toggleConceptV9(a,b);else if(name==='position')r.saveSessionPosition(a,b);else if(name==='finish')r.finishSessionV15(a);else if(name==='bootstrap')r.getAppBootstrapV14();else bad(new Error('Unknown quiz endpoint'))})}
function toastSafe(s){if(typeof toast==='function')toast(String(s||''))}
function resultFor(x){return x&&x.answerMode==='MCQ'?(x._selected===x.correctOption?'correct':'wrong'):'seen'}
function payloadFor(x,result,index){return {questionId:x.questionId,result:result,mastered:!!x.mastered,mode:app.quiz.mode,sessionId:app.quiz.sessionId,nextIndex:Number(index)+1,responseSec:Math.max(.1,(Date.now()-(x._answerStartedAt||app.qStart||Date.now()))/1000),variantType:x.variantType||'',correctOption:x.correctOption||''}}
function applyAttemptMap(m){m=m||{};jumpMap={};if(!app.quiz)return m;(app.quiz.questions||[]).forEach(function(x){var id=String(x.questionId||''),st=m[id]||'';if(!id)return;if(st){x._attemptSaved=true;x._saveFailed=false;x._revealed=true;if(x.answerMode==='MCQ')x._answered=true;jumpMap[id]=st}else if(!x._savingPromise){x._attemptSaved=false}x._serverHydrated=true});return m}
function refreshAttemptMap(renderAfter){if(!app.quiz||!app.quiz.sessionId)return Promise.resolve({});return gas('attempts',app.quiz.sessionId).then(function(m){applyAttemptMap(m);if(renderAfter&&typeof window.renderQuestion==='function')window.renderQuestion();return m})}
function scheduleRetry(x,result,index){if(!x||x._attemptSaved||x._retryTimer)return;var n=Math.min(5,Number(x._saveRetryCount||0)+1);x._saveRetryCount=n;x._retryTimer=setTimeout(function(){x._retryTimer=null;saveConfirmed(x,result,index).catch(function(){})},Math.min(8000,700*Math.pow(2,n-1)))}
/* saveConfirmed deliberately keeps the historic name used by CI, but now persistence is non-blocking/optimistic like English. */
function saveConfirmed(x,result,index){if(!x||!app.quiz)return Promise.reject(new Error('No active question.'));if(x._attemptSaved)return Promise.resolve({ok:true,deduped:true});if(x._savingPromise)return x._savingPromise;x._saving=true;x._saveFailed=false;var p=gas('recall',payloadFor(x,result,index)).then(function(r){if(!r||r.ok===false)throw new Error(r&&r.message||'Answer save failed.');x._attemptSaved=true;x._saving=false;x._saveFailed=false;x._savingPromise=null;x._saveRetryCount=0;if(x._retryTimer){clearTimeout(x._retryTimer);x._retryTimer=null}jumpMap[String(x.questionId)]=result;window.dispatchEvent(new CustomEvent('maths:attempt-saved',{detail:{questionId:x.questionId,sessionId:app.quiz&&app.quiz.sessionId}}));return r}).catch(function(e){x._attemptSaved=false;x._saving=false;x._saveFailed=true;x._savingPromise=null;scheduleRetry(x,result,index);throw e});x._savingPromise=p;return p}
function startBackgroundSave(x,result,index){saveConfirmed(x,result,index).catch(function(){toastSafe('Answer shown. Saving will retry in background.')})}
function chooseOptimistic(k){if(!app.quiz)return;var x=app.quiz.questions[app.quiz.index];if(!x||x.answerMode!=='MCQ'||x._answered)return;var idx=app.quiz.index;x._answerStartedAt=app.qStart||Date.now();x._selected=k;x._answered=true;x._revealed=true;if(typeof paintAnsweredOptions==='function')paintAnsweredOptions(x);if(typeof showAnswerArea==='function')showAnswerArea();jumpMap[String(x.questionId)]=resultFor(x);stabilizeNav(x);startBackgroundSave(x,resultFor(x),idx)}
window.chooseOption=chooseOptimistic;
if(baseReveal)window.revealAnswer=function(){if(!app.quiz)return;baseReveal();var x=app.quiz.questions[app.quiz.index];if(x){x._answerStartedAt=x._answerStartedAt||app.qStart||Date.now();jumpMap[String(x.questionId)]='seen';stabilizeNav(x);startBackgroundSave(x,'seen',app.quiz.index)}};
function primeJump(){if(!app.quiz)return;refreshAttemptMap(true).catch(function(){jumpMap={};(app.quiz.questions||[]).forEach(function(x){if(x._attemptSaved||x._answered||x._revealed)jumpMap[String(x.questionId)]=resultFor(x)})})}
window.openQuestionJump=function(){if(!app.quiz||!app.quiz.questions||!app.quiz.questions.length)return;var total=app.quiz.questions.length,current=app.quiz.index+1,m=q('#modal'),buttons='';m.className='modal';for(var i=1;i<=total;i++){var x=app.quiz.questions[i-1],st=jumpMap[String(x.questionId||'')]||'',cls=st==='correct'?'qj-correct':st==='wrong'?'qj-wrong':st==='seen'?'qj-seen':'';if(i===current)cls+=' qj-current';buttons+='<button class="btn ghost '+cls+'" data-mq-jump="'+i+'">'+i+'</button>'}m.innerHTML='<div class="sheet"><div class="row between"><div><div class="eyebrow">Question selector</div><div class="quiz-title">Jump to question</div></div><button class="iconbtn" id="mqJumpX">×</button></div><div class="question-jump-grid">'+buttons+'</div></div>';q('#mqJumpX').onclick=closeModal;m.onclick=function(e){if(e.target===m)closeModal()};m.querySelectorAll('[data-mq-jump]').forEach(function(b){b.onclick=function(){var target=Math.max(0,Math.min(total-1,Number(b.dataset.mqJump||1)-1));closeModal();app.quiz.index=target;app.qStart=Date.now();window.renderQuestion();window.scrollTo(0,0);gas('position',app.quiz.sessionId,target).catch(function(){})}})};
function toolbar(x){var tools=q('.dock-tools');if(!tools||!x)return;tools.innerHTML='<button class="btn ghost small" id="mqStar">☆ Starred</button><button class="btn ghost small" id="mqDiff">◇ Difficult</button><button class="btn ghost small" id="mqConcept">＋ Concept</button><button class="btn ghost small" id="mqPause">⏸ Pause</button>';var sb=q('#mqStar'),db=q('#mqDiff'),cb=q('#mqConcept');function paint(){var star=!!(x.important||x.marked);sb.textContent=star?'★ Starred':'☆ Starred';sb.className='btn small '+(star?'mq-star-on':'ghost');db.textContent=x.difficult?'◆ Difficult':'◇ Difficult';db.className='btn small '+(x.difficult?'mq-diff-on':'ghost');cb.textContent=x.inConcept?'✓ Concept':'＋ Concept';cb.className='btn small '+(x.inConcept?'mq-concept-on':'ghost')}paint();sb.onclick=function(){var before=!!(x.important||x.marked),next=!before;x.important=next;x.marked=next;paint();gas('star',x.questionId,app.quiz.sessionId).then(function(r){x.important=!!r.important;x.marked=!!r.important;paint();window.dispatchEvent(new CustomEvent('maths:data-changed'))}).catch(function(){x.important=before;x.marked=before;paint();toastSafe('Star update delayed')})};db.onclick=function(){var before=!!x.difficult;x.difficult=!before;paint();gas('diff',x.questionId,app.quiz.sessionId).then(function(r){x.difficult=!!r.difficult;paint();window.dispatchEvent(new CustomEvent('maths:data-changed'))}).catch(function(){x.difficult=before;paint();toastSafe('Difficult update delayed')})};cb.onclick=function(){var before=!!x.inConcept;x.inConcept=!before;paint();gas('concept',x.questionId,app.quiz.sessionId).then(function(r){x.inConcept=!!r.inConcept;paint();window.dispatchEvent(new CustomEvent('maths:data-changed'))}).catch(function(){x.inConcept=before;paint();toastSafe('Concept update delayed')})};q('#mqPause').onclick=pauseFast}
function stabilizeNav(){var buttons=document.querySelectorAll('.dock-nav .btn');if(buttons.length<2||!app.quiz)return;var prev=buttons[0],next=buttons[1],i=app.quiz.index,total=app.quiz.questions.length;prev.classList.remove('hidden');prev.disabled=i===0;next.classList.remove('hidden');next.disabled=false;next.textContent=i===total-1?'Finish':'Next →';next.classList.remove('ghost');next.classList.add('primary')}
function moveQuestion(delta){if(!app.quiz||!app.quiz.questions||!app.quiz.questions.length)return;var target=app.quiz.index+Number(delta||0);if(target<0||target>=app.quiz.questions.length)return;app.quiz.index=target;app.qStart=Date.now();window.renderQuestion();window.scrollTo(0,0);gas('position',app.quiz.sessionId,target).catch(function(){})}
window.previousQuestion=function(){moveQuestion(-1)};
function locallyAnswered(x){return !!x&&(x.answerMode==='MCQ'?!!x._answered:!!x._revealed)}
function ensureCurrentStarted(){if(!app.quiz)return false;var x=app.quiz.questions[app.quiz.index];if(!x)return false;if(!locallyAnswered(x)){toastSafe(x.answerMode==='MCQ'?'Answer this question first.':'Reveal the answer first.');return false}if(!x._attemptSaved&&!x._savingPromise)startBackgroundSave(x,resultFor(x),app.quiz.index);return true}
function unresolvedIndexes(m){m=m||{};var out=[];(app.quiz&&app.quiz.questions||[]).forEach(function(x,i){if(!m[String(x.questionId||'')])out.push(i)});return out}
function localMissingIndex(){if(!app.quiz)return -1;for(var i=0;i<app.quiz.questions.length;i++)if(!locallyAnswered(app.quiz.questions[i]))return i;return -1}
function showCompletedNow(s){var navEl=q('#nav');if(navEl)navEl.classList.remove('hidden');var chapter=s.planChapter||(app.bootstrap&&app.bootstrap.dashboard&&app.bootstrap.dashboard.todayChapter)||'',mode=s.mode,main=q('#main');if(!main)return;main.innerHTML='<div class="content"><div class="card" style="text-align:center"><div style="font-size:36px">✓</div><h2>Session complete</h2><p class="muted">Your answers are being saved in the background.</p>'+(mode==='daily'?'<button class="btn primary" style="width:100%" id="mqPracticeMore">+ Practice More '+esc(chapter)+'</button><div style="height:8px"></div>':'')+'<button class="btn ghost" style="width:100%" id="mqBackHome">Back Home</button></div></div>';var pm=q('#mqPracticeMore');if(pm)pm.onclick=function(){beginQuiz('practice_more',{count:s.questions.length})};var bh=q('#mqBackHome');if(bh)bh.onclick=function(){if(typeof window.home==='function')window.home();else if(typeof showView==='function')showView('home')}}
function retryMissingFromMap(m){var missing=unresolvedIndexes(m),jobs=[];missing.forEach(function(i){var x=app.quiz.questions[i];if(locallyAnswered(x))jobs.push(saveConfirmed(x,resultFor(x),i).catch(function(){}))});return Promise.allSettled(jobs)}
function finalizeInBackground(snapshot,round){round=Number(round||0);var waits=(snapshot.questions||[]).map(function(x){return x._savingPromise}).filter(Boolean);Promise.allSettled(waits).then(function(){return refreshAttemptMap(false)}).then(function(m){return retryMissingFromMap(m)}).then(function(){return refreshAttemptMap(false)}).then(function(m){var missing=unresolvedIndexes(m);if(missing.length)throw new Error('Still waiting for '+missing.length+' answer save(s).');return gas('finish',snapshot.sessionId)}).then(function(done){if(!done||done.ok===false)throw new Error(done&&done.message||'Finish save failed.');return gas('bootstrap')}).then(function(b){if(b)app.bootstrap=b;window.dispatchEvent(new CustomEvent('maths:data-changed'))}).catch(function(){if(round<4){setTimeout(function(){finalizeInBackground(snapshot,round+1)},Math.min(12000,1200*Math.pow(2,round)))}else toastSafe('Some saves are still pending. Open the app later and Resume will recover them.')})}
function completeReliable(){if(!app.quiz)return;if(!ensureCurrentStarted())return;var target=localMissingIndex();if(target>=0){app.quiz.index=target;app.qStart=Date.now();window.renderQuestion();window.scrollTo(0,0);gas('position',app.quiz.sessionId,target).catch(function(){});toastSafe('Q'+(target+1)+' was not saved/answered. Please complete it first.');return}var snapshot=app.quiz;showCompletedNow(snapshot);finalizeInBackground(snapshot,0)}
window.completeQuiz=completeReliable;
window.nextQuestion=function(){if(!app.quiz||!ensureCurrentStarted())return;var total=app.quiz.questions.length;if(app.quiz.index>=total-1)return window.completeQuiz();moveQuestion(1)};
function pauseFast(){if(!app.quiz)return;var m=q('#modal');m.className='modal';m.innerHTML='<div class="sheet maths-pause-sheet"><div style="text-align:center"><h2 style="margin-top:0">Session paused</h2><p class="muted">'+esc(app.quiz.title)+' · '+(app.quiz.index+1)+'/'+app.quiz.questions.length+'</p><div class="row" style="gap:8px"><button class="btn primary" style="flex:1" id="mqResume">Continue</button><button class="btn ghost" style="flex:1" id="mqSaveHome">Save & Home</button></div></div></div>';m.onclick=function(e){if(e.target===m)closeModal()};q('#mqResume').onclick=closeModal;q('#mqSaveHome').onclick=window.saveAndHome}
window.renderQuestion=function(){clearQuizMetricStrip();baseRender();if(!app.quiz)return;var x=app.quiz.questions[app.quiz.index],counter=q('.quiz-head .tag');if(counter){counter.classList.add('quiz-jump-tag');counter.textContent='Q '+(app.quiz.index+1)+'/'+app.quiz.questions.length+' ▾';counter.onclick=window.openQuestionJump}toolbar(x);stabilizeNav();var navEl=q('#nav');if(navEl)navEl.classList.add('hidden');if(x&&(x._attemptSaved||x._answered||x._revealed)){if(x.answerMode==='MCQ'&&x._answered&&typeof paintAnsweredOptions==='function')setTimeout(function(){paintAnsweredOptions(x)},0);if(x._revealed&&typeof showAnswerArea==='function')setTimeout(showAnswerArea,0)}};
window.openQuiz=function(s){clearQuizMetricStrip();var out=baseOpenQuiz(s);clearQuizMetricStrip();primeJump();return out};
window.saveAndHome=function(){if(!app.quiz)return typeof window.home==='function'?window.home():undefined;var x=app.quiz,idx=x.index;closeModal();if(app.bootstrap)app.bootstrap.resume={sessionId:x.sessionId,title:x.title,currentIndex:idx,total:x.questions.length,mode:x.mode};gas('position',x.sessionId,idx).catch(function(){});var navEl=q('#nav');if(navEl)navEl.classList.remove('hidden');if(typeof window.home==='function')window.home()};
})();
</script>
