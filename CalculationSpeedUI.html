<style>
.cs-hero{border-radius:20px;padding:18px;background:linear-gradient(135deg,#3153d2,#7489ec);color:#fff}.cs-hero h2{margin:5px 0 7px;font-size:27px}.cs-hero p{margin:0;color:rgba(255,255,255,.84);font-size:13px;line-height:1.4}.cs-primary{width:100%;margin-top:14px;min-height:52px;border:0;border-radius:14px;background:#fff;color:#3152c7;font-weight:900;font-size:16px}.cs-rapid{width:100%;min-height:48px;margin-top:9px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);font-weight:900}.cs-acc{border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}.cs-head{display:flex;justify-content:space-between;align-items:center;padding:14px 15px;cursor:pointer;font-weight:900}.cs-body{padding:0 12px 13px;display:none}.cs-acc.open .cs-body{display:block}.cs-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.cs-btn{min-height:47px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font-weight:800;padding:8px}.cs-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.cs-stat{text-align:center;padding:10px 4px;border:1px solid var(--line);border-radius:12px}.cs-stat b{display:block;font-size:18px}.cs-stat small{font-size:10px;color:var(--muted)}
</style>
<script>
(function(){
function q(s){return document.querySelector(s)}function qa(s){return Array.from(document.querySelectorAll(s))}function e(v){return typeof esc==='function'?esc(v):String(v||'')}
function gas(name,arg){return new Promise(function(ok,bad){var r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(x){bad(new Error(x&&x.message?x.message:String(x)))});if(name==='hub')r.calcSpeedHubV19();else if(name==='start')r.startCalculationSpeedV19(arg||{});else bad(new Error('Unknown calculation endpoint'))})}
function count(mode,type,skill){var m=q('#modal');m.className='modal';m.innerHTML='<div class="sheet"><div class="row between"><div><div class="eyebrow">Calculation Training</div><div class="quiz-title">How many?</div></div><button class="iconbtn" id="csX">×</button></div><div class="cs-grid" style="margin-top:14px">'+[10,20,30,50].map(function(n){return'<button class="cs-btn" data-n="'+n+'">'+n+'</button>'}).join('')+'</div></div>';q('#csX').onclick=closeModal;qa('[data-n]',m).forEach(function(b){b.onclick=function(){closeModal();start({mode:mode,type:type||'',skill:skill||'',count:Number(b.dataset.n)})}})}
function start(req){if(typeof loading==='function')loading(true);gas('start',req).then(function(x){if(typeof loading==='function')loading(false);if(!x||x.ok===false){if(typeof toast==='function')toast(x&&x.message||'No calculation items');return}if(typeof window.openQuiz==='function')window.openQuiz(x)}).catch(function(x){if(typeof loading==='function')loading(false);if(typeof toast==='function')toast(x.message)})}
function skills(d,type){return(d.skills||[]).filter(function(x){return type==='MEMORY'?x.memory:type==='METHOD'?x.methods:x.drills}).map(function(x){var n=type==='MEMORY'?x.memory:type==='METHOD'?x.methods:x.drills;return'<button class="cs-btn" data-cs-type="'+type+'" data-cs-skill="'+e(x.skill)+'">'+e(x.skill)+' · '+n+'</button>'}).join('')||'<div class="muted">Content will appear here as PDFs are added.</div>'}
function section(title,sub,body,open){return'<div class="cs-acc '+(open?'open':'')+'"><div class="cs-head"><div><div>'+title+'</div><div class="muted" style="font-size:11px;margin-top:3px">'+sub+'</div></div><span>⌄</span></div><div class="cs-body">'+body+'</div></div>'}
function render(d){if(typeof app!=='undefined')app.view='calc_training';if(typeof nav==='function')nav('ondemand');var main=q('#main');main.innerHTML='<div class="content grid"><div class="row"><button class="btn ghost" onclick="showView(\'ondemand\')">← Back</button><div><div class="eyebrow">Speed System</div><div class="quiz-title">Calculation Training</div></div></div><div class="cs-hero"><div class="eyebrow" style="color:#e5eaff">Adaptive • Timed • No-option recall</div><h2>⚡ Mixed Practice</h2><p>Memory recall + methods + drills + weak/slow calculations. Memory facts stay no-option.</p><button class="cs-primary" id="csMixed">Start Mixed Practice</button><button class="cs-rapid" id="csRapid">🔥 60-sec Rapid Recall</button></div><div class="cs-stats"><div class="cs-stat"><b>'+Number(d.total||0)+'</b><small>Items</small></div><div class="cs-stat"><b>'+Number(d.wrong||0)+'</b><small>Wrong</small></div><div class="cs-stat"><b>'+Number(d.slow||0)+'</b><small>Slow</small></div></div>'+section('Daily Calculation','GPT demand sets with timer','<div class="muted" style="font-size:12px;margin-bottom:9px">Your existing dated CT sets stay here. Ask GPT for a new daily set; it appends to CALC_TRAINING and becomes available automatically.</div><button class="cs-btn" style="width:100%" id="csDaily">Open existing daily training</button>',false)+section('Recall','No options • View Answer • actual retrieval','<div class="cs-grid">'+skills(d,'MEMORY')+'</div>',true)+section('Memory','Learn/revise facts before testing recall','<div class="cs-grid">'+skills(d,'MEMORY')+'</div>',false)+section('Methods','Shortcuts and calculation techniques','<div class="cs-grid">'+skills(d,'METHOD')+'</div>',false)+section('Skill Drills','Direct practice by skill','<div class="cs-grid">'+skills(d,'DRILL')+'</div>',false)+section('Weak & Slow','Wrong, difficult and slow calculations first','<button class="cs-btn" style="width:100%" id="csWeak">Start Weak & Slow</button>',false)+'</div>';qa('.cs-head').forEach(function(h){h.onclick=function(){h.parentElement.classList.toggle('open')}});q('#csMixed').onclick=function(){count('mixed')};q('#csRapid').onclick=function(){start({mode:'recall',count:30,rapidSeconds:60})};q('#csWeak').onclick=function(){count('weak')};q('#csDaily').onclick=function(){if(typeof window.__legacyCalcHub==='function')window.__legacyCalcHub('CALC_TRAINING');else start({mode:'mixed',count:30})};qa('[data-cs-type]').forEach(function(b){b.onclick=function(){var mode=b.dataset.csType==='MEMORY'?'recall':'random';count(mode,b.dataset.csType,b.dataset.csSkill)}});window.scrollTo(0,0)}
var old=window.openCalculationHub;window.__legacyCalcHub=old;window.openCalculationHub=function(){if(typeof loading==='function')loading(true);gas('hub').then(function(d){if(typeof loading==='function')loading(false);render(d)}).catch(function(x){if(typeof loading==='function')loading(false);if(typeof toast==='function')toast(x.message)})};
})();
</script>
