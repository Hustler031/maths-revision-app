<style>
/* V7 polish: English-inspired vivid hierarchy without duplicating analytics. */
.v7-strip{display:grid;grid-template-columns:1.08fr repeat(3,1fr);gap:5px;margin:0 0 14px;width:100%}.v7-strip span{display:block;text-align:center;white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:8px 5px;font-size:12px;font-weight:900;line-height:1}.v7-strip .coverage{background:color-mix(in srgb,var(--primary) 28%,var(--card))}.v7-strip .wrong{background:color-mix(in srgb,#4f9cff 24%,var(--card))}.v7-strip .difficult{background:color-mix(in srgb,var(--ok) 24%,var(--card))}.v7-strip .starred{background:color-mix(in srgb,#f5b942 28%,var(--card))}
.v7-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.v7-actions .btn{min-height:42px;padding:8px 6px;font-size:11px;border-color:color-mix(in srgb,var(--primary) 24%,var(--line));background:color-mix(in srgb,var(--primary) 17%,var(--card));color:var(--primary)}.v7-actions .btn:disabled{opacity:.38}.v7-action-shell{border:1px solid var(--line);border-radius:16px;padding:11px;background:var(--card);box-shadow:var(--shadow);margin-bottom:12px}
.v7-progress-overview{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:10px}.v7-progress-overview>div{border-radius:13px;padding:10px 4px;text-align:center;border:1px solid var(--line);background:color-mix(in srgb,var(--primary) 17%,var(--card))}.v7-progress-overview>div:nth-child(3){background:color-mix(in srgb,#4f9cff 18%,var(--card))}.v7-progress-overview>div:nth-child(4){background:color-mix(in srgb,var(--ok) 16%,var(--card))}.v7-progress-overview>div:nth-child(5){background:color-mix(in srgb,#f5b942 21%,var(--card))}.v7-progress-overview b{display:block;font-size:15px}.v7-progress-overview span{display:block;color:var(--muted);font-size:8px;margin-top:2px}.v7-progress-overview small{display:block;color:var(--muted);font-size:7px;margin-top:2px}.v7-progress-track{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin:8px 0}.v7-progress-track i{display:block;height:100%;background:var(--ok);border-radius:999px}.v7-summary{color:var(--muted);font-size:10px}.v7-summary b{color:var(--text)}
.v7-star-hero{border:1px solid color-mix(in srgb,#f5b942 28%,var(--line));border-radius:17px;padding:14px;background:linear-gradient(135deg,color-mix(in srgb,#f5b942 18%,var(--card)),color-mix(in srgb,var(--primary) 9%,var(--card)));box-shadow:var(--shadow)}.v7-star-hero h3{margin:0 0 4px;font-size:18px}.v7-history{display:grid;gap:8px}.v7-history-row{border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}.v7-history-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;cursor:pointer}.v7-history-body{padding:0 12px 12px}.v7-history-head b{font-size:15px}.v7-history-head small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.v7-chapter{border:1px solid var(--line);border-radius:15px;background:var(--card);padding:12px;box-shadow:var(--shadow)}.v7-chapter-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.v7-chapter-head b{font-size:15px}.v7-chip{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 8px}.v7-chapter-line{font-size:10px;color:var(--muted)}
/* remove legacy duplicate analytics only; keep their structural content */
.v5-scope-strip,.v4-strip-wrap,.v6-scope,.v6-module-panel>.v6-strip{display:none!important}.v7-polished .v6-module-panel{padding:10px}.v7-polished .v6-module-panel .v6-actions,.v7-polished .v4-actions,.v7-polished .v3-actions{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:8px!important}.v7-polished .v6-module-panel .btn,.v7-polished .v4-actions .btn,.v7-polished .v3-actions .btn{min-height:42px!important;padding:8px 6px!important;font-size:11px!important;background:color-mix(in srgb,var(--primary) 17%,var(--card))!important;color:var(--primary)!important;border-color:color-mix(in srgb,var(--primary) 24%,var(--line))!important}
@media(max-width:390px){.v7-strip{gap:3px}.v7-strip span{font-size:10px;padding:7px 3px}.v7-actions .btn{font-size:10px}.v7-progress-overview{gap:4px}.v7-progress-overview b{font-size:13px}.v7-progress-overview span{font-size:7px}}
</style>
<script>
(function(){
'use strict';
var HOME_KEY='maths-v7:bootstrap';
var base={home:window.home,chapter:window.openChapterHub,topic:window.openTopicHub,group:window.openStudyGroup,demand:window.startDemandSet,calc:window.openCalculationHub};
function call(fn,a){return new Promise(function(ok,bad){var r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){bad(new Error(e&&e.message?e.message:String(e)))});if(fn==='scope')r.getMathsScopeMetricV6(a||{});else if(fn==='snapshot')r.getMathsSnapshotV6(false);else if(fn==='new')r.getMathsNewHubV6();else if(fn==='star')r.getStarredRevisionV6();else if(fn==='quiz')r.startMathsV6Quiz(a||{});else if(fn==='view')r.getMathsViewItemsV4(a||{});else bad(new Error('Unknown V7 call'))})}
function cacheGet(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function cacheSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}return v}
function strip(m){m=m||{};return '<div class="v7-strip"><span class="coverage">Coverage '+Number(m.coverage||0)+'%</span><span class="wrong">✕ '+Number(m.wrong||0)+'</span><span class="difficult">◆ '+Number(m.difficult||0)+'</span><span class="starred">☆ '+Number(m.starred||0)+'</span></div>'}
function actions(prefix,revision){var labels=revision?['view','all','new','weak','difficult','random']:['all','new','weak','starred','difficult','random'];var text={view:'View All',all:'Practice All',new:'New',weak:'Weak',starred:'Starred',difficult:'◆ Difficult',random:'Random'};return '<div class="v7-actions">'+labels.map(function(k){return '<button class="btn ghost" data-'+prefix+'="'+k+'">'+text[k]+'</button>'}).join('')+'</div>'}
function picker(req,label){var m=$('#modal');m.className='modal';m.innerHTML='<div class="sheet"><div class="row between"><div><div class="eyebrow">'+esc(label)+'</div><div class="quiz-title">How many questions?</div></div><button class="iconbtn" id="v7x">×</button></div><div class="v7-actions" style="margin-top:12px"><button class="btn ghost" data-n="10">10</button><button class="btn ghost" data-n="20">20</button><button class="btn ghost" data-n="25">25</button></div></div>';$('#v7x').onclick=closeModal;m.onclick=function(e){if(e.target===m)closeModal()};m.querySelectorAll('[data-n]').forEach(function(b){b.onclick=function(){closeModal();runQuiz(Object.assign({},req,{count:Number(b.dataset.n)}))}})}
function runQuiz(req){loading(true);call('quiz',req).then(function(s){loading(false);if(!s||s.ok===false)return toast((s&&s.message)||'No eligible questions');window.openQuiz(s)}).catch(function(e){loading(false);toast(e.message||String(e))})}
function bind(root,prefix,req,revision){root.querySelectorAll('[data-'+prefix+']').forEach(function(b){b.onclick=function(e){e.stopPropagation();var k=b.getAttribute('data-'+prefix);if(k==='view')return openRead(req,req.title||'Revision');var r=Object.assign({},req,{kind:k});if(k==='all')runQuiz(r);else picker(r,(req.title||req.chapter||'Practice')+' · '+b.textContent.trim())}})}
function openRead(req,title){loading(true);call('view',req).then(function(items){loading(false);var m=$('#modal');m.className='modal';m.innerHTML='<div class="sheet"><div class="row between"><div><div class="eyebrow">Read-only</div><div class="quiz-title">'+esc(title)+'</div></div><button class="iconbtn" id="v7rx">×</button></div><div class="list" style="margin-top:10px">'+items.map(function(x){return '<div class="list-card"><b>'+esc(x.chapter||'Maths')+'</b><div class="muted" style="font-size:11px">'+esc(String(x.prompt||'').slice(0,180))+'</div></div>'}).join('')+'</div></div>';$('#v7rx').onclick=closeModal;m.onclick=function(e){if(e.target===m)closeModal()}}).catch(function(e){loading(false);toast(e.message||String(e))})}
function cleanup(root){if(!root)return;root.classList.add('v7-polished');root.querySelectorAll('.v5-scope-strip,.v4-strip-wrap,.v6-scope,.v7-page-strip').forEach(function(x){x.remove()})}
function installScope(req){var main=$('#main'),content=main&&main.querySelector('.content');if(!content)return;cleanup(content);var top=document.createElement('div');top.className='v7-page-strip';top.innerHTML=strip({});var back=content.firstElementChild;if(back&&back.tagName==='BUTTON')back.insertAdjacentElement('afterend',top);else content.insertBefore(top,content.firstChild);var panel=content.querySelector('.v6-module-panel,.v3-card:has(.v6-actions),.v3-card:has(.v4-actions),.v3-card:has(.v3-actions)');if(panel){panel.querySelectorAll('.v6-strip,.v6-scope,.v5-scope-strip,.v4-strip-wrap').forEach(function(x){x.remove()});var oldActs=panel.querySelector('.v6-actions,.v4-actions,.v3-actions');if(oldActs){oldActs.outerHTML=actions('v7scope',false);bind(panel,'v7scope',req,false)}}call('scope',req).then(function(m){if(top.isConnected)top.innerHTML=strip(m)}).catch(function(){})}
function groupReq(k){if(k==='mocks')return {scope:'demand_set',setId:'MOCK_QUESTIONS',title:'Mock Questions'};var list=(app.bootstrap&&app.bootstrap.chapters||[]).filter(function(c){var x=String(c.chapter||'').toLowerCase(),g=/fraction pattern|triplet|calculation memory|square|cube/.test(x)?'misc':/percentage|profit|loss|discount|ratio|proportion|average|mixture|alligation|interest|time.*work|pipe|cistern|speed|distance|train|boat|stream|partnership|ages|work.*wage/.test(x)?'arithmetic':'advanced';return g===k});return {scope:'group',chapters:list.map(function(c){return c.chapter}),groupName:k,title:k==='advanced'?'Advanced':k==='arithmetic'?'Arithmetic':'MISC'}}
window.openChapterHub=function(ch){base.chapter(ch);setTimeout(function(){installScope({scope:'chapter',chapter:ch,title:ch})},0)};
window.openTopicHub=function(ch,t){base.topic(ch,t);setTimeout(function(){installScope({scope:'topic',chapter:ch,majorTopic:t,title:t})},0)};
window.openStudyGroup=function(k){base.group(k);setTimeout(function(){installScope(groupReq(k))},25)};
window.startDemandSet=function(id){base.demand(id);if(String(id)!=='CALC_TRAINING')setTimeout(function(){installScope({scope:'demand_set',setId:String(id),title:'Saved Set'})},20)};
window.openCalculationHub=function(id){base.calc(id);setTimeout(function(){installScope({scope:'demand_set',setId:String(id),title:'Calculation Training'})},20)};
function renderNew(d){if(app.view!=='new')return;var h='<div class="content v7-polished"><button class="btn ghost" id="v7nb">← Home</button><div class="v7-page-strip">'+strip(d.overall)+'</div><div class="section-title">New Practice</div><div class="v7-action-shell">'+actions('v7new',false)+'</div><div class="section-title">By Chapter</div><div class="list">'+(d.chapters||[]).map(function(c){return '<div class="v7-chapter v3-click" data-ch="'+esc(c.chapter)+'"><div class="v7-chapter-head"><b>'+esc(c.chapter)+'</b><span class="v7-chip">'+Number(c.metric.total||0)+' Q</span></div><div class="v7-chapter-line">'+Number(c.metric.unseen||0)+' unseen · '+Number(c.metric.wrong||0)+' wrong · ◆ '+Number(c.metric.difficult||0)+' · ☆ '+Number(c.metric.starred||0)+'</div></div>'}).join('')+'</div></div>';$('#main').innerHTML=h;$('#v7nb').onclick=window.home;bind($('#main'),'v7new',{scope:'all',title:'All New Practice'},false);$('#main').querySelectorAll('[data-ch]').forEach(function(x){x.onclick=function(){var c=(d.chapters||[]).find(function(v){return v.chapter===x.dataset.ch})||{metric:{}};$('#main').innerHTML='<div class="content v7-polished"><button class="btn ghost" id="v7ncb">← New Practice</button><div class="v7-page-strip">'+strip(c.metric)+'</div><div class="section-title">'+esc(x.dataset.ch)+'</div><div class="v7-action-shell">'+actions('v7newch',false)+'</div></div>';$('#v7ncb').onclick=window.openGlobalNewV3;bind($('#main'),'v7newch',{scope:'chapter',chapter:x.dataset.ch,title:x.dataset.ch+' · New Practice'},false)}})}
window.openGlobalNewV3=function(){app.view='new';nav('home');var c=cacheGet('maths-v7:new');if(c)renderNew(c);call('new').then(function(d){cacheSet('maths-v7:new',d);renderNew(d)}).catch(function(e){if(!c)toast(e.message||String(e))})};
function stat(s){s=s||{};return Number(s.starred||0)+' Starred · '+Number(s.mastered||0)+' Mastered · '+Number(s.focus||0)+' Focus'}
function histRow(title,s,lo,hi){return '<div class="v7-history-row"><div class="v7-history-head" data-range="'+lo+'-'+hi+'"><div><b>'+esc(title)+'</b><small>'+stat(s)+'</small></div><span>›</span></div><div class="v7-history-body hidden" data-body="'+lo+'-'+hi+'">'+actions('v7rev',true)+'</div></div>'}
function renderStar(d,m){if(app.view!=='starred')return;var h='<div class="content v7-polished"><button class="btn ghost" id="v7sb">← Home</button><div class="v7-page-strip">'+strip(m||{})+'</div><div class="section-title">⭐ Starred Revision</div><div class="v7-star-hero"><h3>All Starred Revision</h3><div class="muted" style="font-size:11px;margin-bottom:11px">'+stat(d.stats)+'</div>'+actions('v7top',true)+'</div><div class="section-title">Day-wise Focus</div><div class="v7-history">';(d.recentDays||[]).forEach(function(x){h+=histRow('Day '+x.day,x.stats,x.day,x.day)});(d.tenBlocks||[]).forEach(function(x){h+=histRow('Days '+x.lo+'–'+x.hi,x.stats,x.lo,x.hi)});(d.months||[]).forEach(function(x){h+=histRow(x.label+' · Days '+x.lo+'–'+x.hi,x.stats,x.lo,x.hi)});h+='</div></div>';$('#main').innerHTML=h;$('#v7sb').onclick=window.home;bind($('#main'),'v7top',{scope:'star_history',starLo:1,starHi:999999,title:'All Starred Revision'},true);$('#main').querySelectorAll('[data-range]').forEach(function(x){x.onclick=function(){var p=x.dataset.range.split('-'),lo=Number(p[0]),hi=Number(p[1]),body=$('[data-body="'+lo+'-'+hi+'"]');body.classList.toggle('hidden');x.querySelector('span').textContent=body.classList.contains('hidden')?'›':'⌄';if(!body.classList.contains('hidden'))bind(body,'v7rev',{scope:'star_history',starLo:lo,starHi:hi,title:lo===hi?'Day '+lo:'Days '+lo+'–'+hi},true)}})}
window.openStarredRevisionV3=function(){app.view='starred';nav('home');var c=cacheGet('maths-v7:star');if(c)renderStar(c.data,c.metric);Promise.all([call('star'),call('scope',{scope:'star_history',starLo:1,starHi:999999})]).then(function(x){var v={data:x[0],metric:x[1]};cacheSet('maths-v7:star',v);renderStar(v.data,v.metric)}).catch(function(e){if(!c)toast(e.message||String(e))})};
function renderProgress(d){if(app.view!=='progress')return;var o=d.overall||{},h='<div class="content v7-polished"><div class="v7-page-strip">'+strip(o)+'</div><div class="section-title">Progress</div><div class="v7-progress-overview"><div><b>'+Number(o.total||0)+'</b><span>Total Q</span></div><div><b>'+Number(o.attempted||0)+'</b><span>Encountered</span></div><div><b>✕ '+Number(o.wrong||0)+'</b><span>Wrong</span><small>'+Number(o.wrongPct||0)+'%</small></div><div><b>◆ '+Number(o.difficult||0)+'</b><span>Difficult</span><small>'+Number(o.difficultPct||0)+'%</small></div><div><b>☆ '+Number(o.starred||0)+'</b><span>Starred</span><small>'+Number(o.starredPct||0)+'%</small></div></div><div class="v7-progress-track"><i style="width:'+Number(o.coverage||0)+'%"></i></div><div class="v7-summary"><b>'+Number(o.attempted||0)+' / '+Number(o.total||0)+'</b> encountered · '+Number(o.unseen||0)+' left</div><div class="section-title">By Chapter</div><div class="list">';(d.chapters||[]).forEach(function(c){var m=c.metric||{};h+='<div class="v7-chapter"><div class="v7-chapter-head"><b>'+esc(c.chapter)+'</b><span class="v7-chip">'+Number(m.total||0)+' Q</span></div><div class="v7-progress-track"><i style="width:'+Number(m.coverage||0)+'%"></i></div><div class="v7-chapter-line">✕ Wrong <b>'+Number(m.wrong||0)+'</b> · ◆ Difficult <b>'+Number(m.difficult||0)+'</b> · ☆ Starred <b>'+Number(m.starred||0)+'</b> · Left <b>'+Number(m.unseen||0)+'</b></div></div>'});h+='</div></div>';$('#main').innerHTML=h}
window.progress=function(){app.view='progress';nav('progress');var c=cacheGet('maths-v7:progress');if(c)renderProgress(c);call('snapshot').then(function(d){cacheSet('maths-v7:progress',d);renderProgress(d)}).catch(function(e){if(!c)toast(e.message||String(e))})};
/* Cached-first Home: restore a valid bootstrap synchronously instead of blanking the page. */
var cachedBoot=cacheGet(HOME_KEY);if(cachedBoot&&(!app.bootstrap||!$('#main').innerHTML.trim())){try{app.bootstrap=cachedBoot;base.home();var ld=$('#loading');if(ld)ld.classList.add('hidden')}catch(e){}}
window.home=function(){var out=base.home();if(app.bootstrap)cacheSet(HOME_KEY,app.bootstrap);var n=$('#nav');if(n)n.classList.remove('hidden');return out};
/* First-tap routing guard for cached/legacy Home cards. */
document.addEventListener('click',function(e){var n=e.target.closest&&e.target.closest('#v3New,#v4new,[data-open="new-practice"]');if(n){e.preventDefault();e.stopImmediatePropagation();window.openGlobalNewV3();return}var s=e.target.closest&&e.target.closest('#v3Star,#v4star,[data-open="starred-revision"]');if(s){e.preventDefault();e.stopImmediatePropagation();window.openStarredRevisionV3()}},true);
})();
</script>
