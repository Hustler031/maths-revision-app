<script>
(function(){
'use strict';
var MATHS_COLD_START_REPAIR_VERSION='v21-post-render-sync';
var running=false,lastSyncAt=0,resumePolicy=null,MIN_SYNC_GAP=60000;
function q(s){return document.querySelector(s)}
function homeVisible(){return !!q('#main .ma-home')}
function currentView(){try{return typeof app!=='undefined'?String(app.view||''):''}catch(e){return''}}
function enforceResumePolicy(){if(!resumePolicy)return;var card=q('#main .ma-resume');if(!card)return;if(!resumePolicy.resume){card.remove();return}var title=String(resumePolicy.resume.title||'').trim();if(title&&card.textContent.indexOf(title)<0)card.remove();}
function refreshResumePolicy(){google.script.run.withSuccessHandler(function(p){resumePolicy=p||null;enforceResumePolicy()}).withFailureHandler(function(){}).getMathsResumePolicyV18();}
function refreshVisibleHome(){
  var fn=window.refreshMathsHomeCacheSilent;
  if(typeof fn!=='function'){refreshResumePolicy();return Promise.resolve(null);}
  try{
    return Promise.resolve(fn()).then(function(){
      if(currentView()==='home'&&typeof window.home==='function')window.home();
      refreshResumePolicy();
      return true;
    }).catch(function(){return null});
  }catch(e){return Promise.resolve(null);}
}
function syncExternal(force){
  var now=Date.now();
  if(running)return;
  if(!force&&now-lastSyncAt<MIN_SYNC_GAP)return;
  lastSyncAt=now;running=true;
  google.script.run.withSuccessHandler(function(s){
    running=false;
    if(!s||s.ok===false)return;
    if(s.changed){refreshVisibleHome();return;}
    refreshResumePolicy();
  }).withFailureHandler(function(){running=false;}).syncMathsExternalDataV18();
}
function init(){
  // The authoritative MathsAppUI controller owns first paint. Expensive full-sheet
  // reconciliation is intentionally deferred until after the home screen is usable.
  setTimeout(function(){syncExternal(false)},5000);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')setTimeout(function(){syncExternal(false)},700)});
  window.addEventListener('maths:data-changed',function(){setTimeout(function(){refreshVisibleHome()},250)});
  setTimeout(refreshResumePolicy,1800);
}
window.MathsColdStartRepairV18={version:MATHS_COLD_START_REPAIR_VERSION,sync:function(){syncExternal(true)},retry:function(){return refreshVisibleHome()},homeVisible:homeVisible};
init();
})();
</script>
