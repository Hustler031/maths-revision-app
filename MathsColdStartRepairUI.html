<script>
(function(){
'use strict';
var MATHS_COLD_START_REPAIR_VERSION='v17-cold-start-1';
var PREFIX='maths-app-v9:',MOCK_PREFIX='maths-mocks-v10:',CACHE_SCHEMA='academic-v14-cache1',COMPAT='v14',MAX_STALE=24*60*60*1000;
var startupDone=false,startupRunning=false,startupAttempts=0,lastSyncAt=0,resumePolicy=null,observer=null;
function q(s){return document.querySelector(s)}
function safeParse(raw){try{return JSON.parse(raw||'null')}catch(e){return null}}
function compatFor(k,d){return k==='bootstrap'?String(d&&d.chapterVisibilityVersion||''):String(d&&d.eligibilityVersion||'')}
function readValid(k){
  var key=PREFIX+k,x=safeParse(localStorage.getItem(key));
  if(!x)return null;
  var age=Date.now()-Number(x.ts||0),compat=String(x.compat||'');
  if(String(x.schema||'')!==CACHE_SCHEMA||compat!==COMPAT||age>MAX_STALE||!x.data){try{localStorage.removeItem(key)}catch(e){}return null}
  return x;
}
function writeCache(k,d,version){
  if(!d)return;
  var compat=compatFor(k,d);if(compat!==COMPAT)return;
  var x={ts:Date.now(),version:String(version||d.version||''),schema:CACHE_SCHEMA,compat:compat,data:d};
  try{localStorage.setItem(PREFIX+k,JSON.stringify(x))}catch(e){}
}
function clearMathsCaches(){
  try{for(var i=localStorage.length-1;i>=0;i--){var k=localStorage.key(i);if(k&&(k.indexOf(PREFIX)===0||k.indexOf(MOCK_PREFIX)===0||k.indexOf('maths-concepts-v16:')===0))localStorage.removeItem(k)}}catch(e){}
}
function showLoadingShell(){
  var m=q('#main');if(m&&!q('#main .ma-home'))m.innerHTML='<div class="ma-loading-shell"><div class="ma-loading-card"></div></div>';
  var l=q('#loading');if(l)l.setAttribute('data-label','Loading Maths…');
  try{if(typeof loading==='function')loading(true)}catch(e){}
}
function homeVisible(){return !!q('#main .ma-home')}
function finishVisibleHome(){
  if(!homeVisible())return false;
  startupDone=true;
  try{if(typeof loading==='function')loading(false)}catch(e){}
  var l=q('#loading');if(l)l.removeAttribute('data-label');
  enforceResumePolicy();
  return true;
}
function enforceResumePolicy(){
  if(!resumePolicy)return;
  var card=q('#main .ma-resume');if(!card)return;
  if(!resumePolicy.resume){card.remove();return}
  var title=String(resumePolicy.resume.title||'').trim();
  if(title&&card.textContent.indexOf(title)<0)card.remove();
}
function watchHome(){
  if(observer||typeof MutationObserver==='undefined')return;
  var target=q('#main')||document.body;if(!target)return;
  observer=new MutationObserver(function(){finishVisibleHome()});observer.observe(target,{childList:true,subtree:true});
  finishVisibleHome();
}
function renderStartupFailure(message){
  var m=q('#main');if(m)m.innerHTML='<div class="ma-page"><div class="ma-card"><div class="ma-row-title">Maths could not finish loading.</div><div class="ma-row-sub">'+String(message||'Temporary startup error').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})+'</div><button class="btn primary" id="mathsColdRetry" style="margin-top:12px">Retry</button></div></div>';
  try{if(typeof loading==='function')loading(false)}catch(e){}
  var b=q('#mathsColdRetry');if(b)b.onclick=function(){startupAttempts=0;requestStartup()};
}
function installPayload(p){
  if(!p||p.ok===false||!p.home||!p.bootstrap)throw new Error('Invalid Maths startup payload');
  if(String(p.compat||'')!==COMPAT||String(p.cacheSchema||'')!==CACHE_SCHEMA)throw new Error('Incompatible Maths startup payload');
  var version=String(p.version||p.home.version||p.bootstrap.version||'');
  clearMathsCaches();writeCache('bootstrap',p.bootstrap,version);writeCache('home',p.home,version);
  resumePolicy=p.resumePolicy||null;
  try{if(typeof app!=='undefined')app.bootstrap=p.bootstrap}catch(e){}
  if(typeof window.home!=='function')throw new Error('Maths Home renderer unavailable');
  window.home();
  finishVisibleHome();
}
function requestStartup(){
  if(startupRunning)return;startupRunning=true;showLoadingShell();startupAttempts++;
  var runner=google.script.run.withSuccessHandler(function(p){
    startupRunning=false;
    try{installPayload(p)}catch(e){startupFailure(e)}
  }).withFailureHandler(function(e){startupRunning=false;startupFailure(e)});
  runner.getMathsStartupPayloadV17();
}
function startupFailure(e){
  if(startupAttempts<2){requestStartup();return}
  var hc=readValid('home');
  if(hc&&typeof window.home==='function'){window.home();if(finishVisibleHome())return}
  renderStartupFailure(e&&e.message?e.message:String(e||'Startup failed'));
}
function syncExternal(force){
  var now=Date.now();if(!force&&now-lastSyncAt<30000)return;lastSyncAt=now;
  google.script.run.withSuccessHandler(function(s){
    if(!s||s.ok===false)return;
    var hc=readValid('home'),cachedVersion=String(hc&&hc.version||'');
    if(s.changed||cachedVersion&&String(s.version||'')!==cachedVersion){startupAttempts=0;requestStartup();return}
    google.script.run.withSuccessHandler(function(p){resumePolicy=p||null;enforceResumePolicy()}).withFailureHandler(function(){}).getMathsResumePolicyV17();
  }).withFailureHandler(function(){}).syncMathsExternalDataV17();
}
function init(){
  watchHome();
  var bc=readValid('bootstrap'),hc=readValid('home');
  if(!bc||!hc){showLoadingShell();requestStartup();}
  else syncExternal(true);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')syncExternal(false)});
  window.addEventListener('maths:data-changed',function(){syncExternal(true)});
}
window.MathsColdStartRepairV17={version:MATHS_COLD_START_REPAIR_VERSION,sync:function(){syncExternal(true)},retry:function(){startupAttempts=0;requestStartup()},homeVisible:homeVisible};
init();
})();
</script>
