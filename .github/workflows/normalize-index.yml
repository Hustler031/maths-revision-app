name: Normalize Maths mobile shell

on:
  push:
    branches: [main]
    paths:
      - 'scripts/normalize_index.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore known-good mobile shell only
        run: python scripts/normalize_index.py
      - name: Commit source normalization
        run: |
          if git diff --quiet -- Index.html; then
            echo 'Index.html already normalized.'
            exit 0
          fi
          git config user.name 'maths-revision-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Index.html
          git commit -m 'Restore known-good mobile shell in Index.html'
          git push
