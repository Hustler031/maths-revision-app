name: Finalize Maths V9

on:
  push:
    branches: [main]
    paths:
      - 'scripts/finalize_v9.py'
      - '.github/workflows/finalize-v9.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final V9 consistency fixes
        run: python scripts/finalize_v9.py
      - name: Commit refactor and remove one-shot tooling
        run: |
          git config user.name 'maths-revision-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add MathsCore.gs MathsAppUI.html
          git rm scripts/finalize_v9.py .github/workflows/finalize-v9.yml
          git commit -m 'Finalize V9 new-practice scope and cache behavior'
          git push
