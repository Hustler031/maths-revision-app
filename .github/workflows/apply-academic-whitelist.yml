name: Apply academic practice whitelist

on:
  push:
    branches: [agent/academic-practice-whitelist]
    paths:
      - '.github/workflows/apply-academic-whitelist.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/academic-practice-whitelist
      - name: Apply whitelist patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('MathsAcademicEligibilityV14.gs')
          s=p.read_text()
          s=s.replace("const MATHS_ACADEMIC_ELIGIBILITY_VERSION='v14';","const MATHS_ACADEMIC_ELIGIBILITY_VERSION='v15';")
          old="const id=String(q.question_id||'').trim(),chapter=normalizeLabel_(q.chapter||''),topic=normalizeLabel_(q.topic||''),type=normalizeLabel_(q.card_type||''),template=String(q.template_group||'').trim().toUpperCase();\n  if(!id||!chapter)return false;"
          new="const id=String(q.question_id||'').trim(),chapter=normalizeLabel_(q.chapter||''),topic=normalizeLabel_(q.topic||''),type=normalizeLabel_(q.card_type||''),template=String(q.template_group||'').trim().toUpperCase(),bank=normalizeLabel_(q.practice_bank||'');\n  if(!id||!chapter)return false;\n  // Positive inclusion: only rows explicitly classified as ACADEMIC may enter normal chapter practice.\n  if(bank!=='academic')return false;"
          if old not in s:
              raise SystemExit('Eligibility insertion point not found')
          s=s.replace(old,new)
          s=s.replace("mathsCacheKeyV9_('progress-academic-v14')","mathsCacheKeyV9_('progress-academic-v15')")
          p.write_text(s)

          p=Path('CompletePracticeUI.gs')
          s=p.read_text()
          s=s.replace("academic-v14-cache1","academic-v15-cache1")
          s=s.replace("ACADEMIC_COMPAT='v14'","ACADEMIC_COMPAT='v15'")
          s=s.replace("chapterVisibilityVersion||'')==='v14'","chapterVisibilityVersion||'')==='v15'")
          s=s.replace("pre-V14","pre-V15")
          p.write_text(s)

          for name in ['.github/workflows/focused-practice-contract.yml','.github/workflows/cache-compat-contract.yml','.github/workflows/route-persistence-contract.yml']:
              p=Path(name)
              s=p.read_text()
              s=s.replace("academic-v14-cache1","academic-v15-cache1")
              s=s.replace("MATHS_ACADEMIC_ELIGIBILITY_VERSION='v14'","MATHS_ACADEMIC_ELIGIBILITY_VERSION='v15'")
              s=s.replace("chapterVisibilityVersion||'')==='v14'","chapterVisibilityVersion||'')==='v15'")
              p.write_text(s)

          p=Path('.github/workflows/focused-practice-contract.yml')
          s=p.read_text()
          marker="grep -Fq \"const MATHS_ACADEMIC_ELIGIBILITY_VERSION='v15'\" \"$F\"\n"
          add="          grep -Fq \"bank=normalizeLabel_(q.practice_bank||'')\" \"$F\"\n          grep -Fq \"if(bank!=='academic')return false\" \"$F\"\n"
          if add.strip() not in s:
              s=s.replace(marker,marker+add)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MathsAcademicEligibilityV14.gs CompletePracticeUI.gs .github/workflows/focused-practice-contract.yml .github/workflows/cache-compat-contract.yml .github/workflows/route-persistence-contract.yml
          git commit -m 'Use explicit academic practice whitelist'
          git push origin HEAD:agent/academic-practice-whitelist
