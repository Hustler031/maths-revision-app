name: Deploy Maths Revision to Apps Script

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.gs'
      - '**/*.html'
      - 'appsscript.json'
      - '.claspignore'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate server JavaScript syntax
        shell: bash
        run: |
          cat *.gs > /tmp/maths-server.js
          node --check /tmp/maths-server.js

      - name: Validate required backend contracts
        shell: bash
        run: |
          set -e
          SERVER="$(cat *.gs)"
          for token in chapter_random chapter_weak chapter_complete topic_random topic_weak topic_complete group_random group_weak group_complete selectGroupPractice_ majorTopicForQuestion_ selectCalculationTraining_ getDemandSets_ getScheduledPlan_ auditMathsRuntime_ questionId; do
            [[ "$SERVER" == *"$token"* ]] || { echo "Missing backend contract: $token"; exit 1; }
          done

      - name: Validate frontend contracts
        shell: bash
        run: |
          set -e
          FRONTEND="$(cat Index.html DemandUI.gs ChapterGroupsUI.gs)"
          for token in openChapterHub openTopicHub chapter_random chapter_weak chapter_complete topic_random topic_weak topic_complete openStudyGroup openMocksGroup group_random group_weak group_complete openDemandSetHub renderDiagram questionSizeClass questionId; do
            [[ "$FRONTEND" == *"$token"* ]] || { echo "Missing frontend contract: $token"; exit 1; }
          done
          grep -q 'viewport-fit=cover' Index.html || { echo 'Known-good viewport contract missing.'; exit 1; }
          grep -q 'width:min(820px,100%)' Index.html || { echo 'Known-good fixed mobile shell missing.'; exit 1; }
          if grep -q 'document.body.scrollHeight' Index.html; then
            echo 'Answer auto-scroll regression detected.'
            exit 1
          fi
          if grep -q 'MutationObserver' DemandUI.gs ChapterGroupsUI.gs; then
            echo 'Global DOM observer regression detected.'
            exit 1
          fi

      - name: Validate deployment secrets
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          test -n "$CLASPRC_JSON" || { echo 'Missing CLASPRC_JSON secret'; exit 1; }
          test -n "$CLASP_JSON" || { echo 'Missing CLASP_JSON secret'; exit 1; }
          test -n "$DEPLOYMENT_ID" || { echo 'Missing DEPLOYMENT_ID secret'; exit 1; }

      - name: Configure clasp authentication
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > .clasp.json

      - name: Push source to Apps Script
        run: npx --yes @google/clasp@3.3.0 push --force

      - name: Update existing web-app deployment
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          npx --yes @google/clasp@3.3.0 create-deployment \
            --deploymentId "$DEPLOYMENT_ID" \
            --description "GitHub $(git rev-parse --short HEAD)"
