name: Maths behavioral tests

on:
  pull_request:
    branches: [main]
    paths: ['**/*.gs','**/*.html','tests/**','package.json','.github/workflows/behavioral-tests.yml']
  push:
    branches: [main]
    paths: ['**/*.gs','**/*.html','tests/**','package.json','.github/workflows/behavioral-tests.yml']

jobs:
  behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.js
