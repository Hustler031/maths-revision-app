name: Validate Route Persistence

on:
  pull_request:
    branches: [main]
    paths:
      - 'CompletePracticeUI.gs'
      - 'MathsFinalizationUIV12.html'
      - 'scripts/normalize_index.py'
      - '.github/workflows/route-persistence-contract.yml'
  push:
    branches: [main]
    paths:
      - 'CompletePracticeUI.gs'
      - 'MathsFinalizationUIV12.html'
      - 'scripts/normalize_index.py'
      - '.github/workflows/route-persistence-contract.yml'

jobs:
  route-persistence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate route restoration contract
        shell: bash
        run: |
          set -e
          F=CompletePracticeUI.gs
          grep -Fq "ROUTE_KEY='maths-ui-route-v1'" "$F"
          grep -Fq "function saveRoute" "$F"
          grep -Fq "function restoreRoute" "$F"
          grep -Fq "server('resumeSession',r.sessionId)" "$F"
          grep -Fq "app.view='quiz'" "$F"
          grep -Fq "chapterVisibilityVersion||'')==='v14'" "$F"
          grep -Fq "type:'mockChapter'" "$F"
          grep -Fq "type:'conceptChapter'" "$F"
          grep -Fq "type:'newChapter'" "$F"
          grep -Fq "originalShowView" "$F"
          if grep -Fq "localStorage.setItem(ROUTE_KEY,JSON.stringify({questions:" "$F"; then echo 'Quiz payload must not be cached in route state'; exit 1; fi
          R=MathsFinalizationUIV12.html
          grep -Fq "MAX_WAIT=15000" "$R"
          grep -Fq "__firstRefreshGuard" "$R"
          grep -Fq "function preserveRoute" "$R"
          grep -Fq "if(!r)r=preserveRoute(saved)" "$R"
          grep -Fq "var isQuiz=r&&r.type==='quiz'" "$R"
          grep -Fq "guardActive=false}).catch(function(){guardActive=false})" "$R"
          grep -Fq "if(v==='home'&&guardActive)return" "$R"
          grep -Fq "if(guardActive)return" "$R"
          grep -Fq "document.addEventListener('DOMContentLoaded',installGuard" "$R"
          N=scripts/normalize_index.py
          grep -Fq "loading(false);showView('home')" "$N"
          grep -Fq "loading(false)}" "$N"
