name: Daily lifecycle contract
on:
  pull_request:
    paths:
      - 'Code.gs'
      - 'MathsDailyV12.gs'
      - 'MathsQuizUI.html'
      - 'DailyLifecycleFixUI.html'
      - '.github/workflows/daily-lifecycle-contract.yml'
  push:
    branches: [main]
    paths:
      - 'Code.gs'
      - 'MathsDailyV12.gs'
      - 'MathsQuizUI.html'
      - 'DailyLifecycleFixUI.html'
      - '.github/workflows/daily-lifecycle-contract.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Daily lifecycle protections
        run: |
          set -e
          grep -Fq "function mathsDailyEligibleV12_(){return mathsAcademicQuestionsV14_()}" MathsDailyV12.gs
          grep -Fq "if(normalizeLabel_(session.mode)==='daily')" Code.gs
          grep -Fq "mathsSessionAttemptCountV12_(id)" Code.gs
          grep -Fq "name==='recall'" MathsQuizUI.html
          grep -Fq "saveConfirmed" MathsQuizUI.html
          grep -Fq "unresolvedIndexes" MathsQuizUI.html
          grep -Fq "Q'+(target+1)+' was not saved" MathsQuizUI.html
          grep -Fq "Compatibility placeholder only" DailyLifecycleFixUI.html
