name: Daily lifecycle contract
on:
  pull_request:
    paths:
      - 'Code.gs'
      - 'MathsDailyV12.gs'
      - 'DailyLifecycleFixUI.html'
      - '.github/workflows/daily-lifecycle-contract.yml'
  push:
    branches: [main]
    paths:
      - 'Code.gs'
      - 'MathsDailyV12.gs'
      - 'DailyLifecycleFixUI.html'
      - '.github/workflows/daily-lifecycle-contract.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Daily lifecycle protections
        run: |
          set -e
          grep -Fq "function mathsDailyEligibleV12_(){return mathsAcademicQuestionsV14_()}" MathsDailyV12.gs
          grep -Fq "if(normalizeLabel_(session.mode)==='daily')" Code.gs
          grep -Fq "mathsSessionAttemptCountV12_(id)" Code.gs
          grep -Fq "dailyLifecycleFixUi_()" Code.gs
          grep -Fq "q._attemptSavePromise" DailyLifecycleFixUI.html
          grep -Fq "getSessionAttemptMapV3" DailyLifecycleFixUI.html
          grep -Fq "fn==='finishSession'&&r&&r.ok===false" DailyLifecycleFixUI.html
