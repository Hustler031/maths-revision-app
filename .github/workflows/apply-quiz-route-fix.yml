name: Apply quiz first-refresh route fix

on:
  push:
    branches: [agent/fix-quiz-first-refresh-final3]
    paths:
      - '.github/workflows/apply-quiz-route-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-quiz-first-refresh-final3
      - name: Remove programmatic Home route overwrite
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('CompletePracticeUI.gs')
          s=p.read_text()
          old="var originalHome=window.home;if(originalHome)window.home=function(){explicitHome=true;saveRoute({type:'home'});return originalHome.apply(this,arguments)};\n"
          if old not in s:
              raise SystemExit('programmatic Home route wrapper not found')
          s=s.replace(old,'',1)
          p.write_text(s)

          p=Path('.github/workflows/route-persistence-contract.yml')
          s=p.read_text()
          marker="          grep -Fq \"originalShowView\" \"$F\"\n"
          guard="          if grep -Fq \"var originalHome=window.home\" \"$F\"; then echo 'Programmatic home must never overwrite a saved route'; exit 1; fi\n"
          if guard not in s:
              if marker not in s: raise SystemExit('route contract marker missing')
              s=s.replace(marker,marker+guard,1)
          p.write_text(s)
          PY
          git config user.name 'maths-revision-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add CompletePracticeUI.gs .github/workflows/route-persistence-contract.yml
          git commit -m 'Preserve quiz route on first refresh'
          git push origin HEAD:agent/fix-quiz-first-refresh-final3
