name: Maths integrity contracts

on:
  push:
    branches: ['**']
    paths:
      - '*.gs'
      - '*.html'
      - '.github/workflows/integrity-contract.yml'
  pull_request:
    paths:
      - '*.gs'
      - '*.html'
      - '.github/workflows/integrity-contract.yml'

jobs:
  integrity-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify invariant contracts
        shell: python
        run: |
          from pathlib import Path
          def text(p): return Path(p).read_text(encoding='utf-8')
          academic=text('MathsAcademicEligibilityV14.gs')
          concepts=text('ConceptHierarchyV16.gs')
          mocks=text('MathsMocksV10.gs')
          integ=text('MathsIntegrityV18.gs')
          cold=text('MathsColdStartRepairUI.html')
          quiz=text('MathsQuizLifecycleV15.gs')
          loader=text('DailyLifecycleFixLoader.gs')
          complete=text('CompletePracticeUI.gs')
          calc=text('CalculationSpeedV19.gs')
          calcui=text('CalculationSpeedUI.html')
          seed=text('CalculationPdfSeedV19.gs')
          core=text('Code.gs')
          data=text('Data.gs')
          progress=text('MathsProgressSnapshotV10.gs')
          progress_setup=progress.split('function ensureMathsProgressSnapshotV10_(){',1)[1]
          finalui=text('MathsFinalizationUIV12.html')
          checks={
            'academic positive inclusion': "if(bank!=='academic')return false" in academic,
            'academic leakage audit': all(x in academic for x in ['practiceBankLeak','mockLeak','calculationLeak','conceptLeak']),
            'concept hierarchy nested': all(x in concepts for x in ['mathsConceptIdsV16_','mathsConceptPoolV16_','nested:','topics:topics']),
            'mock demand set isolation': all(x in mocks for x in ["MATHS_MOCK_SET_ID_V10='MOCK_QUESTIONS'",'getDemandSetById_','active_(q)']),
            'canonical Question schema': all(x in integ for x in ["'Practice_Bank'","'Answer_Mode'","'Correct_Option'"]),
            'canonical State schema': "'Difficult'" in integ,
            'canonical Attempts schema': "'Variant_Type'" in integ,
            'canonical Sessions schema': "'Rendered_Questions_JSON'" in integ,
            'external fingerprint': all(x in integ for x in ['mathsVisibleDataFingerprintV18_','MATHS_VISIBLE_DATA_FINGERPRINT_V18','bumpMathsVersionV9_']),
            'concept registry guard': all(x in integ for x in ['mathsConceptRegistryReconcileV18_','addedDedicated','preservedSavedAcademic','conceptQuestionMissingRegistry']),
            'saved academic concepts preserved': 'if(q&&active_(q))return' in integ,
            'demand reference audit': all(x in integ for x in ['duplicateIds','missingIds','wrongCollectionIds','MOCK_FORMULA_REVISION']),
            'MFR reveal guard': "bank==='MOCK_FORMULA_REVISION'&&mode!=='REVEAL'" in integ,
            'template MCQ allowance': 'mathsHasStoredOptionsV18_' in integ,
            'safe resume policy': all(x in integ for x in ['mathsResumeCandidateV18_','MATHS_RESUME_MAX_AGE_MS','getMathsResumePolicyV18']),
            'stale sessions non-destructive': all(x in integ for x in ['orphanStaleSessions','orphanResumableSessions']),
            'single foreground startup owner': all(x not in cold for x in ['getMathsStartupPayloadV18','requestStartup','MutationObserver']) and "MATHS_COLD_START_REPAIR_VERSION='v21-post-render-sync'" in cold,
            'post-render external reconcile': all(x in cold for x in ['MIN_SYNC_GAP=60000','syncMathsExternalDataV18','refreshMathsHomeCacheSilent','setTimeout(function(){syncExternal(false)},5000)']),
            'cold layer does not control first paint': 'loading(' not in cold and 'showLoadingShell' not in cold and 'startupAttempts' not in cold,
            'external sync refreshes current home only': all(x in cold for x in ['refreshVisibleHome','currentView()===\'home\'','refreshResumePolicy']),
            'home refresh stays cache-only': 'if(app.view===\'home\')renderHome(d);return d' not in complete and 'refreshMathsHomeCacheSilent' in complete,
            'no hard browser reload': 'location.reload()' not in finalui and 'refreshDaySilently' in finalui,
            'all-session completion gated': "Finish after every question is durably saved." in core and "normalizeLabel_(session.mode)==='daily'" not in core,
            'attempt context persisted': all(x in quiz for x in ['variant_type:v.variantType','selected_option:v.selectedOption','question_index:v.index','client_attempt_key:v.clientAttemptKey']),
            'attempt context validated': all(x in quiz for x in ['mathsRequireQuestionContextV20_','Selected option is not valid','Recall result does not match the selected option']),
            'new content timestamps': all(x in integ for x in ['mathsContentTimestampReconcileV20_',"'Added_At'",'MATHS_CONTENT_TIMESTAMPS_V20']),
            'cold repair served without schema boot check': 'MathsColdStartRepairUI' in loader and 'ensureMathsCanonicalSchemaV18_' not in loader,
            'formula revision injected once': 'FormulaRevisionUI' not in loader and "createHtmlOutputFromFile('FormulaRevisionUI')" in complete,
            'doGet has no spreadsheet infrastructure pass': 'function doGet(){let html=' in core and 'function doGet(){ensureMathsInfrastructure_' not in core,
            'legacy base bootstrap suppressed': "html=html.replace(/init\\(\\);" in core and "'applyTheme();\\n</script>\\n</body>'" in core,
            'request-scoped sheet read cache': all(x in data for x in ['MATHS_READ_CONTEXT_','mathsWithReadContext_','MATHS_READ_CONTEXT_.values','mathsInvalidateSheetReadCache_']),
            'V14 bootstrap bypasses redundant V9 V11 chain': all(x in academic for x in ['dashboard:mathsDashboardV9_()','chapters:mathsChaptersV14_()','library:mathsLibraryCountsV9_()']) and 'getAppBootstrapV11()' not in academic,
            'V14 startup uses request read context': 'function getAppBootstrapV14(){\n  return mathsWithReadContext_' in academic and 'function getMathsHomeV14(){\n  return mathsWithReadContext_' in academic,
            'progress trigger setup short-circuits before sheet read': progress_setup.index("if(props.getProperty('MATHS_PROGRESS_TRIGGER_READY')==='1')return") < progress_setup.index('const sh=mathsProgressSheetV10_()'),
            'existing V14 startup assembly retained': all(x in complete for x in ['getAppBootstrapV14','getMathsHomeV14','CACHE_SCHEMA']),
            'calculation drills classified before memory': calc.index("if(ct==='drill'") < calc.index("if(ch==='calculation memory'"),
            'calculation recall thresholds': all(x in calc for x in ["skill==='squares'","n>=17","skill==='cubes'","n>=10","n>=12&&n<=19","m>=6&&m<=12","n>=21&&n<=29","m>=3&&m<=12"]),
            'calculation hub has no seed write': 'function calcSpeedHubV19(){const pool=' in calc and 'ensureCalculationPdfV19_();const pool' not in calc,
            'calculation cached-first v21': all(x in calcui for x in ["CACHE_KEY='maths-calc-speed-v21:hub'","CACHE_SCHEMA='calc-speed-v21-cache1'",'refreshHubInBackground','render(c.data)']),
            'rapid recall memory-only': "if(mode==='recall'&&!req.type)req.type='MEMORY'" in calc,
            'stale calc refresh has no visual rerender': 'function refreshHubInBackground(){return gas(\'hub\').then(writeCache)' in calcui,
            'future table seed exact': all(x in seed for x in ['tableRange(12,19,6,12)','tableRange(21,29,3,12)','tableRange(30,30,1,5)','tableRange(31,40,1,3)']),
            'future square cube seed exact': all(x in seed for x in ['for(let n=17;n<=25;n++)','for(let n=10;n<=11;n++)']),
          }
          failed=[k for k,v in checks.items() if not v]
          for k,v in checks.items(): print(('PASS' if v else 'FAIL')+': '+k)
          if failed: raise SystemExit('Failed: '+', '.join(failed))
      - name: Check repaired frontend syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for name,out in [('MathsColdStartRepairUI.html','/tmp/maths-cold.js'),('CalculationSpeedUI.html','/tmp/maths-calc.js')]:
              s=Path(name).read_text(encoding='utf-8')
              scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s,re.I)
              assert len(scripts)==1
              Path(out).write_text(scripts[0],encoding='utf-8')
          PY
          node --check /tmp/maths-cold.js
          node --check /tmp/maths-calc.js
