<style>
.mm-summary{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:13px;margin:12px 0}.mm-summary-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-top:10px}.mm-stat{text-align:center;min-width:0}.mm-stat b{display:block;font-size:15px;line-height:1.15}.mm-stat span{display:block;font-size:8.5px;color:var(--muted);margin-top:3px;white-space:nowrap}.mm-progress{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin:10px 0 5px}.mm-progress i{display:block;height:100%;background:var(--ma-green,#72d994);border-radius:999px}.mm-break{margin-top:13px;border:1px solid var(--line);border-radius:15px;background:var(--card);overflow:hidden}.mm-break-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 13px;cursor:pointer}.mm-break-head b{font-size:15px}.mm-break-body{padding:0 9px 9px;display:none}.mm-break.open .mm-break-body{display:grid;gap:7px}.mm-chapter{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 11px;cursor:pointer}.mm-chapter-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;font-weight:850}.mm-meta{font-size:10.5px;color:var(--muted);line-height:1.4;margin-top:5px}.mm-meta .wrong{color:var(--ma-red,#ff858c)}.mm-meta .diff{color:var(--ma-purple,#a990ff)}.mm-meta .star{color:var(--ma-amber,#e8bd66)}.mm-q-list{display:grid;gap:7px;margin-top:10px}.mm-q{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:10px 11px;cursor:pointer}.mm-q-title{font-size:13px;font-weight:750;line-height:1.35}.mm-q-tags{font-size:10px;color:var(--muted);margin-top:5px}.mm-q-tags .wrong{color:var(--ma-red,#ff858c);font-weight:800}.mm-q-tags .diff{color:var(--ma-purple,#a990ff);font-weight:800}.mm-q-tags .star{color:var(--ma-amber,#e8bd66);font-weight:800}.mm-actions-shell{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:10px;margin:12px 0}.mm-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.mm-action{min-height:44px;border:1px solid color-mix(in srgb,var(--primary) 23%,var(--line));border-radius:12px;background:color-mix(in srgb,var(--primary) 7%,var(--card));color:var(--primary);font-size:11.5px;font-weight:850;padding:7px 4px}.mm-action.starred{color:var(--ma-amber,#e8bd66)}.mm-action.difficult{color:var(--ma-purple,#a990ff)}
@media(max-width:390px){.mm-stat b{font-size:13px}.mm-stat span{font-size:7.5px}.mm-action{font-size:10.5px;min-height:43px}.mm-meta{font-size:10px}}
</style>
<script>
(function(){
'use strict';
var KEY='maths-mocks-v10:hub',FRESH=5*60*1000,hub=null,currentChapter='',questions=[];
function q(s,r){return (r||document).querySelector(s)}function qa(s,r){return Array.from((r||document).querySelectorAll(s))}
function e(v){return typeof esc==='function'?esc(v):String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function gas(name,a,b){return new Promise(function(ok,bad){var r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(x){bad(new Error(x&&x.message?x.message:String(x)))});if(name==='hub')r.getMathsMocksHubV10();else if(name==='questions')r.getMathsMockQuestionsV10(a||'');else if(name==='quiz')r.startMathsMockPracticeV10(a||{});else bad(new Error('Unknown mocks endpoint'))})}
function setLoading(on,label){var x=q('#loading');if(on&&x)x.setAttribute('data-label',label||'Loading mocks…');if(typeof loading==='function')loading(on);if(!on&&x)x.removeAttribute('data-label')}
function toastM(s){if(typeof toast==='function')toast(String(s||''))}
function setView(){try{app.view='mocks'}catch(x){}qa('#nav button').forEach(function(b){b.classList.toggle('active',b.dataset.view==='chapters')});q('#nav')&&q('#nav').classList.remove('hidden')}
function main(html){var m=q('#main');if(m)m.innerHTML=html;q('#nav')&&q('#nav').classList.remove('hidden')}
function strip(m){q('#maStrip')&&q('#maStrip').remove();if(!m)return;var top=q('.topbar');if(!top)return;var x=document.createElement('div');x.id='maStrip';x.className='ma-strip-host';x.innerHTML='<div class="ma-strip"><div class="ma-pill coverage">Coverage '+Number(m.coverage||0)+'%</div><div class="ma-pill wrong">✕ '+Number(m.wrong||0)+' Wrong</div><div class="ma-pill difficult">◆ '+Number(m.difficult||0)+'</div><div class="ma-pill starred">☆ '+Number(m.starred||0)+'</div></div>';top.insertAdjacentElement('afterend',x)}
function actions(){return '<div class="mm-actions"><button class="mm-action" data-mm-act="all">Practice All</button><button class="mm-action" data-mm-act="new">New</button><button class="mm-action" data-mm-act="weak">Weak</button><button class="mm-action starred" data-mm-act="starred">Starred</button><button class="mm-action difficult" data-mm-act="difficult">◆ Difficult</button><button class="mm-action" data-mm-act="random">Random</button></div>'}
function summary(m){m=m||{};return '<div class="mm-summary"><div class="mm-summary-grid"><div class="mm-stat"><b>'+Number(m.total||0)+'</b><span>Total Q</span></div><div class="mm-stat"><b>'+Number(m.attempted||0)+'</b><span>Attempted</span></div><div class="mm-stat"><b class="ma-red">✕ '+Number(m.wrong||0)+'</b><span>Wrong</span></div><div class="mm-stat"><b class="ma-purple">◆ '+Number(m.difficult||0)+'</b><span>Difficult</span></div><div class="mm-stat"><b class="ma-amber">☆ '+Number(m.starred||0)+'</b><span>Starred</span></div></div><div class="mm-progress"><i style="width:'+Number(m.coverage||0)+'%"></i></div><div class="ma-row-sub">'+Number(m.attempted||0)+' / '+Number(m.total||0)+' encountered · '+Number(m.unseen||0)+' left</div></div>'}
function picker(req,label){var m=q('#modal');m.className='modal';m.innerHTML='<div class="sheet"><div class="row between"><div><div class="eyebrow">'+e(label)+'</div><div class="quiz-title">How many questions?</div></div><button class="iconbtn" id="mmX">×</button></div><div class="mm-actions" style="margin-top:14px"><button class="mm-action" data-mm-n="10">10</button><button class="mm-action" data-mm-n="20">20</button><button class="mm-action" data-mm-n="25">25</button></div></div>';q('#mmX').onclick=closeModal;m.onclick=function(ev){if(ev.target===m)closeModal()};qa('[data-mm-n]',m).forEach(function(b){b.onclick=function(){closeModal();req.count=Number(b.dataset.mmN);run(req,label)}})}
function run(req,label){setLoading(true,'Loading '+label+'…');strip(null);gas('quiz',req).then(function(s){setLoading(false);if(!s||s.ok===false)return toastM(s&&s.message||'No eligible mock questions');if(typeof openQuiz==='function')openQuiz(s)}).catch(function(x){setLoading(false);toastM(x.message)})}
function bind(root,chapter){qa('[data-mm-act]',root).forEach(function(b){b.onclick=function(ev){ev.stopPropagation();var kind=b.dataset.mmAct,req={kind:kind,chapter:chapter||''};if(kind==='all')return run(req,'Practice All');picker(req,b.textContent.trim())}})}
function saveCache(d){hub=d;try{localStorage.setItem(KEY,JSON.stringify({ts:Date.now(),version:d.version||'',data:d}))}catch(x){}}
function readCache(){try{var x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&Date.now()-Number(x.ts||0)<=24*60*60*1000)return x}catch(y){}return null}
function breakdown(rows){return '<div class="mm-break" id="mmBreak"><div class="mm-break-head" id="mmBreakHead"><div><b>Chapter breakdown</b><div class="ma-row-sub">Weakest chapters shown first</div></div><span id="mmChevron">▾</span></div><div class="mm-break-body">'+(rows||[]).map(function(c){var m=c.metric||{};return '<div class="mm-chapter" data-mm-ch="'+e(c.chapter)+'"><div class="mm-chapter-title"><span>'+e(c.chapter)+'</span><span class="ma-chip">'+Number(m.total||0)+' Q</span></div><div class="mm-progress"><i style="width:'+Number(m.coverage||0)+'%"></i></div><div class="mm-meta">'+Number(m.attempted||0)+' attempted · <span class="wrong">✕ '+Number(m.wrong||0)+' ('+Number(m.wrongPct||0)+'%)</span> · <span class="diff">◆ '+Number(m.difficult||0)+'</span> · <span class="star">☆ '+Number(m.starred||0)+'</span> · '+Number(m.unseen||0)+' left</div></div>'}).join('')+'</div></div>'}
function renderHub(d){setView();hub=d||{overall:{},chapters:[]};strip(hub.overall);main('<div class="ma-page"><button class="btn ghost ma-back" id="mmBack">← Practice Hub</button><div class="ma-kicker">Mocks</div><div class="ma-title">Mock Questions</div><div class="ma-sub">See where mock questions are costing marks, then practise only that scope.</div>'+summary(hub.overall)+'<div class="mm-actions-shell">'+actions()+'</div>'+breakdown(hub.chapters)+'</div>');q('#mmBack').onclick=function(){strip(null);window.chapters&&window.chapters()};bind(q('#main'),'');q('#mmBreakHead').onclick=function(){var x=q('#mmBreak');x.classList.toggle('open');q('#mmChevron').textContent=x.classList.contains('open')?'▴':'▾'};qa('[data-mm-ch]').forEach(function(x){x.onclick=function(){openChapter(x.dataset.mmCh)}})}
function openMocks(){setView();var c=readCache();if(c){renderHub(c.data);if(Date.now()-Number(c.ts||0)<=FRESH)return gas('hub').then(function(d){if(String(d.version||'')!==String(c.version||'')){saveCache(d);if(app.view==='mocks'&&!currentChapter)renderHub(d)}}).catch(function(){})}main('<div class="ma-loading-shell"><div class="ma-loading-card"></div></div>');gas('hub').then(function(d){saveCache(d);if(app.view==='mocks')renderHub(d)}).catch(function(x){toastM(x.message)})}
function qStatus(x){var out=[];if(!Number(x.attempts||0))out.push('Unseen');else if(x.wrong)out.push('<span class="wrong">✕ Wrong</span>');else out.push('✓ Correct');if(x.difficult)out.push('<span class="diff">◆ Difficult</span>');if(x.starred)out.push('<span class="star">☆ Starred</span>');if(Number(x.attempts||0))out.push(Number(x.attempts)+' attempt'+(Number(x.attempts)===1?'':'s'));return out.join(' · ')}
function openChapter(name){currentChapter=String(name||'');setView();var row=(hub&&hub.chapters||[]).find(function(x){return String(x.chapter)===currentChapter}),metric=row&&row.metric||{};strip(metric);main('<div class="ma-page"><button class="btn ghost ma-back" id="mmChapterBack">← Mocks</button><div class="ma-kicker">Mocks</div><div class="ma-title">'+e(currentChapter)+'</div><div class="ma-sub">'+Number(metric.total||0)+' mock questions · inspect the exact questions or start focused practice.</div>'+summary(metric)+'<div class="mm-actions-shell">'+actions()+'</div><div class="ma-section">Questions</div><div id="mmQuestions" class="mm-q-list"><div class="ma-row-sub">Loading questions…</div></div></div>');q('#mmChapterBack').onclick=function(){currentChapter='';renderHub(hub)};bind(q('#main'),currentChapter);gas('questions',currentChapter).then(function(list){questions=list||[];var host=q('#mmQuestions');if(!host)return;host.innerHTML=questions.map(function(x,i){return '<div class="mm-q" data-mm-q="'+i+'"><div class="mm-q-title">'+(i+1)+'. '+e(x.prompt)+'</div><div class="mm-q-tags">'+qStatus(x)+'</div></div>'}).join('')||'<div class="ma-row-sub">No questions found.</div>';qa('[data-mm-q]',host).forEach(function(r){r.onclick=function(){detail(Number(r.dataset.mmQ))}})}).catch(function(x){var host=q('#mmQuestions');if(host)host.innerHTML='<div class="ma-row-sub">'+e(x.message)+'</div>'})}
function detail(i){var x=questions[i];if(!x)return;var opts=(x.options||[]).map(function(o){return '<div style="padding:7px 0"><b>'+e(o.key)+'.</b> '+e(o.text)+'</div>'}).join(''),m=q('#modal');m.className='modal';m.innerHTML='<div class="sheet"><div class="row between"><div><div class="eyebrow">Read-only mock question</div><div class="quiz-title">'+e(x.chapter||'Mock Question')+'</div></div><button class="iconbtn" id="mmDetailX">×</button></div><div style="font-size:16px;font-weight:800;line-height:1.45;margin-top:12px">'+e(x.prompt)+'</div>'+(opts?'<div style="margin-top:8px">'+opts+'</div>':'')+'<div class="answer-body" style="margin-top:13px"><b>Answer:</b> '+e(x.answer||x.correctOption||'')+'</div>'+(x.explanation?'<div class="answer-body" style="margin-top:10px"><b>Explanation</b><br>'+e(x.explanation)+'</div>':'')+(x.memoryCue?'<div class="answer-body" style="margin-top:10px"><b>Memory cue</b><br>'+e(x.memoryCue)+'</div>':'')+(x.sourceFile?'<div class="ma-row-sub" style="margin-top:12px">Source: '+e(x.sourceFile)+(x.sourcePage?' · p. '+e(x.sourcePage):'')+'</div>':'')+'</div>';q('#mmDetailX').onclick=closeModal;m.onclick=function(ev){if(ev.target===m)closeModal()}}
var previousOpen=window.openStudyGroup;window.openStudyGroup=function(key){if(String(key)==='mocks')return openMocks();return previousOpen?previousOpen(key):undefined};
document.addEventListener('click',function(ev){var x=ev.target.closest&&ev.target.closest('[data-ma-group="mocks"]');if(!x)return;ev.preventDefault();ev.stopImmediatePropagation();openMocks()},true);
window.addEventListener('maths:data-changed',function(){try{localStorage.removeItem(KEY)}catch(x){};hub=null});
window.openMathsMocksV10=openMocks;
})();
</script>
