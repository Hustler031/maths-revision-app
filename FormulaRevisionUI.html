<script>(function(){var KEY='maths-formula-revision-v22',FRESH=5*60*1000,hub=null;function q(s){return document.querySelector(s)}function e(v){return typeof esc==='function'?esc(v):String(v||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function gas(n,a){return new Promise(function(ok,bad){var r=google.script.run.withSuccessHandler(ok).withFailureHandler(bad);if(n==='hub')r.getFormulaRevisionHubV22();else r.startFormulaRevisionV22(a||{})})}function cache(d){try{localStorage.setItem(KEY,JSON.stringify({ts:Date.now(),data:d}))}catch(_){}hub=d}function read(){try{var x=JSON.parse(localStorage.getItem(KEY)||'null');return x&&Date.now()-x.ts<24*60*60*1000?x:null}catch(_){return null}}function load(req,label){if(typeof loading==='function')loading(true);gas('start',req).then(function(x){if(typeof loading==='function')loading(false);if(x&&x.ok!==false)openQuiz(x);else if(typeof toast==='function')toast(x&&x.message||'No formula questions')}).catch(function(x){if(typeof loading==='function')loading(false);if(typeof toast==='function')toast(x.message||String(x))})}function metric(m){return '<div class="mm-meta">'+m.total+' Q · '+m.due+' due · <span class="wrong">✕ '+m.weak+' weak</span> · <span class="diff">◆ '+m.difficult+'</span> · <span class="star">☆ '+m.starred+'</span></div>'}function render(d){hub=d;app.view='formula_revision';if(typeof nav==='function')nav('ondemand');var h='<div class="ma-page"><button class="btn ghost" id="frBack">← On Demand</button><div class="ma-kicker">On Demand</div><div class="ma-title">Formula Revision</div><div class="ma-sub">Choose the exact chapter and revision type before starting a quiz.</div><div class="mm-actions-shell"><div class="mm-actions"><button class="mm-action" data-fr-kind="all">All Formulas</button><button class="mm-action" data-fr-kind="due">Due</button><button class="mm-action" data-fr-kind="weak">Weak</button><button class="mm-action starred" data-fr-kind="starred">☆ Starred</button><button class="mm-action difficult" data-fr-kind="difficult">◆ Difficult</button></div></div><div class="mm-break open" id="frBreak"><div class="mm-break-head" id="frHead"><b>Chapter-wise revision</b><span id="frChev">▴</span></div><div class="mm-break-body">'+(d.chapters||[]).map(function(c){return '<div class="mm-chapter"><div class="mm-chapter-title"><span>'+e(c.chapter)+'</span><span class="ma-chip">'+c.metric.total+' Q</span></div>'+metric(c.metric)+'<div class="mm-actions" style="margin-top:8px"><button class="mm-action" data-fr-ch="'+e(c.chapter)+'" data-fr-kind="due">Due</button><button class="mm-action" data-fr-ch="'+e(c.chapter)+'" data-fr-kind="weak">Weak</button><button class="mm-action starred" data-fr-ch="'+e(c.chapter)+'" data-fr-kind="starred">☆ Starred</button><button class="mm-action difficult" data-fr-ch="'+e(c.chapter)+'" data-fr-kind="difficult">◆ Difficult</button></div></div>'}).join('')+'</div></div></div>';q('#main').innerHTML=h;q('#frBack').onclick=function(){showView('ondemand')};q('#frHead').onclick=function(){var x=q('#frBreak');x.classList.toggle('open');q('#frChev').textContent=x.classList.contains('open')?'▴':'▾'};q('#main').querySelectorAll('[data-fr-kind]').forEach(function(b){b.onclick=function(ev){ev.stopPropagation();load({kind:b.dataset.frKind,chapter:b.dataset.frCh||'',count:20},'Formula Revision')}});window.scrollTo(0,0)}function open(){var c=read();if(c){render(c.data);gas('hub').then(function(d){cache(d);if(app.view==='formula_revision')render(d)}).catch(function(){});return}if(typeof loading==='function')loading(true);gas('hub').then(function(d){if(typeof loading==='function')loading(false);cache(d);render(d)}).catch(function(x){if(typeof loading==='function')loading(false);if(typeof toast==='function')toast(x.message||String(x))})}var old=window.ondemand;window.ondemand=function(){var r=old&&old.apply(this,arguments);setTimeout(function(){if(!q('#frCard')){var c=document.createElement('div');c.id='frCard';c.className='v3-card';c.innerHTML='<div class="eyebrow">Formula Revision</div><div class="muted" style="font-size:12px">Chapter-wise due, weak, starred and difficult practice</div><button class="btn soft" style="margin-top:9px">Open full revision page</button>';c.querySelector('button').onclick=open;q('#main .content')&&q('#main .content').appendChild(c)}},0);return r};window.openFormulaRevisionV22=open;window.prefetchFormulaRevisionV22=function(){var c=read();if(c)return Promise.resolve(c.data);return gas('hub').then(function(d){cache(d);return d}).catch(function(){})}})();</script>
<style>.mm-chapter .mm-actions{display:none!important}</style><script>(function(){var old=window.openFormulaRevisionV22;window.openFormulaRevisionV22=function(){var r=old.apply(this,arguments);setTimeout(function(){var a=document.querySelector('.ma-page>.mm-actions-shell .mm-actions');if(a&&!a.querySelector('[data-fr-new]')){var b=document.createElement('button');b.className='mm-action';b.dataset.frKind='new';b.dataset.frNew='1';b.textContent='New';b.onclick=function(){if(typeof loading==='function')loading(true);google.script.run.withSuccessHandler(function(x){if(typeof loading==='function')loading(false);if(x&&x.ok!==false)openQuiz(x);else if(typeof toast==='function')toast(x&&x.message||'No new formula questions')}).withFailureHandler(function(x){if(typeof loading==='function')loading(false);if(typeof toast==='function')toast(x.message||String(x))}).startFormulaRevisionV22({kind:'new',count:20})};a.appendChild(b)}},0);return r}})();</script>
