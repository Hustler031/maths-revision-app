<style>
/* V6 consolidation: minimal analytics, compact actions, cached-first pages. */
.v6-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin:8px 0 10px}.v6-pill{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:7px 4px;text-align:center;font-size:9px;white-space:nowrap}.v6-pill b{color:var(--text);font-size:11px;margin-left:2px}.v6-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.v6-actions .btn{min-height:40px;padding:7px 4px;font-size:10px}.v6-module-panel{border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--card);margin:9px 0 12px}.v6-progress-card{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card)}.v6-progressbar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}.v6-progressbar i{display:block;height:100%;background:var(--ok);border-radius:99px}.v6-overall{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.v6-overall>div{text-align:center;border:1px solid var(--line);border-radius:11px;padding:8px 2px;background:var(--card)}.v6-overall b{display:block;font-size:14px}.v6-overall span{font-size:8px;color:var(--muted)}.v6-line{font-size:10px;color:var(--muted);line-height:1.45}.v6-line b{color:var(--text)}.v6-chapter{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card)}.v6-chapter-title{display:flex;align-items:center;justify-content:space-between;gap:8px}.v6-chapter-title b{font-size:15px}.v6-qcount{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 8px}.v6-history{border-top:1px solid var(--line)}.v6-history-row{border-bottom:1px solid var(--line)}.v6-history-head{padding:12px 2px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}.v6-history-body{padding:0 0 12px}.v6-read-list{display:grid;gap:7px;margin-top:10px}.v6-read-item{border:1px solid var(--line);border-radius:11px;padding:9px;background:var(--card);cursor:pointer}.v6-toolbar-concept-active{background:var(--okbg)!important;color:var(--ok)!important;border-color:var(--ok)!important}
/* Neutralize old coloured analytics and oversized action blocks when they survive underneath V6. */
.v4-pill,.v5-pill{background:transparent!important;color:var(--muted)!important;border-color:var(--line)!important}.v4-pill b,.v5-pill b{color:var(--text)!important}.v3-actions,.v4-actions{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:7px!important}.v3-actions .btn,.v4-actions .btn{min-height:40px!important;padding:7px 4px!important;font-size:10px!important}.v3-card:has(.v3-actions),.v3-card:has(.v4-actions){padding:10px!important}.v4-scope-count{display:none!important}
@media(max-width:390px){.v6-pill{font-size:8px;padding:6px 2px}.v6-pill b{font-size:10px}.v6-actions .btn{font-size:9px}.v6-overall b{font-size:13px}.v6-overall span{font-size:7px}}
</style>
<script>
(function(){
'use strict';
var base={home:window.home,chapter:window.openChapterHub,topic:window.openTopicHub,group:window.openStudyGroup,demand:window.startDemandSet,calc:window.openCalculationHub,render:window.renderQuestion,concepts:window.openConceptsV4,star:window.openStarredRevisionV3,newPage:window.openGlobalNewV3};
var CACHE='maths-v6:';
function getCache(k){try{return JSON.parse(localStorage.getItem(CACHE+k)||'null')}catch(e){return null}}
function setCache(k,v){try{localStorage.setItem(CACHE+k,JSON.stringify(v))}catch(e){}return v}
function dropCache(k){try{localStorage.removeItem(CACHE+k)}catch(e){}}
function api(fn,a,b){return new Promise(function(ok,bad){var r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){bad(new Error(e&&e.message?e.message:String(e)))});if(fn==='snapshot')r.getMathsSnapshotV6(false);else if(fn==='scope')r.getMathsScopeMetricV6(a||{});else if(fn==='new')r.getMathsNewHubV6();else if(fn==='star')r.getStarredRevisionV6();else if(fn==='concepts')r.getConceptsHubV6();else if(fn==='view')r.getMathsViewItemsV4(a||{});else if(fn==='quiz')r.startMathsV6Quiz(a||{});else if(fn==='conceptToggle')r.toggleConceptV6(a,b);else if(fn==='starToggle')r.toggleStarredV6(a,b);else if(fn==='diffToggle')r.toggleDifficultV6(a,b);else bad(new Error('Unknown V6 call'))})}
function strip(m){m=m||{};return '<div class="v6-strip"><div class="v6-pill">Coverage <b>'+Number(m.coverage||0)+'%</b></div><div class="v6-pill">✕ Wrong <b>'+Number(m.wrong||0)+'</b></div><div class="v6-pill">◆ Difficult <b>'+Number(m.difficult||0)+'</b></div><div class="v6-pill">☆ Starred <b>'+Number(m.starred||0)+'</b></div></div>'}
function actions(prefix){prefix=prefix||'v6';return '<div class="v6-actions"><button class="btn ghost" data-'+prefix+'="all">Practice All</button><button class="btn ghost" data-'+prefix+'="new">New</button><button class="btn ghost" data-'+prefix+'="weak">Weak</button><button class="btn ghost" data-'+prefix+'="starred">Starred</button><button class="btn ghost" data-'+prefix+'="difficult">◆ Difficult</button><button class="btn ghost" data-'+prefix+'="random">Random</button></div>'}
function revisionActions(prefix){return '<div class="v6-actions"><button class="btn ghost" data-'+prefix+'="view">View All</button><button class="btn ghost" data-'+prefix+'="all">Practice All</button><button class="btn ghost" data-'+prefix+'="new">New</button><button class="btn ghost" data-'+prefix+'="weak">Weak</button><button class="btn ghost" data-'+prefix+'="difficult">◆ Difficult</button><button class="btn ghost" data-'+prefix+'="random">Random</button></div>'}
function picker(req,label){var m=$('#modal');m.className='modal';m.innerHTML='<div class="sheet"><div class="row between"><div><div class="eyebrow">'+esc(label)+'</div><div class="quiz-title">How many questions?</div></div><button class="iconbtn" id="v6px">×</button></div><div class="v6-actions" style="margin-top:12px"><button class="btn ghost" data-n="10">10</button><button class="btn ghost" data-n="20">20</button><button class="btn ghost" data-n="25">25</button></div></div>';$('#v6px').onclick=closeModal;m.onclick=function(e){if(e.target===m)closeModal()};m.querySelectorAll('[data-n]').forEach(function(x){x.onclick=function(){closeModal();runQuiz(Object.assign({},req,{count:Number(x.dataset.n)}))}})}
function runQuiz(req){loading(true);api('quiz',req).then(function(s){loading(false);if(!s||s.ok===false)return toast((s&&s.message)||'No eligible questions');window.openQuiz(s)}).catch(function(e){loading(false);toast(e.message||String(e))})}
function bindActions(root,prefix,req){root.querySelectorAll('[data-'+prefix+']').forEach(function(b){b.onclick=function(e){e.stopPropagation();var k=b.getAttribute('data-'+prefix),r=Object.assign({},req,{kind:k});if(k==='all')runQuiz(r);else picker(r,(req.title||req.chapter||'Practice')+' · '+b.textContent.trim())}})}
function installScope(req){var main=$('#main'),content=main&&main.querySelector('.content');if(!content)return;main.querySelectorAll('.v5-scope-strip,.v4-strip-wrap').forEach(function(x){x.style.display='none'});var old=content.querySelector('.v6-scope');if(old)old.remove();var panel=content.querySelector('.v3-card:has(.v3-actions),.v3-card:has(.v4-actions),.v6-module-panel');if(panel){panel.className='v6-module-panel';panel.innerHTML='<div class="v6-scope">'+strip({})+'</div>'+actions('v6a');bindActions(panel,'v6a',req)}else{panel=document.createElement('div');panel.className='v6-module-panel';panel.innerHTML='<div class="v6-scope">'+strip({})+'</div>'+actions('v6a');var anchor=content.firstElementChild;if(anchor)anchor.insertAdjacentElement('afterend',panel);else content.appendChild(panel);bindActions(panel,'v6a',req)}api('scope',req).then(function(m){var s=panel.querySelector('.v6-scope');if(s)s.innerHTML=strip(m)}).catch(function(){})}
function groupReq(k){if(k==='mocks')return {scope:'demand_set',setId:'MOCK_QUESTIONS',title:'Mock Questions'};var list=(app.bootstrap.chapters||[]).filter(function(c){var x=String(c.chapter||'').toLowerCase(),g=/fraction pattern|triplet|calculation memory|square|cube/.test(x)?'misc':/percentage|profit|loss|discount|ratio|proportion|average|mixture|alligation|interest|time.*work|pipe|cistern|speed|distance|train|boat|stream|partnership|ages|work.*wage/.test(x)?'arithmetic':'advanced';return g===k});return {scope:'group',chapters:list.map(function(c){return c.chapter}),groupName:k,title:k==='advanced'?'Advanced':k==='arithmetic'?'Arithmetic':'MISC'}}
window.openChapterHub=function(ch){base.chapter(ch);setTimeout(function(){installScope({scope:'chapter',chapter:ch,title:ch})},0)};
window.openTopicHub=function(ch,t){base.topic(ch,t);setTimeout(function(){installScope({scope:'topic',chapter:ch,majorTopic:t,title:t})},0)};
window.openStudyGroup=function(k){base.group(k);setTimeout(function(){installScope(groupReq(k))},30)};
window.startDemandSet=function(id){base.demand(id);if(String(id)!=='CALC_TRAINING')setTimeout(function(){installScope({scope:'demand_set',setId:String(id),title:'Saved Set'})},20)};
window.openCalculationHub=function(id){base.calc(id);setTimeout(function(){installScope({scope:'demand_set',setId:String(id),title:'Calculation Training'})},20)};
function renderNew(d){if(app.view!=='new')return;var h='<div class="content"><button class="btn ghost" id="v6nb">← Home</button><div class="section-title">New Practice</div><div class="v6-module-panel">'+strip(d.overall)+actions('v6new')+'</div><div class="section-title">By Chapter</div><div class="list">'+(d.chapters||[]).map(function(c){return '<div class="v6-chapter v3-click" data-newch="'+esc(c.chapter)+'"><div class="v6-chapter-title"><b>'+esc(c.chapter)+'</b><span class="v6-qcount">'+Number(c.metric.total||0)+' Q</span></div><div class="v6-line">'+Number(c.metric.unseen||0)+' unseen · '+Number(c.metric.wrong||0)+' wrong · ◆ '+Number(c.metric.difficult||0)+' · ☆ '+Number(c.metric.starred||0)+'</div></div>'}).join('')+'</div></div>';$('#main').innerHTML=h;$('#v6nb').onclick=window.home;bindActions($('#main'),'v6new',{scope:'all',title:'All New Practice'});$('#main').querySelectorAll('[data-newch]').forEach(function(x){x.onclick=function(){var c=(d.chapters||[]).find(function(v){return v.chapter===x.dataset.newch})||{metric:{}};$('#main').innerHTML='<div class="content"><button class="btn ghost" id="v6ncb">← New Practice</button><div class="section-title">'+esc(x.dataset.newch)+'</div><div class="v6-module-panel">'+strip(c.metric)+actions('v6newch')+'</div></div>';$('#v6ncb').onclick=window.openGlobalNewV3;bindActions($('#main'),'v6newch',{scope:'chapter',chapter:x.dataset.newch,title:x.dataset.newch+' · New Practice'})}})}
window.openGlobalNewV3=function(){app.view='new';nav('home');var c=getCache('new');if(c)renderNew(c);api('new').then(function(d){setCache('new',d);renderNew(d)}).catch(function(e){if(!c)toast(e.message||String(e))})};
function openRead(req,title){loading(true);api('view',req).then(function(items){loading(false);var m=$('#modal');m.className='modal';m.innerHTML='<div class="sheet"><div class="row between"><div><div class="eyebrow">Read-only</div><div class="quiz-title">'+esc(title)+'</div></div><button class="iconbtn" id="v6rx">×</button></div><div class="v6-read-list">'+items.map(function(x){return '<div class="v6-read-item"><b>'+esc(x.chapter||'Maths')+'</b><div class="v6-line">'+esc(String(x.prompt||'').slice(0,180))+'</div></div>'}).join('')+'</div></div>';$('#v6rx').onclick=closeModal;m.onclick=function(e){if(e.target===m)closeModal()}}).catch(function(e){loading(false);toast(e.message||String(e))})}
function bindRevision(root,prefix,req,title){root.querySelectorAll('[data-'+prefix+']').forEach(function(b){b.onclick=function(e){e.stopPropagation();var k=b.getAttribute('data-'+prefix);if(k==='view')return openRead(req,title);var r=Object.assign({},req,{kind:k,title:title});if(k==='all')runQuiz(r);else picker(r,title+' · '+b.textContent.trim())}})}
function stat(s){s=s||{};return Number(s.starred||0)+' Starred · '+Number(s.mastered||0)+' Mastered · '+Number(s.focus||0)+' Focus'}
function histRow(title,s,lo,hi){return '<div class="v6-history-row"><div class="v6-history-head" data-range="'+lo+'-'+hi+'"><div><b>'+esc(title)+'</b><div class="v6-line">'+stat(s)+'</div></div><span>›</span></div><div class="v6-history-body hidden" data-body="'+lo+'-'+hi+'">'+revisionActions('v6rev')+'</div></div>'}
function renderStar(d,m){if(app.view!=='starred')return;var h='<div class="content"><button class="btn ghost" id="v6sb">← Home</button>'+strip(m||{})+'<div class="section-title">Starred Revision</div><div class="v6-module-panel"><b>All Starred Revision</b><div class="v6-line" style="margin:3px 0 9px">'+stat(d.stats)+'</div>'+revisionActions('v6top')+'</div><div class="section-title">Study history</div><div class="v6-history">';(d.recentDays||[]).forEach(function(x){h+=histRow('Day '+x.day,x.stats,x.day,x.day)});(d.tenBlocks||[]).forEach(function(x){h+=histRow('Days '+x.lo+'–'+x.hi,x.stats,x.lo,x.hi)});(d.months||[]).forEach(function(x){h+=histRow(x.label+' · Days '+x.lo+'–'+x.hi,x.stats,x.lo,x.hi)});h+='</div></div>';$('#main').innerHTML=h;$('#v6sb').onclick=window.home;bindRevision($('#main'),'v6top',{scope:'star_history',starLo:1,starHi:999999},'All Starred Revision');$('#main').querySelectorAll('[data-range]').forEach(function(x){x.onclick=function(){var p=x.dataset.range.split('-'),lo=Number(p[0]),hi=Number(p[1]),b=$('[data-body="'+lo+'-'+hi+'"]');b.classList.toggle('hidden');x.querySelector('span').textContent=b.classList.contains('hidden')?'›':'⌄';if(!b.classList.contains('hidden'))bindRevision(b,'v6rev',{scope:'star_history',starLo:lo,starHi:hi},lo===hi?'Day '+lo:'Days '+lo+'–'+hi)}})}
window.openStarredRevisionV3=function(){app.view='starred';nav('home');var c=getCache('starred');if(c)renderStar(c.data,c.metric);Promise.all([api('star'),api('scope',{scope:'star_history',starLo:1,starHi:999999})]).then(function(v){var x={data:v[0],metric:v[1]};setCache('starred',x);renderStar(x.data,x.metric)}).catch(function(e){if(!c)toast(e.message||String(e))})};
function renderConcepts(d){if(app.view!=='concepts')return;var h='<div class="content"><button class="btn ghost" id="v6cb">← Home</button>'+strip(d.metric||{})+'<div class="section-title">Concepts</div><div class="v6-module-panel"><div class="v6-line" style="margin-bottom:8px">Saved Question_ID references for concept revision</div>'+revisionActions('v6con')+'</div><div class="section-title">By Chapter</div><div class="list">'+(d.chapters||[]).map(function(c){return '<div class="v6-chapter"><div class="v6-chapter-title"><b>'+esc(c.chapter)+'</b><span class="v6-qcount">'+Number(c.metric.total||0)+' Q</span></div></div>'}).join('')+'</div></div>';$('#main').innerHTML=h;$('#v6cb').onclick=window.home;bindRevision($('#main'),'v6con',{scope:'concept_saved'},'Concepts')}
window.openConceptsV4=function(){app.view='concepts';nav('home');var c=getCache('concepts');if(c)renderConcepts(c);api('concepts').then(function(d){setCache('concepts',d);renderConcepts(d)}).catch(function(e){if(!c)toast(e.message||String(e))})};
function renderProgress(d){if(app.view!=='progress')return;var o=d.overall||{},h='<div class="content"><div class="section-title">Progress</div><div class="v6-overall"><div><b>'+Number(o.total||0)+'</b><span>Total Q</span></div><div><b>'+Number(o.attempted||0)+'</b><span>Encountered</span></div><div><b>✕ '+Number(o.wrong||0)+'</b><span>Wrong</span></div><div><b>◆ '+Number(o.difficult||0)+'</b><span>Difficult</span></div><div><b>☆ '+Number(o.starred||0)+'</b><span>Starred</span></div></div><div class="v6-progress-card" style="margin-top:9px">'+strip(o)+'<div class="v6-progressbar"><i style="width:'+Number(o.coverage||0)+'%"></i></div><div class="v6-line"><b>'+Number(o.attempted||0)+' / '+Number(o.total||0)+'</b> encountered · '+Number(o.unseen||0)+' left · Wrong '+Number(o.wrong||0)+' ('+Number(o.wrongPct||0)+'%) · ◆ '+Number(o.difficult||0)+' ('+Number(o.difficultPct||0)+'%) · ☆ '+Number(o.starred||0)+' ('+Number(o.starredPct||0)+'%)</div></div><div class="section-title">By Chapter</div><div class="list">';(d.chapters||[]).forEach(function(c){var m=c.metric||{};h+='<div class="v6-chapter"><div class="v6-chapter-title"><b>'+esc(c.chapter)+'</b><span class="v6-qcount">'+Number(m.total||0)+' Q</span></div><div class="v6-progressbar"><i style="width:'+Number(m.coverage||0)+'%"></i></div><div class="v6-line">✕ Wrong <b>'+Number(m.wrong||0)+'</b> · ◆ Difficult <b>'+Number(m.difficult||0)+'</b> · ☆ Starred <b>'+Number(m.starred||0)+'</b> · Left <b>'+Number(m.unseen||0)+'</b></div></div>'});h+='</div></div>';$('#main').innerHTML=h}
window.progress=function(){app.view='progress';nav('progress');var c=getCache('progress');if(c)renderProgress(c);api('snapshot').then(function(d){setCache('progress',d);renderProgress(d)}).catch(function(e){if(!c)toast(e.message||String(e))})};
/* Reversible Concept toggle and snapshot-aware optimistic flags. */
var oldRender=window.renderQuestion;window.renderQuestion=function(){oldRender();if(!app.quiz)return;var q=app.quiz.questions[app.quiz.index],cb=$('#v4conceptbtn'),sb=$('#v4starbtn'),db=$('#v4diffbtn');if(cb){cb.textContent=q.inConcept?'✓ Concept':'＋ Concept';cb.className='btn small '+(q.inConcept?'v6-toolbar-concept-active':'ghost');cb.onclick=function(){var before=!!q.inConcept;q.inConcept=!before;cb.textContent=q.inConcept?'✓ Concept':'＋ Concept';cb.className='btn small '+(q.inConcept?'v6-toolbar-concept-active':'ghost');dropCache('concepts');api('conceptToggle',q.questionId,app.quiz.sessionId).then(function(r){q.inConcept=!!r.inConcept}).catch(function(){q.inConcept=before;window.renderQuestion();toast('Concept update delayed')})}}if(sb){sb.onclick=function(){var before=!!(q.important||q.marked);q.important=!before;q.marked=!before;window.renderQuestion();dropCache('starred');dropCache('progress');api('starToggle',q.questionId,app.quiz.sessionId).then(function(r){q.important=!!r.important;q.marked=!!r.important}).catch(function(){q.important=before;q.marked=before;window.renderQuestion()})}}if(db){db.textContent=q.difficult?'◆ Difficult':'◇ Difficult';db.onclick=function(){var before=!!q.difficult;q.difficult=!before;window.renderQuestion();dropCache('progress');api('diffToggle',q.questionId,app.quiz.sessionId).then(function(r){q.difficult=!!r.difficult}).catch(function(){q.difficult=before;window.renderQuestion()})}}};
/* No blocking loader for normal refresh/navigation. Quiz generation still explicitly uses loading(true). */
window.refreshApp=function(){server('getAppBootstrap').then(function(d){app.bootstrap=d;showView(app.view)}).catch(function(e){toast(e.message||String(e))})};
var initial=$('#loading');if(initial)initial.classList.add('hidden');
})();
</script>
