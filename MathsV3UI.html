<script>
(function(){
'use strict';
var CACHE='maths-v3:';
var base={showView:window.showView,library:window.library,ondemand:window.ondemand,renderQuestion:window.renderQuestion,saveAndHome:window.saveAndHome};
function cacheGet(k){try{return JSON.parse(localStorage.getItem(CACHE+k)||'null')}catch(e){return null}}

function v3(fn){var args=[].slice.call(arguments,1);return new Promise(function(resolve,reject){var r=google.script.run.withSuccessHandler(resolve).withFailureHandler(function(e){reject(new Error(e&&e.message?e.message:String(e)))});if(fn==='getMathsV3Bootstrap')r.getMathsV3Bootstrap();else if(fn==='getMathsProgressV3')r.getMathsProgressV3();else if(fn==='getStarredRevisionV3')r.getStarredRevisionV3();else if(fn==='startMathsV3Quiz')r.startMathsV3Quiz(args[0]);else if(fn==='getMathsV3ResumeInfo')r.getMathsV3ResumeInfo(args[0]);else if(fn==='resumeMathsV3Session')r.resumeMathsV3Session(args[0]);else if(fn==='toggleImportantV3')r.toggleImportantV3(args[0],args[1]);else if(fn==='toggleDifficultV3')r.toggleDifficultV3(args[0],args[1]);else if(fn==='getSessionAttemptMapV3')r.getSessionAttemptMapV3(args[0]);else reject(new Error('Unknown V3 call: '+fn));});}
function groupFor(chapter){var x=String(chapter||'').toLowerCase();if(/fraction pattern|triplet|calculation memory|square|cube/.test(x))return'misc';if(/percentage|profit|loss|discount|ratio|proportion|average|mixture|alligation|interest|time.*work|pipe|cistern|speed|distance|train|boat|stream|partnership|ages|work.*wage/.test(x))return'arithmetic';return'advanced'}

async function startV3(request){loading(true);try{var s=await v3('startMathsV3Quiz',request);loading(false);if(!s||s.ok===false){toast((s&&s.message)||'No eligible questions');return}openQuiz(s)}catch(e){loading(false);toast(e.message||String(e))}}

function renderHome(data){if(app.view!=='home')return;var d=app.bootstrap.dashboard||{},resume=app.bootstrap.resume,pending=(d.pending||[]).slice(0,2),s=data.schedule||{},day=Number(s.day||d.day||0),chapter=String(s.chapter||d.todayChapter||'');var html='<div class="content grid">';if(resume)html+='<div class="v3-card row between"><div><div class="eyebrow">Continue Practice</div><b>'+esc(resume.title)+'</b><div class="muted" style="font-size:12px">Q'+(Number(resume.currentIndex||0)+1)+'/'+Number(resume.total||0)+'</div></div><button class="btn soft" id="v3ResumeHome">Resume</button></div>';html+='<div class="v3-card v3-hero"><div class="eyebrow">Today’s Maths</div><h2 style="margin:5px 0">'+esc(day>0?'Day '+day+' · '+chapter:'Daily Practice')+'</h2><div class="muted">20-question target</div><div class="v3-stats"><div><b>20</b>Daily</div><div><b>'+Number(data.starred||0)+'</b>Starred</div><div><b>'+Number(data.difficult||0)+'</b>Difficult</div></div><button class="btn primary" id="v3Daily" style="margin-top:12px">'+(day>0?'Start / Continue':'Start')+'</button></div>';if(pending.length){html+='<div class="section-title">Pending</div><div class="list">'+pending.map(function(p){return '<div class="v3-card row between"><div><b>Day '+Number(p.day)+' · '+esc(p.chapter)+'</b><div class="muted" style="font-size:12px">'+esc(p.status||'Pending')+'</div></div><button class="btn soft" data-day="'+Number(p.day)+'">Open</button></div>'}).join('')+'</div>'}html+='<div class="v3-grid2"><div class="v3-card v3-click" id="v3New"><div class="eyebrow">🆕 New Practice</div><b>'+Number(data.newCount||0)+' unseen</b><div class="muted" style="font-size:12px;margin-top:4px">Fresh material by chapter</div></div><div class="v3-card v3-click" id="v3Star"><div class="eyebrow">⭐ Starred Revision</div><b>'+Number(data.starred||0)+' important</b><div class="muted" style="font-size:12px;margin-top:4px">'+Number(data.difficult||0)+' difficult</div></div></div><div class="section-title">Progress</div><div class="v3-metrics"><div class="v3-metric"><b>'+Number(data.coverage||0)+'%</b><span class="muted">Coverage</span></div><div class="v3-metric"><b>'+Number(data.accuracy||0)+'%</b><span class="muted">Accuracy</span></div><div class="v3-metric"><b>'+Number(data.weak||0)+'</b><span class="muted">Weak</span></div></div></div>';$('#main').innerHTML=html;if(resume)$('#v3ResumeHome').onclick=function(){resumeQuiz(resume.sessionId)};$('#v3Daily').onclick=function(){beginQuiz('daily',{planDay:day||undefined})};$('#v3New').onclick=openGlobalNewV3;$('#v3Star').onclick=openStarredRevisionV3;$('#main').querySelectorAll('[data-day]').forEach(function(b){b.onclick=function(){beginQuiz('daily',{planDay:Number(b.dataset.day)})}})}
async function home(){app.view='home';nav('home');var cached=cacheGet('home');if(cached)renderHome(cached);try{var data=await v3('getMathsV3Bootstrap');cacheSet('home',data);renderHome(data)}catch(e){if(!cached)toast(e.message||String(e))}}
function chapters(){app.view='chapters';nav('chapters');var list=app.bootstrap.chapters||[],groups={advanced:[],arithmetic:[],misc:[]};list.forEach(function(c){groups[groupFor(c.chapter)].push(c)});var mock=(app.bootstrap.demandSets||[]).find(function(s){return String(s.setId)==='MOCK_QUESTIONS'});$('#main').innerHTML='<div class="content"><div class="section-title">Practice Hub</div><div class="v3-groups"><div class="v3-card v3-group v3-click" data-group="advanced"><div class="eyebrow">Advanced</div><div><b>'+groups.advanced.length+' chapters</b><div class="muted">Geometry, Algebra & more</div></div></div><div class="v3-card v3-group v3-click" data-group="arithmetic"><div class="eyebrow">Arithmetic</div><div><b>'+groups.arithmetic.length+' chapters</b><div class="muted">Percentage, Ratio & more</div></div></div><div class="v3-card v3-group v3-click" data-group="misc"><div class="eyebrow">MISC</div><div><b>'+groups.misc.length+' banks</b><div class="muted">Recall material</div></div></div><div class="v3-card v3-group v3-click" data-group="mocks"><div class="eyebrow">Mocks</div><div><b>'+(mock?Number(mock.count||0):0)+' questions</b><div class="muted">Saved Mock Questions</div></div></div></div></div>';$('#main').querySelectorAll('[data-group]').forEach(function(x){x.onclick=function(){openStudyGroup(x.dataset.group)}})}
function openStudyGroup(key){if(key==='mocks')return openMocksV3();var list=(app.bootstrap.chapters||[]).filter(function(c){return groupFor(c.chapter)===key}),title=key==='advanced'?'Advanced':key==='arithmetic'?'Arithmetic':'MISC',total=list.reduce(function(a,c){return a+Number(c.total||0)},0);app.view='chapters';nav('chapters');$('#main').innerHTML='<div class="content"><button class="btn ghost" id="v3GroupBack">← Practice Hub</button><div style="margin:15px 2px 12px"><div class="eyebrow">'+esc(title)+'</div><div class="quiz-title">'+total+' cards</div></div><div class="v3-card">'+sixActions()+'</div><div class="section-title">Chapters</div><div class="list">'+list.map(function(c){return '<div class="v3-card v3-click" data-chapter="'+esc(c.chapter)+'"><div class="row between"><div><b>'+esc(c.chapter)+'</b><div class="muted" style="font-size:12px">'+Number(c.total||0)+' cards</div></div><span class="tag">Open</span></div></div>'}).join('')+'</div></div>';$('#v3GroupBack').onclick=chapters;bindSix($('#main'),{scope:'group',chapters:list.map(function(c){return c.chapter}),groupName:key,title:title});$('#main').querySelectorAll('[data-chapter]').forEach(function(x){x.onclick=function(){openChapterHub(x.dataset.chapter)}});window.scrollTo(0,0)}
function openMocksV3(){var set=(app.bootstrap.demandSets||[]).find(function(s){return String(s.setId)==='MOCK_QUESTIONS'});if(!set){toast('Mock Questions set not found.');return}app.view='chapters';nav('chapters');$('#main').innerHTML='<div class="content"><button class="btn ghost" id="v3MockBack">← Practice Hub</button><div style="margin:15px 2px 12px"><div class="eyebrow">Mocks</div><div class="quiz-title">Mock Questions</div><div class="muted">'+Number(set.count||0)+' saved questions</div></div><div class="v3-card">'+sixActions()+'</div></div>';$('#v3MockBack').onclick=chapters;bindSix($('#main'),{scope:'demand_set',setId:'MOCK_QUESTIONS',title:'Mock Questions'});window.scrollTo(0,0)}
function openChapterHub(chapter){var c=(app.bootstrap.chapters||[]).find(function(x){return String(x.chapter)===String(chapter)});if(!c){toast('Chapter not found');return}app.view='chapters';nav('chapters');var attempted=Math.max(0,Number(c.total||0)-Number(c.remaining||0)),pct=Number(c.total||0)?Math.round(attempted*100/Number(c.total)):0,topics=c.majorTopics||[];if(normalizeName(chapter)==='coordinate geometry'){var map={};topics.forEach(function(t){map[normalizeName(t.name)]=t});topics=['Questions','Concepts'].map(function(n){return map[normalizeName(n)]||{name:n,key:n,total:0,active:0}})}$('#main').innerHTML='<div class="content"><button class="btn ghost" id="v3ChapterBack">← Chapters</button><div style="margin:15px 2px 12px"><div class="eyebrow">Chapter</div><div class="quiz-title" style="font-size:26px">'+esc(chapter)+'</div><div class="muted" style="margin-top:5px">'+Number(c.total||0)+' cards · '+attempted+' attempted</div><div class="v3-progress"><i style="width:'+pct+'%"></i></div></div><div class="v3-card">'+sixActions()+'</div><div class="section-title">Study banks</div><div class="v3-topic-grid">'+topics.map(function(t){return '<div class="v3-card v3-click" data-topic="'+esc(t.key||t.name)+'"><b>'+esc(t.name)+'</b><div class="muted" style="margin-top:5px">'+Number(t.total||0)+' cards</div></div>'}).join('')+'</div></div>';$('#v3ChapterBack').onclick=chapters;bindSix($('#main'),{scope:'chapter',chapter:chapter,title:chapter});$('#main').querySelectorAll('[data-topic]').forEach(function(x){x.onclick=function(){openTopicHub(chapter,x.dataset.topic)}});window.scrollTo(0,0)}
function normalizeName(x){return String(x||'').trim().toLowerCase()}
function openTopicHub(chapter,key){var c=(app.bootstrap.chapters||[]).find(function(x){return String(x.chapter)===String(chapter)}),t=c&&(c.majorTopics||[]).find(function(x){return String(x.key||x.name)===String(key)||normalizeName(x.name)===normalizeName(key)});if(!t)t={name:key,key:key,total:0,active:0};app.view='chapters';nav('chapters');$('#main').innerHTML='<div class="content"><button class="btn ghost" id="v3TopicBack">← '+esc(chapter)+'</button><div style="margin:15px 2px 12px"><div class="eyebrow">'+esc(chapter)+'</div><div class="quiz-title" style="font-size:25px">'+esc(t.name)+'</div><div class="muted" style="margin-top:5px">'+Number(t.total||0)+' cards</div></div><div class="v3-card">'+sixActions()+'</div></div>';$('#v3TopicBack').onclick=function(){openChapterHub(chapter)};bindSix($('#main'),{scope:'topic',chapter:chapter,majorTopic:t.key||t.name,title:chapter+' · '+t.name});window.scrollTo(0,0)}
function library(){return base.library()}
function ondemand(){var sets=(app.bootstrap.demandSets||[]).filter(function(s){return String(s.setId)!=='MOCK_QUESTIONS'}),calc=sets.find(function(s){return String(s.setId)==='CALC_TRAINING'}),others=sets.filter(function(s){return String(s.setId)!=='CALC_TRAINING'});app.view='ondemand';nav('ondemand');$('#main').innerHTML='<div class="content grid"><div class="section-title">On Demand</div>'+(calc?'<div class="v3-card row between"><div><div class="eyebrow">Calculation Training</div><b>'+Number(calc.dayCount||0)+' days · '+Number(calc.count||0)+' questions</b><div class="muted" style="font-size:12px">30-day calculation-speed program</div></div><button class="btn soft" id="v3Calc">Open</button></div>':'')+'<div class="v3-card"><div class="eyebrow">Quick Practice</div><div class="v3-grid2" style="margin-top:10px"><button class="btn ghost" id="v3Squares">□ Squares</button><button class="btn ghost" id="v3Cubes">▣ Cubes</button><button class="btn ghost" id="v3Mixed">⚡ Mixed Memory</button></div></div>'+(others.length?'<div class="section-title">Saved Sets</div><div class="list">'+others.map(function(s){return '<div class="v3-card row between"><div><b>'+esc(s.name)+'</b><div class="muted" style="font-size:12px">'+Number(s.count||0)+' questions</div></div><button class="btn soft" data-set="'+esc(s.setId)+'">Practice</button></div>'}).join('')+'</div>':'')+'</div>';if(calc)$('#v3Calc').onclick=function(){openCalculationHub('CALC_TRAINING')};$('#v3Squares').onclick=function(){beginQuiz('generated',{chapter:'Calculation Memory',topic:'Squares',count:20,title:'Squares · Quick Practice'})};$('#v3Cubes').onclick=function(){beginQuiz('generated',{chapter:'Calculation Memory',topic:'Cubes',count:20,title:'Cubes · Quick Practice'})};$('#v3Mixed').onclick=function(){beginQuiz('generated',{chapter:'Calculation Memory',count:20,title:'Squares + Cubes · Mixed'})};$('#main').querySelectorAll('[data-set]').forEach(function(b){b.onclick=function(){startDemandSet(b.dataset.set)}})}

function renderProgress(data){if(app.view!=='progress')return;$('#main').innerHTML='<div class="content grid"><div class="section-title">Progress</div>'+metricCard('Overall',data.overall||{})+'<div class="v3-grid2">'+metricCard('Advanced',data.advanced||{})+metricCard('Arithmetic',data.arithmetic||{})+'</div><div class="section-title">By Chapter</div><div class="list">'+(data.chapters||[]).map(function(c){return '<div class="v3-card"><div class="row between"><b>'+esc(c.chapter)+'</b><span class="tag">'+Number(c.metric.coverage||0)+'%</span></div><div class="muted" style="font-size:12px;margin-top:5px">Accuracy '+Number(c.metric.accuracy||0)+'% · Weak '+Number(c.metric.weak||0)+' · Starred '+Number(c.metric.starred||0)+' · New '+Number(c.metric.unseen||0)+'</div><div class="muted" style="font-size:12px;margin-top:4px">Questions '+Number(c.questions.attempted||0)+'/'+Number(c.questions.total||0)+' · Concepts '+Number(c.concepts.attempted||0)+'/'+Number(c.concepts.total||0)+'</div></div>'}).join('')+'</div></div>'}
async function openGlobalNewV3(){app.view='new';nav('home');loading(true);try{var data=await v3('getMathsProgressV3');loading(false);$('#main').innerHTML='<div class="content"><button class="btn ghost" id="v3NewBack">← Home</button><div class="section-title">New Practice</div><div class="v3-card"><button class="btn primary" id="v3NewAll">Practice New Across Maths</button></div><div class="section-title">By Chapter</div><div class="list">'+(data.chapters||[]).filter(function(c){return Number(c.metric.unseen||0)>0}).map(function(c){return '<div class="v3-card row between"><div><b>'+esc(c.chapter)+'</b><div class="muted" style="font-size:12px">'+Number(c.metric.unseen||0)+' unseen</div></div><button class="btn soft" data-newchapter="'+esc(c.chapter)+'">Practice</button></div>'}).join('')+'</div></div>';$('#v3NewBack').onclick=home;$('#v3NewAll').onclick=function(){countPicker('New Practice',{scope:'all',kind:'new',title:'New Practice'})};$('#main').querySelectorAll('[data-newchapter]').forEach(function(b){b.onclick=function(){countPicker(b.dataset.newchapter+' · New',{scope:'chapter',chapter:b.dataset.newchapter,kind:'new',title:b.dataset.newchapter})}})}catch(e){loading(false);toast(e.message||String(e))}}
async function openStarredRevisionV3(){app.view='starred';nav('home');loading(true);try{var data=await v3('getStarredRevisionV3');loading(false);var all=allChapterNames();$('#main').innerHTML='<div class="content"><button class="btn ghost" id="v3StarBack">← Home</button><div class="section-title">Starred Revision</div><div class="v3-metrics"><div class="v3-metric"><b>'+Number(data.stats.total||0)+'</b><span class="muted">All</span></div><div class="v3-metric"><b>'+Number(data.stats.important||0)+'</b><span class="muted">Important</span></div><div class="v3-metric"><b>'+Number(data.stats.difficult||0)+'</b><span class="muted">Difficult</span></div></div><div class="v3-actions" style="margin-top:12px"><button class="btn soft" id="v3StarAll">⭐ Important</button><button class="btn warn" id="v3DiffAll">🔥 Difficult</button><button class="btn ghost" id="v3WeakAll">🎯 Weak</button></div><div class="section-title">Saved Questions</div><div class="list">'+(data.items||[]).slice(0,100).map(function(x){return '<div class="v3-card"><div>'+((x.important)?'<span class="v3-badge star">Important</span>':'')+((x.difficult)?'<span class="v3-badge diff">Difficult</span>':'')+'</div><b style="display:block;margin-top:6px">'+esc(x.chapter)+'</b><div class="muted" style="font-size:12px;margin-top:4px">'+esc(String(x.question||'').slice(0,150))+'</div></div>'}).join('')+'</div></div>';$('#v3StarBack').onclick=home;$('#v3StarAll').onclick=function(){countPicker('Starred Revision',{scope:'group',chapters:all,kind:'starred',title:'Starred Revision'})};$('#v3DiffAll').onclick=function(){countPicker('Difficult Revision',{scope:'group',chapters:all,kind:'difficult',title:'Difficult Revision'})};$('#v3WeakAll').onclick=function(){countPicker('Weak Revision',{scope:'group',chapters:all,kind:'weak',title:'Weak Revision'})}}catch(e){loading(false);toast(e.message||String(e))}}
window.openQuestionJump=async function(){if(!app.quiz||!app.quiz.questions||!app.quiz.questions.length)return;var total=app.quiz.questions.length,current=app.quiz.index+1,map={};try{map=await v3('getSessionAttemptMapV3',app.quiz.sessionId)}catch(e){}var modal=$('#modal'),buttons='';modal.className='modal';for(var i=1;i<=total;i++){var q=app.quiz.questions[i-1],s=map[String(q.questionId||'')]||'',cls=s==='correct'?'qj-correct':s==='wrong'?'qj-wrong':s==='seen'?'qj-seen':'';if(i===current)cls+=' qj-current';buttons+='<button class="btn ghost '+cls+'" data-jump-q="'+i+'">'+i+'</button>'}modal.innerHTML='<div class="sheet"><div class="row between"><div><div class="eyebrow">Question selector</div><div class="quiz-title">Jump to question</div></div><button class="iconbtn" id="jumpClose">×</button></div><div class="muted" style="font-size:12px;margin-top:5px"><span style="color:var(--ok)">● Correct</span> · <span style="color:var(--bad)">● Wrong</span> · <span style="color:var(--warn)">● Revealed</span> · Neutral unanswered</div><div class="question-jump-grid">'+buttons+'</div></div>';$('#jumpClose').onclick=closeModal;modal.querySelectorAll('[data-jump-q]').forEach(function(btn){btn.onclick=function(){var target=Math.max(1,Math.min(total,Number(btn.dataset.jumpQ||1)));closeModal();app.quiz.index=target-1;app.qStart=Date.now();renderQuestion();window.scrollTo(0,0);server('saveSessionPosition',app.quiz.sessionId,app.quiz.index).catch(function(){})}})};
window.renderQuestion=function(){base.renderQuestion();if(!app.quiz)return;var q=app.quiz.questions[app.quiz.index],master=$('#masterBtn'),mark=$('#markBtn'),tools=document.querySelector('.dock-tools'),counter=document.querySelector('.quiz-head .tag');if(counter){counter.classList.add('quiz-jump-tag');counter.textContent='Q '+(app.quiz.index+1)+'/'+app.quiz.questions.length+' ▾';counter.onclick=window.openQuestionJump}if(master)master.style.display='none';if(mark&&q){mark.textContent=(q.important||q.marked)?'⭐ Important':'☆ Important';mark.className='btn '+((q.important||q.marked)?'warn':'ghost')+' small';mark.onclick=async function(){try{var r=await v3('toggleImportantV3',q.questionId,app.quiz.sessionId);q.important=r.important;q.marked=r.important;cacheDrop('home');cacheDrop('progress');renderQuestion()}catch(e){toast(e.message||String(e))}}}if(tools&&q){var old=tools.querySelector('[data-v3-difficult]');if(old)old.remove();var d=document.createElement('button');d.setAttribute('data-v3-difficult','1');d.className='btn '+(q.difficult?'warn':'ghost')+' small';d.textContent=q.difficult?'🔥 Difficult':'◇ Difficult';d.onclick=async function(){try{var r=await v3('toggleDifficultV3',q.questionId,app.quiz.sessionId);q.difficult=r.difficult;cacheDrop('home');cacheDrop('progress');renderQuestion()}catch(e){toast(e.message||String(e))}};tools.appendChild(d)}};
window.saveAndHome=function(){if(app.quiz&&app.quiz.sessionId)server('saveSessionPosition',app.quiz.sessionId,app.quiz.index).catch(function(){});return base.saveAndHome()};
window.showView=function(view){app.view=view;$('#nav').classList.remove('hidden');nav(view);if(view==='home')return home();if(view==='chapters')return chapters();if(view==='library')return library();if(view==='ondemand')return ondemand();if(view==='progress')return progress();return base.showView(view)};
window.home=home;window.chapters=chapters;window.library=library;window.ondemand=ondemand;window.progress=progress;window.openChapterHub=openChapterHub;window.openTopicHub=openTopicHub;window.openStudyGroup=openStudyGroup;window.openGlobalNewV3=openGlobalNewV3;window.openStarredRevisionV3=openStarredRevisionV3;
})();
</script>
