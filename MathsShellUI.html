<style>
/* Final shell: persistent header metrics, English-like Home density, no DOM observer. */
.brand h1{font-size:20px!important;letter-spacing:-.02em}.brand small{font-size:12px!important}.topbar{padding:10px 14px!important}.iconbtn{width:34px!important;height:34px!important}

/* Persistent scope strip lives OUTSIDE #main so async renderers cannot delete it. */
.maths-global-strip{padding:9px 14px 7px;background:var(--bg);border-bottom:1px solid color-mix(in srgb,var(--line) 72%,transparent)}
.v7-strip{display:grid!important;grid-template-columns:1.12fr repeat(3,minmax(0,1fr))!important;gap:5px!important;margin:0!important;width:100%!important}
.v7-strip span{display:flex!important;align-items:center!important;justify-content:center!important;gap:3px!important;min-width:0!important;padding:7px 4px!important;border-radius:999px!important;border:1px solid var(--line)!important;font-size:10.5px!important;font-weight:850!important;line-height:1!important;white-space:nowrap!important;box-shadow:none!important}
.v7-strip .coverage{color:#a4afff!important;border-color:color-mix(in srgb,#8396ff 34%,var(--line))!important;background:color-mix(in srgb,#8396ff 8%,transparent)!important}
.v7-strip .wrong{color:#ff7f89!important;border-color:color-mix(in srgb,#ef5b64 39%,var(--line))!important;background:color-mix(in srgb,#ef5b64 8%,transparent)!important}
.v7-strip .difficult{color:#b79cff!important;border-color:color-mix(in srgb,#9b7cff 39%,var(--line))!important;background:color-mix(in srgb,#9b7cff 8%,transparent)!important}
.v7-strip .starred{color:#e8bd66!important;border-color:color-mix(in srgb,#e6ad3f 37%,var(--line))!important;background:color-mix(in srgb,#e6ad3f 8%,transparent)!important}
.v5-scope-strip,.v4-strip-wrap,.v6-scope,.v6-module-panel>.v6-strip,.v7-page-strip,.maths-top-strip{display:none!important}
.metric-wrong{color:#ff7f89!important}.metric-difficult{color:#b79cff!important}.metric-starred{color:#e8bd66!important}

/* Standard compact actions. */
.v7-actions,.v6-actions,.v4-actions,.v3-actions{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:7px!important}
.v7-actions .btn,.v6-actions .btn,.v4-actions .btn,.v3-actions .btn{min-height:39px!important;padding:7px 5px!important;font-size:10.5px!important;border-radius:11px!important;background:color-mix(in srgb,var(--primary) 9%,var(--card))!important;border:1px solid color-mix(in srgb,var(--primary) 22%,var(--line))!important;color:var(--primary)!important;box-shadow:none!important}
.v7-action-shell,.maths-single-actions{padding:10px!important;border-radius:14px!important;box-shadow:none!important}

/* Home: resilient styling applies even after server refresh replaces the DOM. */
#main>.content:has(.v3-hero){padding:14px!important;gap:10px!important}
#main>.content:has(.v3-hero) .v3-hero{padding:18px 18px 17px!important;border-radius:18px!important;background:linear-gradient(135deg,#3656d8 0%,#7288eb 100%)!important;box-shadow:0 10px 28px rgba(39,68,180,.18)!important;color:#fff!important}
#main>.content:has(.v3-hero) .v3-hero .eyebrow{font-size:11px!important;letter-spacing:.08em!important;color:#e4e9ff!important}
#main>.content:has(.v3-hero) .v3-hero h2{font-size:25px!important;line-height:1.12!important;letter-spacing:-.025em!important;margin:5px 0 9px!important;max-width:94%}
#main>.content:has(.v3-hero) .v3-hero>.muted{font-size:13px!important;line-height:1.35!important;color:rgba(255,255,255,.82)!important;margin-bottom:7px!important}
#main>.content:has(.v3-hero) .v3-hero .btn{min-height:40px!important;margin-top:11px!important;padding:8px 12px!important;border-radius:11px!important;font-size:12px!important;background:#fff!important;color:#3152c7!important;box-shadow:none!important}
.final-goal-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;margin-top:7px}.final-goal-row b{font-size:13px}.final-daily-track{height:6px;background:rgba(255,255,255,.28);border-radius:99px;overflow:hidden;margin:7px 0 6px}.final-daily-track i{display:block;height:100%;background:#fff;border-radius:99px}.final-daily-note{font-size:10px;color:rgba(255,255,255,.74)}
#main>.content:has(.v3-hero) .v4-resume-line{padding:10px 11px!important;border-radius:14px!important;box-shadow:none!important;background:var(--card)!important;min-height:60px}
#main>.content:has(.v3-hero) .v4-resume-line b{font-size:12px!important}#main>.content:has(.v3-hero) .v4-resume-line .muted{font-size:9.5px!important}#main>.content:has(.v3-hero) .v4-resume-line .btn{min-height:38px!important;padding:7px 12px!important;font-size:11px!important;border-radius:10px!important}
#main>.content:has(.v3-hero) .v4-home-grid{display:grid!important;grid-template-columns:1fr!important;gap:8px!important;margin-top:4px!important}
#main>.content:has(.v3-hero) .v4-home-grid::before{content:'Quick Start';display:block;font-size:13px;font-weight:900;margin:8px 0 0;grid-column:1}
#main>.content:has(.v3-hero) .v4-home-grid .v3-card{min-height:62px!important;padding:10px 12px!important;border-radius:14px!important;display:grid!important;grid-template-columns:34px minmax(0,1fr) auto!important;grid-template-rows:auto auto!important;align-items:center!important;column-gap:8px!important;background:var(--card)!important;box-shadow:none!important}
#main>.content:has(.v3-hero) .v4-home-grid .v3-card::before{grid-column:1;grid-row:1/3;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--primary) 10%,var(--card));font-size:16px}
#main>.content:has(.v3-hero) #v4new::before{content:'✨'}#main>.content:has(.v3-hero) #v4star::before{content:'★'}#main>.content:has(.v3-hero) #v4concept::before{content:'＋'}
#main>.content:has(.v3-hero) .v4-home-grid .v3-card::after{content:'›';grid-column:3;grid-row:1/3;color:var(--muted);font-size:19px}
#main>.content:has(.v3-hero) .v4-home-grid .eyebrow{grid-column:2;grid-row:1;font-size:12px!important;letter-spacing:0!important;text-transform:none!important;color:var(--text)!important}
#main>.content:has(.v3-hero) .v4-home-grid b{grid-column:2;grid-row:2;font-size:10px!important;color:var(--muted)!important;font-weight:600!important;margin-top:2px}

/* Progress stays vivid after background refresh because core classes carry the palette. */
.v7-progress-overview>div{background:var(--card)!important;box-shadow:none!important}.v7-progress-overview>div:nth-child(3){border-color:color-mix(in srgb,#ef5b64 38%,var(--line))!important}.v7-progress-overview>div:nth-child(4){border-color:color-mix(in srgb,#9b7cff 38%,var(--line))!important}.v7-progress-overview>div:nth-child(5){border-color:color-mix(in srgb,#e6ad3f 38%,var(--line))!important}.v7-progress-overview>div:nth-child(3) b{color:#ff7f89!important}.v7-progress-overview>div:nth-child(4) b{color:#b79cff!important}.v7-progress-overview>div:nth-child(5) b{color:#e8bd66!important}
.v7-progress-track{height:6px!important}.v7-progress-track i{background:#72d994!important}.v7-star-hero{background:color-mix(in srgb,#e6ad3f 6%,var(--card))!important;border-color:color-mix(in srgb,#e6ad3f 25%,var(--line))!important;box-shadow:none!important}

/* Pause sheet. */
.maths-pause-sheet{padding:17px 16px calc(17px + env(safe-area-inset-bottom))!important}.maths-pause-sheet h2{font-size:19px!important;margin:0 0 5px!important}.maths-pause-sheet p{font-size:11px!important;margin:0 0 13px!important}.maths-pause-sheet .final-pause-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.maths-pause-sheet .btn{min-height:41px!important;font-size:11px!important;border-radius:11px!important}

@media(max-width:390px){.maths-global-strip{padding:8px 10px 6px}.v7-strip{gap:3px!important}.v7-strip span{font-size:9.3px!important;padding:6px 2px!important}.v7-actions .btn,.v6-actions .btn,.v4-actions .btn,.v3-actions .btn{font-size:9.8px!important}#main>.content:has(.v3-hero){padding:12px!important}#main>.content:has(.v3-hero) .v3-hero h2{font-size:23px!important}}
</style>
<script>
(function(){
'use strict';
var routeLock=0;
function q(s,r){return (r||document).querySelector(s)}
function qa(s,r){return Array.from((r||document).querySelectorAll(s))}
function isHome(){return window.app&&app.view==='home'}
function routeFromTarget(target){if(!isHome())return '';var el=target&&target.closest&&target.closest('button,[role="button"],.v3-card,.v4-card,.v7-card,.home-card,.list-card,.v3-click');if(!el)return '';var text=String(el.textContent||'').replace(/\s+/g,' ').trim().toLowerCase(),oc=String(el.getAttribute&&el.getAttribute('onclick')||'').toLowerCase();if(text.indexOf('starred revision')>=0||oc.indexOf('openstarredrevision')>=0)return 'starred';if(text.indexOf('new practice')>=0||oc.indexOf('openglobalnew')>=0)return 'new';return ''}
function hardRoute(kind,e){var now=Date.now();if(now-routeLock<420){if(e){e.preventDefault();e.stopImmediatePropagation()}return true}routeLock=now;if(e){e.preventDefault();e.stopImmediatePropagation()}if(kind==='new'&&typeof window.openGlobalNewV3==='function'){window.openGlobalNewV3();return true}if(kind==='starred'&&typeof window.openStarredRevisionV3==='function'){window.openStarredRevisionV3();return true}return false}
document.addEventListener('pointerup',function(e){var k=routeFromTarget(e.target);if(k)hardRoute(k,e)},true);document.addEventListener('click',function(e){var k=routeFromTarget(e.target);if(k)hardRoute(k,e)},true);

function metricCall(req){return new Promise(function(ok,bad){google.script.run.withSuccessHandler(ok).withFailureHandler(bad).getMathsScopeMetricV6(req||{})})}
function snapshotCall(){return new Promise(function(ok,bad){google.script.run.withSuccessHandler(ok).withFailureHandler(bad).getMathsSnapshotV6(false)})}
function stripHtml(m){m=m||{};return '<div class="v7-strip"><span class="coverage">Coverage '+Number(m.coverage||0)+'%</span><span class="wrong">✕ '+Number(m.wrong||0)+' Wrong</span><span class="difficult">◆ '+Number(m.difficult||0)+'</span><span class="starred">☆ '+Number(m.starred||0)+'</span></div>'}
function stripNode(){return q('#maths-global-strip')}
function clearGlobalStrip(){var x=stripNode();if(x)x.remove()}
function showGlobalStrip(m){if(!window.app||app.view==='home'||app.view==='quiz'){clearGlobalStrip();return}var main=q('#main'),appEl=main&&main.parentElement;if(!main||!appEl)return;var x=stripNode();if(!x){x=document.createElement('div');x.id='maths-global-strip';x.className='maths-global-strip';appEl.insertBefore(x,main)}x.innerHTML=stripHtml(m||{})}
function removeInnerStrips(root){root=root||q('#main');if(!root)return;qa('.v7-page-strip,.v5-scope-strip,.v4-strip-wrap,.v6-scope,.maths-top-strip',root).forEach(function(x){x.remove()});qa('.v6-module-panel>.v6-strip',root).forEach(function(x){x.remove()})}
function semanticize(root){root=root||q('#main');if(!root)return;qa('.v7-chapter-line,.v7-summary,.v6-line',root).forEach(function(el){if(el.dataset.semantic==='1')return;var h=el.innerHTML;h=h.replace(/(\d+\s+wrong)/gi,'<span class="metric-wrong">$1</span>');h=h.replace(/(✕\s*Wrong(?:\s*<b>[^<]*<\/b>)?)/gi,'<span class="metric-wrong">$1</span>');h=h.replace(/(◆\s*(?:Difficult\s*)?(?:<b>[^<]*<\/b>|\d+))/gi,'<span class="metric-difficult">$1</span>');h=h.replace(/(☆\s*(?:Starred\s*)?(?:<b>[^<]*<\/b>|\d+))/gi,'<span class="metric-starred">$1</span>');el.innerHTML=h;el.dataset.semantic='1'})}
function normalizeActions(root){root=root||q('#main .content');if(!root||window.app&&app.view==='starred')return;var grids=qa('.v7-actions,.v6-actions,.v4-actions,.v3-actions',root).filter(function(g){return !g.closest('#modal')&&!g.closest('.v7-history-body')});if(grids.length<=1)return;var keep=grids[grids.length-1];grids.slice(0,-1).forEach(function(g){var p=g.parentElement;g.remove();if(p&&p!==root&&!String(p.textContent||'').trim()&&!p.children.length)p.remove()});if(keep&&keep.parentElement)keep.parentElement.classList.add('maths-single-actions')}
function normalizeCurrent(){var root=q('#main .content');if(!root)return;removeInnerStrips(root);normalizeActions(root);semanticize(root)}
function scheduleNormalize(){[0,60,180,450,950,1800].forEach(function(ms){setTimeout(normalizeCurrent,ms)})}

function polishHome(){if(!isHome())return;clearGlobalStrip();var root=q('#main .content'),hero=root&&q('.v3-hero',root);if(!root||!hero)return;var resume=q('.v4-resume-line',root),boot=app.bootstrap||{},r=boot.resume||null,h2=q('h2',hero),dayMatch=h2&&String(h2.textContent||'').match(/Day\s+(\d+)/i),day=dayMatch?Number(dayMatch[1]):1,target=20,current=0;if(r&&Number(r.total||0)===target)current=Math.min(target,Math.max(0,Number(r.currentIndex||0)));var left=Math.max(0,target-current),mut=q('.muted',hero);if(mut)mut.textContent='Finish today’s revision first, then use focused practice.';if(!q('.final-daily-meta',hero)){var goal=document.createElement('div');goal.className='final-daily-meta';goal.innerHTML='<div class="final-goal-row"><span>Today’s Goal</span><b>'+current+' / '+target+'</b></div><div class="final-daily-track"><i style="width:'+(target?Math.round(current*100/target):0)+'%"></i></div><div class="final-daily-note">20 questions · '+left+' left</div>';var btn=q('#v4daily',hero);if(btn){hero.insertBefore(goal,btn);btn.textContent=current>0?'Continue Day '+day+' · '+left+' left':'Start Day '+day+' · '+target+' left'}}if(resume){var oldTitle=q('b',resume),oldDetail=q('.muted',resume),t=oldTitle?oldTitle.textContent:'Practice',dailyTitle=h2?String(h2.textContent||'').toLowerCase():'';var stripped=String(t||'').toLowerCase().replace(/^day\s*\d+\s*·\s*/,'');if(stripped&&dailyTitle.indexOf(stripped)>=0){resume.style.display='none'}else{resume.style.display='flex';if(oldTitle)oldTitle.textContent='Resume paused extra practice';if(oldDetail&&!String(oldDetail.textContent||'').toLowerCase().includes('q'))oldDetail.textContent=t+' · '+oldDetail.textContent;if(hero.nextElementSibling!==resume)hero.insertAdjacentElement('afterend',resume)}}}
function scheduleHome(){[0,80,250,600,1200,2200].forEach(function(ms){setTimeout(polishHome,ms)})}

function polishPause(){var m=q('#modal');if(!m||m.classList.contains('hidden'))return;var sheet=q('.sheet',m),h=sheet&&q('h2',sheet);if(!sheet||!h||String(h.textContent||'').toLowerCase().indexOf('paused')<0)return;sheet.classList.add('maths-pause-sheet');h.textContent='Practice paused';var a=q('#v4resumequiz',sheet),b=q('#v4savehome',sheet);if(a)a.textContent='Continue';if(a&&b&&!q('.final-pause-actions',sheet)){var wrap=document.createElement('div');wrap.className='final-pause-actions';a.parentElement.insertBefore(wrap,a);wrap.appendChild(a);wrap.appendChild(b)}}
document.addEventListener('click',function(e){if(e.target&&e.target.closest&&e.target.closest('#v4pausebtn'))setTimeout(polishPause,0)},false);

function groupReq(k){if(k==='mocks')return {scope:'demand_set',setId:'MOCK_QUESTIONS',title:'Mock Questions'};var list=(app.bootstrap&&app.bootstrap.chapters||[]).filter(function(c){var x=String(c.chapter||'').toLowerCase(),g=/fraction pattern|triplet|calculation memory|square|cube/.test(x)?'misc':/percentage|profit|loss|discount|ratio|proportion|average|mixture|alligation|interest|time.*work|pipe|cistern|speed|distance|train|boat|stream|partnership|ages|work.*wage/.test(x)?'arithmetic':'advanced';return g===k});return {scope:'group',chapters:list.map(function(c){return c.chapter}),groupName:k,title:k}}
function wrapMetric(name,reqFn){var fn=window[name];if(typeof fn!=='function'||fn.__stableMetric)return;var w=function(){var args=arguments,r=fn.apply(this,args),req=reqFn.apply(null,args);scheduleNormalize();showGlobalStrip({});metricCall(req).then(function(m){if(window.app&&app.view!=='home'&&app.view!=='quiz'){showGlobalStrip(m);scheduleNormalize()}}).catch(function(){});return r};w.__stableMetric=true;window[name]=w}
wrapMetric('openChapterHub',function(ch){return {scope:'chapter',chapter:String(ch),title:String(ch)}});wrapMetric('openTopicHub',function(ch,t){return {scope:'topic',chapter:String(ch),majorTopic:String(t),title:String(t)}});wrapMetric('openStudyGroup',function(k){return groupReq(k)});wrapMetric('startDemandSet',function(id){return {scope:'demand_set',setId:String(id),title:'Saved Set'}});wrapMetric('openCalculationHub',function(id){return {scope:'demand_set',setId:String(id),title:'Calculation Training'}});

function wrapHub(name,mode){var fn=window[name];if(typeof fn!=='function'||fn.__stableHub)return;var w=function(){var r=fn.apply(this,arguments);scheduleNormalize();if(mode==='progress'){var c=null;try{c=JSON.parse(localStorage.getItem('maths-v7:progress')||'null')}catch(e){}if(c&&c.overall)showGlobalStrip(c.overall);snapshotCall().then(function(d){if(app.view==='progress'){showGlobalStrip(d.overall||{});scheduleNormalize()}}).catch(function(){})}else if(mode==='starred'){showGlobalStrip({});metricCall({scope:'star_history',starLo:1,starHi:999999}).then(function(m){if(app.view==='starred'){showGlobalStrip(m);scheduleNormalize()}}).catch(function(){})}else{[20,120,420,950].forEach(function(ms){setTimeout(function(){var inner=q('#main .v7-page-strip .v7-strip,#main .v7-strip');if(inner&&app.view!=='home'&&app.view!=='quiz'){var shell=stripNode();if(!shell)showGlobalStrip({});shell=stripNode();if(shell)shell.innerHTML=inner.outerHTML}normalizeCurrent()},ms)})}return r};w.__stableHub=true;window[name]=w}
wrapHub('openGlobalNewV3','new');wrapHub('openStarredRevisionV3','starred');wrapHub('openConceptsV4','concepts');wrapHub('progress','progress');

var oldHome=window.home;if(typeof oldHome==='function'){window.home=function(){var r=oldHome.apply(this,arguments);scheduleHome();return r}}
var oldShowView=window.showView;if(typeof oldShowView==='function'){window.showView=function(v){if(v==='home')clearGlobalStrip();var r=oldShowView.apply(this,arguments);if(v==='home')scheduleHome();else scheduleNormalize();return r}}
document.addEventListener('DOMContentLoaded',function(){if(isHome())scheduleHome();scheduleNormalize()});setTimeout(function(){if(isHome())scheduleHome();scheduleNormalize()},0);
})();
</script>
